[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmodel-engine"
version = "0.1.0"
description = "tmodel knowledge-graph engine (walking skeleton: health/version over a loopback-only local API)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []  # stdlib only for the skeleton (offline, easy to bundle)

[project.scripts]
tmodel = "engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
