# Report pages published as static HTML from archdoc markdown.
# Revision = the source's front-matter `version`; the page regenerates only when
# the source changes (not per build). Rendered by render_report.py.
# NO personal identities in output — enforced by check_identities.py.
schema: tmodel.publishing/v0
id: pub-reports
status: draft
security:
  remote_scripts: false
  trackers: false
  links: relative
reports:
  - src: research/0013-sdl-conformance/sdl-report.md
    out: docs/reports/sdl.html
    title: "Secure Development Lifecycle"
    links:
      - { text: "SDL bibliography", href: "../bibliography/" }
      - { text: "Requirements crosswalk (MAP-0001)", href: "../bibliography/crosswalk.html" }
      - { text: "SDL object model", href: "sdl-object-model.html" }
      - { text: "tmodel SDL (example)", href: "../sdl/index.html" }
  - src: research/0013-sdl-conformance/sdl-object-model.md
    out: docs/reports/sdl-object-model.html
    title: "SDL object model (consolidated, RPT-0013-OM)"
    links:
      - { text: "Secure Development Lifecycle report", href: "sdl.html" }
      - { text: "Requirements crosswalk (MAP-0001)", href: "../bibliography/crosswalk.html" }
# Pages under docs/reports/ that another renderer writes. The index lists them
# after the reports; render_tara.py checks that each of its pages is listed here
# with the same title.
listed:
  - page: docs/reports/tara-mvp-02.html
    title: "TARA draft v0 (example data): Telematics Control Unit"
    note: "draft v0 · example data · ISO/SAE 21434 clause 15 order · built by render_tara.py"
