# MAP-0001 v0.2.0 full matrix (generated by the crosswalk build in the session scratchpad; hand-curated rows, machine-checked ids and provenance)
schema: tmodel-mapping/v1
id: MAP-0001
version: 0.2.0
status: draft
updated: '2026-10-03'
companion_of: spec/MAP-0001-sdl-requirements-crosswalk.md
description: 'Full matrix: 34 normalized SDL requirements x 16 frameworks. Every id is the target record''s own id (record-local in ids, fully qualified in refs). Each id carries its provenance in per_id.'
method:
  hub: 'NIST SSDF 1.1 tasks are the hub: most source-published mappings target SSDF task ids. A row is defined by its anchors (normally SSDF tasks; rows without an SSDF equivalent use the defining requirement of another framework).'
  provenance:
    anchor: the row's defining requirement (or a record-hierarchy child / SAMM activity of it; a parent of an anchor is not an anchor)
    direct: a publisher maps this id to a row anchor (src names the publisher)
    chained: a publisher maps this id to another id in the same row that is itself anchor/direct (exactly one extra hop; never through a chained or bridge id), or it is a record-hierarchy CHILD of such an id. A parent that only inherits from a mapped child is ours. ETSI SSDIF-X takes the class of SSDF X in the same row (clause 5.0.1 identity).
    bridge: a publisher maps this id to a non-column requirement that states the row (e.g. BSI TR-03183-1 RH controls, CISA attestation form)
    ours: our judgement from reading both records; one-line rationale in ours_rationale
  counting: frameworks_sourced = number of the 16 columns whose primary cell holds at least one anchor/direct/chained/bridge id (MS SDL counts if either the current set or SDL 5.2 qualifies). frameworks_nonempty also counts ours-only cells.
  editions: 'Mappings published against older editions (SSDF cites BSIMM12, SAMM 1.5, MSSDL-2021, ASVS 4.0.3; SAMM maps to BSIMM14) are translated only where a published table proves the id (BSIMM16 Table 3/Table 9 lineage; ASVS 5 v4.0.3 mapping file); otherwise the old ids are kept verbatim in also[] with an edition tag and refs: [].'
  not_adopted: 'also[] entries with adopted: false list ids that a publisher maps to the row''s SSDF task(s) but that are not the atomic requirement of this row.'
