contradictions:
  curated:
  - id: C-01
    severity: major
    rows:
    - 7
    - 20
    title: 'SBOM: where CRA Annex I Part II(1) belongs'
    text: 'ETSI TS 104 219 Annex A maps CRA Annex I Part II(1) (identify components, draw up an SBOM) only to SSDIF PW.4.1/PW.4.4 (third-party components) and maps no CRA provision to PS.3.2. SSDF 1.1 itself files the NTIA SBOM reference under PS.3.2, OSPS maps its SBOM requirement (OSPS-QA-02.02) to PS.3.2 and to CRA 2.1 (= Part II(1)), and ENISA Annex C maps playbook 4.14 (inventory + SBOM) to Part II(1). The same split recurs for UK APC claim 1.2.1: ETSI B.1 -> PW.4.1, OSPS -> PS.3.2 (via OSPS-QA-02.0x).'
    evidence:
    - library:etsi-ts-104-219#SSDIF-PW.4.1
    - library:eu-cra-2024-2847#AnnexI-PartII(1)
    - library:sp-800-218#PS.3.2
    - library:openssf-osps-baseline#OSPS-QA-02.02
    - library:enisa-sbd-playbook-2026#PB-4.14
    - library:uk-software-security-code-of-practice#APC-1.2-01
    resolution: SBOM is its own row (20) anchored on PS.3.2; Part II(1) is kept in row 7 (ETSI, direct) and row 20 (OSPS chain) with this note.
  - id: C-02
    severity: major
    rows:
    - 3
    - 5
    - 14
    - 15
    - 18
    - 26
    - 28
    title: 'OWASP SAMM contradicts itself: stream sheet vs OLIR workbook'
    text: 'The two SAMM-published SSDF mappings disagree on 15 SSDF tasks. Disjoint on 5: PO.1.1 (stream sheet G-SM-A/B; OLIR G-PC-1-A, G-PC-2-B), PO.2.3 (G-PC-A vs G-SM-2-A), PO.4.2 (G-PC-B vs G-SM-3-B, V-ST-1-A), PW.7.1 and PW.8.1 (G-SM-A vs G-PC-1-A). The architecture-assessment streams are swapped: the stream sheet puts V-AA-A at PW.1.1 and V-AA-B at PW.2.1/PW.9.1, OLIR puts V-AA-1-B at PW.1.1 and V-AA-2-A at PW.2.1, V-AA-1-A at PW.9.1. RV.1.1: V-ST-B vs V-ST-2-A.'
    evidence:
    - library:owasp-samm-2#V-AA-A
    - library:owasp-samm-2#V-AA-B
    - library:sp-800-218#PW.1.1
    - library:sp-800-218#PW.2.1
    resolution: Both mappings are carried; per_id names which one sourced each SAMM id. Row 5 keeps V-AA-A (OLIR) and V-AA-B (stream sheet).
  - id: C-03
    severity: minor
    rows:
    - 5
    - 10
    - 11
    - 18
    - 23
    title: SSDF References vs SAMM map on IEC 62443-4-1 ids (10 ids)
    text: 'SD-3 (design reviews): SSDF -> PW.2.1; SAMM -> V-AA-A, which the SAMM stream sheet ties to PW.1.1. DM-1 (receive/track reported issues): SSDF -> PW.4.4, RV.1.1-RV.1.3; SAMM -> I-DM-A (RV.2.x remediation). SVV-2 (threat-mitigation testing): SSDF -> PO.4.2, PW.7.2, PW.8.x, RV.1.2; SAMM -> V-AA-B (design review). SM-5 (process scoping): SSDF -> PW.7.1, PW.8.2; SAMM -> G-PC-B. DM-5 (inform users): SSDF -> RV.1.3; SAMM -> O-EM-B (patching). SI-2, SM-8, SM-12, SVV-5: SAMM -> G-PC-A (policy) vs SSDF task-specific placements.'
    evidence:
    - library:iec-62443-4-1-2018#SD-3
    - library:iec-62443-4-1-2018#DM-1
    - library:iec-62443-4-1-2018#SVV-2
    resolution: SSDF References placement used for IEC cells (same edition, requirement-level); SAMM placement noted.
  - id: C-04
    severity: minor
    rows:
    - 3
    - 10
    - 11
    - 15
    - 17
    - 18
    title: SSDF References (BSIMM12->16) vs SAMM map (BSIMM14->16) on 40 BSIMM activities
    text: 'Examples: SM2.6 "Require security sign-off prior to software release" - SSDF -> PO.4.1 (release criteria), SAMM -> D-TA-A (application risk profile). SM1.4/SM1.7 security checkpoints - SSDF -> PO.4.x, SAMM -> G-PC-A (policy). AM2.1/AM3.4 attack patterns - SSDF -> PW.1.1, SAMM -> V-RT-B (abuse-case testing). CMVM1.2 - SSDF -> RV.1.1/RV.2.1, SAMM -> O-IM-A (incident detection). CR2.8 and PT1.2 - SSDF -> PW.7.2/PW.8.2, SAMM -> I-DM-A (defect tracking).'
    evidence:
    - library:bsimm-16#SM2.6
    - library:bsimm-16#SM1.7
    - library:bsimm-16#AM2.1
    - library:bsimm-16#CMVM1.2
    resolution: Both kept; cells use the SSDF placement, SAMM placement listed in per_id/also. BSIMM16 Table 3 agrees with our Table 9 translation of the SSDF References (0 differences).
  - id: C-05
    severity: minor
    rows:
    - 2
    - 10
    - 11
    - 16
    - 18
    - 23
    title: CISA attestation form vs SP 800-218 Appendix A (EO 14028 4e -> SSDF)
    text: Form item III.2 (EO 4e(iii)) maps to PO.1.1, PW.7.1, PW.8.1 and RV.1.1 in addition to SP 800-218 Table 2's nine tasks; III.4 (4e(iv)) adds RV.1.3; III.3 (4e(vi)) equals Table 2 but omits RV.2.2, which the SSDF References column cites for 4e(vi).
    evidence:
    - library:cisa-ssdf-attestation-form-2024#III.2
    - library:cisa-ssdf-attestation-form-2024#III.4
    - library:sp-800-218#RV.2.2
    resolution: Corroboration only (CISA form is not a column); flagged for the attestation work.
  - id: C-06
    severity: minor
    rows:
    - 17
    - 22
    - 24
    title: 'SSDF internal: RV.2.2 EO 14028 mapping'
    text: RV.2.2 References cite EO 4e(iv), 4e(vi), 4e(viii), 4e(ix); Appendix A Table 2 lists RV.2.2 under 4e(iv), 4e(v), 4e(viii). Only task where the two disagree (recorded in the sp-800-218 verification).
    evidence:
    - library:sp-800-218#RV.2.2
    resolution: No effect on cells.
  - id: C-07
    severity: major
    rows:
    - 3
    - 20
    - 2
    title: ETSI Annex B.2 vs its upstream (SSDF References)
    text: 'Ten B.2 rows printed as a second "PW.1.1" are SSDF PS.3.2 rows (BSAFSS SM.2, BSIMM SE3.6, CNCF, EO 4e(vi)/(vii)/(ix)/(x), NTIA SBOM "All", SCVS, SAFECode SCSIC/SCTPC, SP 800-53/-161 SA-8, SR-3, SR-4): read literally, SBOM evidence lands on threat modelling. B.2 also omits SSDF''s BSIMM references for PO.1.1-PO.1.3 (27 ids) and prints MASVS "1.1" for "1.10". For the column frameworks (IEC, SAMM 1.5, MSSDL, SCFPSSD, ASVS 4.0.3) B.2 otherwise replicates the SSDF References exactly, so it is not independent evidence.'
    evidence:
    - library:etsi-ts-104-219#SSDIF-PW.1.1
    - library:sp-800-218#PS.3.2
    resolution: B.2 rows keyed to PS.3.2 (ssdf_1_1_task flag); B.2 not counted as a separate publisher.
  - id: C-08
    severity: minor
    rows:
    - 5
    - 10
    title: 'BSI TR-03185 Part 2: code peer review "induced by" design review'
    text: QA.06 "All changes to the source code SHOULD be peer-reviewed" is "Induced by SSDF PW.2.1" (design review) and by OSPS-AC-03 (branch protection). SSDF/ETSI place code review at PW.7.x.
    evidence:
    - library:bsi-tr-03185#QA.06
    - library:sp-800-218#PW.2.1
    - library:sp-800-218#PW.7.2
    resolution: QA.06 placed in row 10 (ours, rationale recorded).
  - id: C-09
    severity: minor
    rows:
    - 14
    - 16
    - 24
    - 33
    title: OSPS vs ETSI B.1 on UK APC claims (16 row-disjoint pairs)
    text: 'APC-1.4-03 (no default passwords): OSPS relates it to OSPS-BR-07 (secrets; SSDF PO.x/PW.5.1), ETSI B.1 to PW.9 (secure defaults). APC-3.5-01 (updates distributed): OSPS via OSPS-VM-01.01 (CVD policy, RV.1.3), ETSI to RV.2.2. APC-2.1-01 (build-environment roles): OSPS via OSPS-GV-03 (contribution guide, PW.1.2), ETSI to PO.5.1/PS.1.1. APC-3.4-02 (customers informed): OSPS via OSPS-BR-02 (version ids), ETSI to RV.2.2.'
    evidence:
    - library:uk-software-security-code-of-practice#APC-1.4-03
    - library:uk-software-security-code-of-practice#APC-3.5-01
    resolution: ETSI B.1 (claim-level, single-purpose) preferred; OSPS links recorded as support.
  - id: C-10
    severity: minor
    rows:
    - 23
    title: 'OSPS internal: CVD-policy control mapped away from the UK CVD principle'
    text: OSPS-VM-01.01 (publish a CVD policy) maps to UK claims 3.4.1, 3.5.1, 4.1.2, while OSPS-VM-02.01/VM-03.01 map to principle 3.2 (the CVD principle). ETSI B.1 maps claims 3.2.1/3.2.2 to RV.1.1.
    evidence:
    - library:openssf-osps-baseline#OSPS-VM-01.01
    - library:uk-software-security-code-of-practice#3.2
    resolution: Row 23 uses principle 3.2 and its claims.
  - id: C-11
    severity: info
    rows:
    - 6
    - 7
    title: 'SSDF References: PW.4.1 -> MSSDL #6 (cryptography)'
    text: SSDF 1.1 cites MSSDL (2021) practice 6 "Define and use cryptography standards" for PW.4.1 (acquire well-secured third-party components); practice 7 is third-party components. Copied verbatim into ETSI B.2.
    evidence:
