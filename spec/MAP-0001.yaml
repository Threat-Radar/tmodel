    resolution: 'Kept as old-edition evidence in row 6 also[]. Review 2026-10-03: not shown to be an error - MSSDL-2021 practice 6 tells teams to use vetted cryptographic libraries, which is a case of PW.4.1 (acquire well-secured components); downgraded from minor to info, no cell depends on it.'
