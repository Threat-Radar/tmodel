    evidence: ["https://nvd.nist.gov/vuln/detail/CVE-2023-1389"]
  - id: assertion:inject-step-exploits-cve-2023-1389
    name: The injection step exploits CVE-2023-1389 (AI-proposed)
    description: NVD describes an unauthenticated command injection in the web management interface; CISA lists it as exploited in the wild (added 2023-05-01).
    subject: attack-step:inject-command
