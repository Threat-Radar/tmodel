  - id: assertion:root-step-targets-router-control
    name: The last step takes control of the router (AI-proposed)
    description: >-
      NVD: the injected commands run as root, with confidentiality, integrity and availability
      all rated High. ZDI-23-451 also gives root. ZDI's blog reports botnets using the flaw
      to enlist routers.
    subject: attack-step:run-as-root
    predicate: targets_element
