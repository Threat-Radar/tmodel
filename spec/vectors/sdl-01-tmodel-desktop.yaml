# ---- SDL practices (DL-0040 proposal class) ----------------------------------
sdl_practices:
  - id: sdl-practice:roles-governance
    name: Security roles and decision records
    description: Sponsor-owned decisions (ADR), team process (PROC-0001), CODEOWNERS and agent rules (CLAUDE.md).
    practice_key: roles-governance
    at_phase: lifecycle-phase:concept
    owner: party:nymble
    mitigation_status: complete
    produces: [evidence:proc-0001, evidence:claude-md, evidence:codeowners]
    in_program_node: [milestone:mvp-launch]
  - id: sdl-practice:security-requirements
    name: Define and track security requirements
    description: Requirement is a core class (ADR-0012) and library requirements are extracted (RPT-0017); this product has no selected requirement set yet.
    practice_key: security-requirements
    at_phase: lifecycle-phase:concept
    owner: party:student-team
    mitigation_status: in_progress
    implements: [requirement:ssdf-po-1-1]
    produces: [evidence:adr-0012, evidence:rpt-0017, evidence:map-0001]
    in_program_node: [milestone:i4-risk-mitigation]
  - id: sdl-practice:ai-assisted-development
    name: Rules for AI-assisted development
    description: AI output is a proposal until a human accepts it; the design log records accepts and rejections.
    practice_key: ai-assisted-development
    at_phase: lifecycle-phase:concept
    owner: party:nymble
    mitigation_status: complete
    produces: [evidence:claude-md, evidence:design-log]
    in_program_node: [milestone:mvp-launch]
  - id: sdl-practice:threat-modeling
    name: Threat model of the app itself
    description: Only the four-threat seed in this file exists, AI-drafted and unreviewed.
    practice_key: threat-modeling
    at_phase: lifecycle-phase:design
    owner: party:paria03
    mitigation_status: in_progress
    implements: [requirement:ssdf-pw-1-1]
    produces: [evidence:sdl-01-threat-model]
    in_program_node: [gate:release-0-1-0]
  - id: sdl-practice:design-review
    name: Design and architecture review
    description: ADRs with adversarial review passes; the presentation-layer reset is under review.
    practice_key: design-review
    at_phase: lifecycle-phase:design
    owner: party:nymble
    mitigation_status: in_progress
    produces: [evidence:adr-0003, evidence:issue-208]
    in_program_node: [milestone:i4-risk-mitigation]
  - id: sdl-practice:secure-toolchain
    name: Approved, pinned toolchain
    description: Actions pinned to SHAs, least-privilege permissions, no persisted checkout credentials, cargo fetch --locked. Rust toolchain floats.
    practice_key: secure-toolchain
    at_phase: lifecycle-phase:implementation
    owner: party:nymble
    mitigation_status: in_progress
    produces: [evidence:dl-0034, evidence:pr-206]
    in_program_node: [milestone:mvp-launch]
  - id: sdl-practice:third-party-components
    name: Third-party component risk
    description: Lockfiles for npm and Cargo; Dependabot alerts on but security updates off; pip installs are not hash-pinned.
    practice_key: third-party-components
    at_phase: lifecycle-phase:implementation
    owner: party:student-team
    mitigation_status: in_progress
    implements: [requirement:ssdf-pw-4-1]
    produces: [evidence:release-yml]
    in_program_node: [milestone:i4-risk-mitigation]
  - id: sdl-practice:code-review
    name: Code review before merge
    description: One approving review required on main, stale approvals dismissed. Admins can bypass, and did (#206); no static analysis (no CodeQL).
    practice_key: code-review-sast
    at_phase: lifecycle-phase:implementation
    owner: party:student-team
    mitigation_status: in_progress
    implements: [requirement:ssdf-pw-7-2]
    produces: [evidence:contributing, evidence:pr-template]
    in_program_node: [milestone:i4-risk-mitigation]
  - id: sdl-practice:protect-dev-environment
    name: Protect the repository
    description: Force pushes and branch deletion blocked on main; no required status checks and no required signed commits.
    practice_key: protect-dev-environment
    at_phase: lifecycle-phase:implementation
    owner: party:nymble
    mitigation_status: in_progress
    produces: [evidence:contributing]
    in_program_node: [milestone:i4-risk-mitigation]
  - id: sdl-practice:security-testing
    name: Automated tests in CI
    description: Engine pytest (including loopback-bind tests), frontend vitest, Rust tests and a bundle check run on every PR. No fuzzing or DAST.
    practice_key: security-testing
    at_phase: lifecycle-phase:verification
    owner: party:student-team
    mitigation_status: in_progress
    produces: [evidence:app-yml, evidence:test-api]
    in_program_node: [milestone:i4-risk-mitigation]
  - id: sdl-practice:secure-defaults
    name: Secure defaults in the app
    description: Engine API binds loopback only, checks Host and Origin; the webview has a restrictive CSP.
    practice_key: secure-defaults
    at_phase: lifecycle-phase:verification
    owner: party:student-team
    mitigation_status: complete
    produces: [evidence:server-py, evidence:tauri-conf]
    in_program_node: [milestone:mvp-launch]
  - id: sdl-practice:sbom
    name: SBOM for every release
    description: SPDX SBOM generated in release.yml and attested with the .dmg.
