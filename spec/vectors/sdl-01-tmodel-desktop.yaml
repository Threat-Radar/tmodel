# ---- Threat model of the app (small, AI-drafted, unreviewed) -----------------
weaknesses:
  - id: weakness:cwe-346
    name: Origin Validation Error
    catalog_ref: CWE-346
  - id: weakness:cwe-494
    name: Download of Code Without Integrity Check
    catalog_ref: CWE-494
  - id: weakness:cwe-829
    name: Inclusion of Functionality from Untrusted Control Sphere
    catalog_ref: CWE-829
  - id: weakness:cwe-502
    name: Deserialization of Untrusted Data
    catalog_ref: CWE-502

attack_patterns:
  - id: attack-pattern:capec-275
    name: DNS Rebinding
    catalog_ref: CAPEC-275
  - id: attack-pattern:capec-439
    name: Manipulation During Distribution
    catalog_ref: CAPEC-439
  - id: attack-pattern:capec-538
    name: Open-Source Library Manipulation
    catalog_ref: CAPEC-538
  - id: attack-pattern:capec-586
    name: Object Injection
    catalog_ref: CAPEC-586

threat_instances:
  - id: threat-instance:web-page-drives-local-api
    name: A web page in the user's browser drives the local engine API
    description: DNS rebinding or a cross-origin request reaches 127.0.0.1:47811 and reads or changes the model.
    method_facet: [stride]
    violates_property: "I confidentiality / T integrity"
    applies_in_phase: [lifecycle-phase:maintenance]
    targets_element: [component:local-api]
  - id: threat-instance:tampered-dmg
    name: A tampered .dmg reaches users
    description: >-
      A swapped release asset or a look-alike download runs on the user's Mac. Ad-hoc
      signing means Gatekeeper cannot tell the real build from a fake, and users are
      told to click Open Anyway.
    method_facet: [stride]
    violates_property: "T integrity"
    applies_in_phase: [lifecycle-phase:distribution]
    targets_element: [component:release-pipeline]
  - id: threat-instance:poisoned-build-input
    name: A compromised action or dependency poisons the build
    description: A third-party GitHub Action, npm, Cargo or pip package injects code during the release build.
    method_facet: [stride]
    violates_property: "T integrity"
    applies_in_phase: [lifecycle-phase:implementation, lifecycle-phase:distribution]
    targets_element: [component:release-pipeline]
  - id: threat-instance:malicious-model-file
    name: A malicious model or library file runs code in the engine
    description: A crafted YAML model or record abuses the loader to build objects or run code.
    method_facet: [stride]
    violates_property: "T integrity"
    applies_in_phase: [lifecycle-phase:maintenance]
    targets_element: [component:engine-sidecar]

mitigations:
  - id: mitigation:loopback-host-origin-check
    name: Loopback-only bind, Host check and Origin allowlist on the engine API
    description: engine/engine/api/server.py refuses non-loopback binds and Hosts and allows only the app's origins; Tauri CSP limits connect-src.
    mitigates: [threat-instance:web-page-drives-local-api]
    implementation_owner: party:student-team
    external_refs: ["engine/engine/api/server.py", "engine/tests/test_api.py", "apps/desktop/src-tauri/tauri.conf.json"]
    mitigation_status: complete
  - id: mitigation:slsa-provenance
    name: SLSA Build L2 provenance for the .dmg, engine and SBOM
    description: actions/attest-build-provenance in release.yml; users verify with `gh attestation verify`.
    mitigates: [threat-instance:tampered-dmg]
    implementation_owner: party:nymble
    external_refs: [".github/workflows/release.yml", "https://github.com/Threat-Radar/tmodel/pull/206"]
    mitigation_status: complete
  - id: mitigation:developer-id-notarization
    name: Developer ID signing and Apple notarization
    description: Not done; the Apple secrets are not set, so Gatekeeper warns on every install.
    mitigates: [threat-instance:tampered-dmg]
    implementation_owner: party:nymble
    mitigation_status: planned
  - id: mitigation:pinned-actions-least-privilege
    name: Actions pinned to commit SHAs, least-privilege permissions, split build and publish
    mitigates: [threat-instance:poisoned-build-input]
    implementation_owner: party:nymble
    external_refs: ["design-log/0034-slsa-release-pipeline/README.md", "https://github.com/Threat-Radar/tmodel/pull/206"]
    mitigation_status: complete
  - id: mitigation:hermetic-build
    name: Hermetic, hash-pinned build inputs (SLSA L3 gaps)
    description: Floating stable Rust, shared caches and unhashed pip installs remain; provenance is not from an isolated workflow.
    mitigates: [threat-instance:poisoned-build-input]
    implementation_owner: party:nymble
    mitigation_status: planned
  - id: mitigation:safe-yaml-loading
    name: Safe YAML loading in the engine
    description: Models load with yaml.safe_load; library records with BaseLoader (strings only).
    mitigates: [threat-instance:malicious-model-file]
    implementation_owner: party:student-team
    external_refs: ["engine/engine/load/vector.py", "engine/engine/load/library.py"]
    mitigation_status: complete

threat_models:
  - id: threat-model:tmodel-desktop-v0
    name: tmodel desktop app threat model (rev 0, draft)
    description: AI-drafted seed with four threats; not reviewed. The SDL threat-modeling practice owns it.
    members:
      - threat-instance:web-page-drives-local-api
      - threat-instance:tampered-dmg
      - threat-instance:poisoned-build-input
      - threat-instance:malicious-model-file
      - product:tmodel-desktop
    owner: party:paria03
    revision: "0"
    governance_status: draft
    approval_status: pending
    created: "2026-11-07T00:00:00Z"
    updated: "2026-11-07T00:00:00Z"

# ---- Requirements and candidate requirement sets -----------------------------
# `text` is our paraphrase; `source_locator` names the clause or task.
requirements:
  - id: requirement:ssdf-po-1-1
    name: SSDF PO.1.1
    text: Write down the security requirements for the development infrastructure and processes, and keep them current.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:sp-800-218#PO.1.1"
    source_locator: "SSDF 1.1 task PO.1.1"
    applies_to: [product:tmodel-desktop]
  - id: requirement:ssdf-pw-1-1
    name: SSDF PW.1.1
    text: Model the product's threats and attack surface, and use the result to drive design and mitigations.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:sp-800-218#PW.1.1"
    source_locator: "SSDF 1.1 task PW.1.1"
    applies_to: [product:tmodel-desktop]
  - id: requirement:ssdf-pw-4-1
    name: SSDF PW.4.1
    text: Acquire and maintain third-party components that are themselves well secured.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:sp-800-218#PW.4.1"
    source_locator: "SSDF 1.1 task PW.4.1"
    applies_to: [product:tmodel-desktop]
  - id: requirement:ssdf-pw-7-2
    name: SSDF PW.7.2
    text: Review or analyse code for vulnerabilities, and record and triage what is found.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:sp-800-218#PW.7.2"
    source_locator: "SSDF 1.1 task PW.7.2"
    applies_to: [product:tmodel-desktop]
  - id: requirement:ssdf-ps-2-1
    name: SSDF PS.2.1
    text: Publish information that lets users check that a release is genuine and unmodified.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:sp-800-218#PS.2.1"
    source_locator: "SSDF 1.1 task PS.2.1"
    applies_to: [product:tmodel-desktop]
    satisfied_by: [mitigation:slsa-provenance]
  - id: requirement:ssdf-ps-3-2
    name: SSDF PS.3.2
    text: Collect, protect and share provenance data for each release, such as an SBOM.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:sp-800-218#PS.3.2"
    source_locator: "SSDF 1.1 task PS.3.2"
    applies_to: [product:tmodel-desktop]
    satisfied_by: [mitigation:slsa-provenance]
  - id: requirement:ssdf-rv-1-3
    name: SSDF RV.1.3
    text: Have a policy, roles and a process for receiving vulnerability reports and fixing them.
    text_origin: paraphrase
    requirement_kind: organizational
    normativity: recommended
    source_ref: "library:sp-800-218#RV.1.3"
    source_locator: "SSDF 1.1 task RV.1.3"
    applies_to: [product:tmodel-desktop]
  - id: requirement:slsa-build-l2
    name: SLSA Build L2 provenance
    text: Each release artifact carries signed build provenance generated by a hosted build platform.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:slsa-1-2#R-0010"
    source_locator: "SLSA 1.2 Build track, level 2"
    applies_to: [product:tmodel-desktop]
    satisfied_by: [mitigation:slsa-provenance]
  - id: requirement:cra-annex-i-2-1
    name: CRA Annex I Part II(1)
    text: Identify and document the product's vulnerabilities and components, including an SBOM of at least the top-level dependencies.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: conditional
    source_ref: "library:eu-cra-2024-2847#AnnexI-PartII(1)"
    source_locator: "Regulation (EU) 2024/2847, Annex I Part II(1)"
    applies_to: [product:tmodel-desktop]
    maps_to: [requirement:ssdf-ps-3-2]
  - id: requirement:cra-annex-i-2-5
    name: CRA Annex I Part II(5)
    text: Put a coordinated vulnerability disclosure policy in place and follow it.
    text_origin: paraphrase
    requirement_kind: organizational
    normativity: conditional
    source_ref: "library:eu-cra-2024-2847#AnnexI-PartII(5)"
    source_locator: "Regulation (EU) 2024/2847, Annex I Part II(5)"
    applies_to: [product:tmodel-desktop]
    maps_to: [requirement:ssdf-rv-1-3]

requirement_sources:
