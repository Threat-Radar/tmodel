# ─────────────────────────────────────────────────────────────────────────────
# SDL EXAMPLE — the tmodel desktop app itself (this project), DL-0040
#
# One product's secure development lifecycle as a knowledge graph: the SDL
# program, its practices grouped by lifecycle phase, the work products that
# evidence them (repo paths, PRs, workflows, library records), the candidate
# governing requirement sets, proposed milestone names, open gaps, and a small
# threat model of the app. Rendered to docs/sdl/index.html by
# docs/publishing/render_sdl.py ("tmodel SDL").
#
# EXAMPLE DATA — NOT accepted truth and NOT a conformance claim. Every DEC-* stays
# open; SdlPractice / Evidence / RequirementSource are DL-0040 proposals that live
# only in example-container-sdl.linkml.yaml. Every selection below (practice as a
# delivery item, requirement set, milestone name) is a `proposed` Assertion with
# no Review: it waits for a human. Status values describe the repository as of
# 2026-11-07 and were drafted by an AI agent from repo evidence; a human has not
# reviewed them. People appear as github ids or roles only (CLAUDE.md); the page
# shows roles. Licensed standards: paraphrase and clause ids only (#154).
#
# Validate:
#   linkml-validate -s spec/vectors/example-container-sdl.linkml.yaml \
#     -C ExampleModelSdl spec/vectors/sdl-01-tmodel-desktop.yaml
#   python3 docs/publishing/render_sdl.py --check
# ─────────────────────────────────────────────────────────────────────────────

