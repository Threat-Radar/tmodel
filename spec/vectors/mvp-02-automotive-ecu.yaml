# ─────────────────────────────────────────────────────────────────────────────
# §8 MVP CORE VECTOR 2 — automotive / embedded domain (ADR-0002 breadth product)
#
# Acceptance evidence for DEC-001a. A worked attack-path knowledge graph for an
# automotive Telematics Control Unit (TCU), proving the CORE object model
# generalizes to a SECOND domain (ADR-0002 "diverse-domain architecture; generic
# model → diverse instance types"). The ISO 21434 TARA shape — asset / damage /
# threat-scenario — binds onto the SAME DamageScenario / ThreatInstance / RiskScore
# core classes and the same CWE/CVE/CAPEC backbone (§8 vector 2).
#
# CORE ONLY — no governance layer, no Environment/Deployment (§8: Environment is
# post-MVP, H3). Hardware/firmware instance identity (firmware digest + HBOM) is
# carried as opaque `identifiers` (ADR-0002 per-type instance identity).
#
# Exercises the §8 MVP capabilities: ingest (1), CVE→CWE propagation along
# composition (2), interactive graph View (3), AND/OR ordered AttackPaths (4/V5),
# composite-vector RiskScore with no Environment (5), human-reviewed vs AI-proposed
# via the Assertion+Review round-trip (6/V6) — here the AI hypothesis is explicitly
# REJECTED by a human (V6 "AI-proposed threat, human-rejected, with provenance").
#
# REQUIREMENTS (ADR-0012, Requirement in the core). Three ISO/SAE 21434 provisions
# (PARAPHRASED, clause ids only — the standard is licensed), one process / one
# audit / one documentation-producing. A GENERIC mitigation for the `connected-ecu`
# product family is `stated_as` a family Requirement (derived from 21434 RQ-09-09),
# which the TCU's own mitigation `satisfied_by`-discharges; a TCU requirement
# `refines` it. One AI-proposed requirement link stays a `proposed` Assertion with
# no Review (ingesting is not reviewing).
#
# TARA (#184 V1 to V4 and A1, #202 item 3). Two Assets (ADR-0011) carry the
# cybersecurity properties. The damage scenario names the vehicle function and the
# road users harmed, and points at the Asset it damages; the reviewed threat names
# its targets. The RiskScore gives the reason for each impact rating (ISO/SAE 21434
# Annex F examples, as RPT-0007 §3.1 paraphrases them), rates the remote path High
# by attack vector, names the risk matrix it read and records the treatment decision
# (reduce). A gateway-filter Requirement is satisfied_by the gateway mitigation. The
# AI-proposed threat is left as it was proposed. docs/publishing/render_tara.py
# builds docs/reports/tara-mvp-02.html from this file.
#
# EXAMPLE / TEST DATA — NOT accepted truth. DEC-001 OPEN; draft proposal. People as
# github ids / roles only. CVE/CWE/CAPEC ids illustrative. AI-proposed content is
# never presented as reviewed.
#
# Validate:
#   linkml-validate -s spec/vectors/example-container-core.linkml.yaml \
#     -C ExampleModelCore spec/vectors/mvp-02-automotive-ecu.yaml
# ─────────────────────────────────────────────────────────────────────────────

parties:
  - id: party:vehicle-oem
    name: Vehicle OEM
    description: Manufacturer of the vehicle integrating the TCU (role identity, §2b).
    party_kind: organization
    classifications: [manufacturer]
  - id: party:tier1-supplier
    name: Tier-1 TCU supplier
    party_kind: organization
    classifications: [supplier]
  - id: party:fleet-operator
    name: Fleet operator
    description: >-
      Owns the deployed vehicles: the owner this risk score is reported for
      (RiskScore.for_stakeholder). The impact ratings are for the road users harmed
      (ISO/SAE 21434 15.5), not for this party.
    party_kind: organization
    classifications: [asset-owner]
  - id: party:cna-auto
    name: Automotive CVE Numbering Authority
    party_kind: organization
    classifications: [cna]
  - id: party:av-reviewer
    name: "@av-reviewer"
    description: Human vehicle-cybersecurity reviewer / ISO 21434 assessor (github id, role).
    party_kind: person

products:
  - id: product:telematics-control-unit
    name: Telematics Control Unit (TCU)
    description: Cellular-connected telematics ECU bridging the mobile network and the in-vehicle CAN.
    composed_of: [component:tcu-soc, component:cellular-modem, component:tcu-firmware]
    manufactured_by: party:tier1-supplier
    supplied_by: party:tier1-supplier
    owned_by: party:fleet-operator
    identifiers:
      - "cpe:2.3:o:acme_auto:tcu:-:*:*:*:*:*:*:*"
      - "oem-part:TCU-0071"
    classifications: ["family:connected-ecu"]

product_instances:
  - id: product-instance:tcu-unit-7f21
    name: TCU unit 7F21
    description: >-
      A fielded unit. Hardware instance identity is the firmware image digest + a
      hardware part/serial: the HBOM/firmware form of ADR-0002 instance identity,
      carried as opaque `identifiers`.
    of_product: product:telematics-control-unit
    current_phase: lifecycle-phase:operation
    valid_from: "2026-05-01T00:00:00Z"
    owned_by: party:fleet-operator
    identifiers:
      - "swid:tcu-fw-5.2.0"
      - "sha256:7f21c0a9b8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a"
      - "hw-serial:TCU-7F21-2026W18"

components:
  - id: component:tcu-soc
    name: TCU system-on-chip
    description: Multi-core applications SoC hosting the telematics stack (§3 structural node).
    composed_of: [component:core-app, component:core-comms]
    identifiers:
      - "cpe:2.3:h:chipco:soc_t500:-:*:*:*:*:*:*:*"
  - id: component:core-app
    name: Application core
    description: General-purpose compute core running the telematics OS.
    identifiers:
      - "hw-core:soc_t500.app"
  - id: component:core-comms
    name: Communications core
    description: Core handling the cellular / CAN gateway path.
    identifiers:
      - "hw-core:soc_t500.comms"
  - id: component:cellular-modem
    name: Cellular modem module
    description: Remote attack surface; exposes a diagnostic service over the carrier network.
    uses_component: [component:diag-service-lib]
    identifiers:
      - "cpe:2.3:h:modemco:lte_m9:-:*:*:*:*:*:*:*"
  - id: component:diag-service-lib
    name: diagnostic-service library (firmware module)
    description: The remote diagnostic command handler along which the finding propagates (§5).
    identifiers:
      - "swid:tcu-diag-service@5.2.0"
  - id: component:tcu-firmware
    name: TCU firmware image
    description: The signed firmware artifact; its digest is the instance identity above.
    composed_of: [component:diag-service-lib]
    identifiers:
      - "swid:tcu-fw-5.2.0"
      - "sha256:7f21c0a9b8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a"

weaknesses:
  - id: weakness:cwe-306
    name: Missing Authentication for Critical Function
    description: "Generic weakness class (CWE, §1 layer 3): the unauthenticated diagnostic command path."
    catalog_ref: "CWE-306"

vulnerabilities:
  - id: vulnerability:cve-2026-41200
    name: Unauthenticated remote diagnostic command on TCU modem (illustrative)
    description: Finding affecting the product; propagation to components is a reviewed Assertion (§5).
    catalog_ref: "CVE-2026-41200"
    affects: [product:telematics-control-unit]
    reported_by: party:av-reviewer
    assigned_by: party:cna-auto

attack_patterns:
  - id: attack-pattern:capec-115
    name: Authentication Bypass
    description: Generic attack pattern (CAPEC = what, §2a). The CWE↔CAPEC link is a reviewed Assertion.
    catalog_ref: "CAPEC-115"

assets:
  - id: asset:safety-can-commands
    name: Safety CAN commands (braking)
    description: >-
      The brake request frames on the safety CAN bus, which the TCU's communications
      core can reach (ISO/SAE 21434 15.3). A forged or altered frame makes the brakes
      act on a request the driver never gave, so integrity and authenticity are the
      properties to protect.
    security_properties: [integrity, authenticity]
    processed_by: [component:core-comms]
  - id: asset:diagnostic-service
    name: Remote diagnostic service
    description: >-
      The diagnostic command handler the modem exposes over the carrier network. Only
      an authorized requester may run its commands, so authorization is the property
      to protect.
    security_properties: [authorization]
    processed_by: [component:diag-service-lib]

damage_scenarios:
  - id: damage-scenario:unauthorized-can-actuation
    name: Unauthorized CAN command → unsafe vehicle behavior
    description: >-
      ISO 21434 damage scenario (15.3). Vehicle function: braking. A brake command the
      driver never gave reaches the brakes while the vehicle is moving, so it brakes
      without warning and can be hit by following traffic or lose control. Road users
      harmed: the vehicle's occupants and the people around it (following vehicles,
      cyclists, pedestrians). The safety/financial/operational/privacy impact
      categories live on RiskScore (§3), not collapsed here.
    damages_asset: [asset:safety-can-commands]
    compromised_property: [integrity, authenticity]

threat_instances:
  - id: threat-instance:remote-diag-injection
    name: Remote unauthenticated diagnostic command injection onto CAN
    description: >-
      Human-elicited ISO 21434 TARA threat scenario, STRIDE-tagged. The 21434
      asset/damage/threat-scenario vocabulary binds onto the core classes (§8 V2).
    realizes_damage: damage-scenario:unauthorized-can-actuation
    method_facet: [stride]
    source_method: "iso21434-TARA + stride (human-elicited, reviewed)"
    violates_property: "S authentication / E authorization"
    applies_in_phase: [lifecycle-phase:operation]
    targets_element: [asset:diagnostic-service, asset:safety-can-commands]
  - id: threat-instance:infotainment-pivot
    name: Lateral movement from infotainment domain into the safety CAN domain
    description: >-
      AI-PROPOSED hypothesis. Its realizing edge is a `proposed` Assertion and the
      paired Review REJECTS it (CLAUDE.md: AI output is a hypothesis, never reviewed
      truth). source_method records the proposing method.
    realizes_damage: damage-scenario:unauthorized-can-actuation
    method_facet: [stride]
    source_method: "ai:llm-threat-proposer (hypothesis, unreviewed)"
    violates_property: "E authorization"
    applies_in_phase: [lifecycle-phase:operation]

attack_steps:
  # Path 1 — remote diagnostic injection; an AND gate at the injection step.
  - id: attack-step:reach-modem-over-cellular
    name: Reach the modem's diagnostic port over the carrier network
    kill_chain_phase: delivery
    precedes: [attack-step:inject-can-frame]
  - id: attack-step:bypass-diag-auth
    name: Bypass the missing/weak diagnostic authentication
    precedes: [attack-step:inject-can-frame]
  - id: attack-step:inject-can-frame
    name: Inject a crafted CAN frame to a safety actuator
    description: "Requires BOTH reachability over cellular AND an auth bypass: an AND gate (§2a)."
    gate: and_gate
    kill_chain_phase: exploitation
  # Path 2 — foothold then pivot; an OR gate at the foothold step (AI-proposed).
  - id: attack-step:compromise-companion-app
    name: Compromise the paired companion mobile app
    precedes: [attack-step:gain-infotainment-foothold]
  - id: attack-step:malicious-ota
    name: Deliver a malicious OTA update to the infotainment domain
    precedes: [attack-step:gain-infotainment-foothold]
  - id: attack-step:gain-infotainment-foothold
    name: Gain a foothold in the infotainment domain
    description: "Either a compromised companion app OR a malicious OTA suffices: an OR gate (§2a)."
    gate: or_gate
    precedes: [attack-step:pivot-to-can]
  - id: attack-step:pivot-to-can
    name: Pivot across the domain gateway onto the safety CAN bus
    kill_chain_phase: lateral_movement

attack_paths:
  - id: attack-path:remote-diag-injection
    name: Remote diagnostic-injection path
    description: >-
      Human-reviewed path realizing the remote-injection threat; feasibility human-rated
      (§3). Rated High by the attack-vector approach (ISO/SAE 21434 RC-15-14, G.4): the
      path starts over the cellular network, a network attack vector, which Table G.9
      rates High.
    steps:
      - attack-step:reach-modem-over-cellular
      - attack-step:bypass-diag-auth
      - attack-step:inject-can-frame
    realizes_threat: threat-instance:remote-diag-injection
    attack_feasibility: high
  - id: attack-path:infotainment-pivot
    name: Infotainment-to-CAN pivot path
    description: The AI-PROPOSED path; realizing edge is a `proposed` Assertion, human-REJECTED.
    steps:
      - attack-step:compromise-companion-app
      - attack-step:malicious-ota
      - attack-step:gain-infotainment-foothold
      - attack-step:pivot-to-can
    realizes_threat: threat-instance:infotainment-pivot
    attack_feasibility: very_low

mitigations:
  - id: mitigation:authenticate-diag-service
    name: Require strong authentication on the diagnostic service
    description: Control for the remote-injection threat (D3FEND-style catalog ref, §5).
    catalog_ref: "D3FEND:D3-MFA"
    mitigates: [threat-instance:remote-diag-injection]
    applies_in_phase: [lifecycle-phase:design, lifecycle-phase:implementation]
    implementation_owner: party:tier1-supplier
    external_refs: ["JIRA-TCU-310"]
    mitigation_status: complete
  - id: mitigation:domain-gateway-firewall
    name: Enforce a filtering gateway between infotainment and safety domains
    description: Control reducing cross-domain pivot; still being rolled out.
    catalog_ref: "D3FEND:D3-NTF"
    mitigates: [threat-instance:remote-diag-injection, threat-instance:infotainment-pivot]
    applies_in_phase: [lifecycle-phase:implementation, lifecycle-phase:production]
    implementation_owner: party:vehicle-oem
    external_refs: ["JIRA-TCU-355"]
    mitigation_status: in_progress
  - id: mitigation:family-authenticated-diagnostics
    name: Authenticate every remote diagnostic session (connected-ECU family)
    description: >-
      GENERIC mitigation for the whole `connected-ecu` product family, not for one
      product. It is stated as a Requirement (stated_as) so each family member can be
      checked against it; the TCU discharges it with its own mitigation
      (mitigation:authenticate-diag-service). No threat or status of its own.
    catalog_ref: "D3FEND:D3-MFA"
    implementation_owner: party:vehicle-oem
    stated_as: [requirement:family-authenticated-diagnostics]

risk_scores:
  - id: risk-score:remote-diag-injection
    name: "Risk: remote diagnostic injection"
    description: >-
      Composite vector per ADR-0006/DEC-003: feasibility + S/F/O/P impact +
      mitigation-status + derived risk, shown with its inputs. Safety-dominated.
      Computed WITHOUT an Environment parameter (§8 MVP).

      Impact (15.5), rated for the road users harmed, with the Annex F examples as
      RPT-0007 §3.1 paraphrases them. Safety severe: a brake command no one gave, at
      speed, can cause fatal or life-threatening injuries with survival uncertain,
      which is ISO 26262-3 class S3 (RQ-15-06). Financial major: crash repair, recovery
      and time off the road are serious costs that the road user can recover from.
      Operational severe: braking, a core vehicle function, behaves unexpectedly, and
      the vehicle cannot be trusted to drive until the unit is isolated or patched.
      Privacy negligible: this damage scenario exposes no personal information; data
      that the same diagnostic access could read would be a separate damage scenario.

      Feasibility (15.7): High, by attack vector (RC-15-14, G.4), as rated on the
      attack path.

      Risk values (15.8): one per impact category (RQ-15-15, NOTE 1), read from the
      example risk matrix in Annex H (Table H.8).

      Treatment decision (15.9): reduce (RQ-15-17). Diagnostic authentication is in
      place (complete) and the domain gateway filter is being rolled out (in
      progress); each is stated as a requirement. The score's mitigation status stays
      in progress until the filter is complete.
    threat: threat-instance:remote-diag-injection
    attack_paths: [attack-path:remote-diag-injection]
    damage_scenario: damage-scenario:unauthorized-can-actuation
    for_stakeholder: party:fleet-operator
    feasibility: high
    impact:
      safety: severe
      financial: major
      operational: severe
      privacy: negligible
    mitigation_status: in_progress
    risk: "safety 5 / financial 4 / operational 5 / privacy 1 (one attack path, feasibility High; 1 to 5 per ISO/SAE 21434 15.8, read from the Annex H example matrix, Table H.8)"

assertions:
  - id: assertion:vuln-propagation
    name: CVE propagates from the diagnostic lib to the product along uses_component/composed_of
    description: Reviewed propagation edge (§5), reified so a Review can point at it.
    subject: vulnerability:cve-2026-41200
    predicate: propagates_to
    object: component:tcu-firmware
    confidence: high
    assertion_status: accepted
  - id: assertion:cve-cwe-instance
    name: CVE-2026-41200 is an instance of CWE-306
    description: >-
      The CVE-to-CWE step of the ADR-0002 backbone (CVE, CWE, CAPEC, ATT&CK). Vulnerability
      has no Weakness slot, so the link is reified, with the predicate ARCH-0001 §3 and
      PLAN-0002 §5 name (RPT-0004 mapping.md, finding 7). In a real import the CWE comes
      from the CVE record and stays proposed until a human reviews it (R-018).
    subject: vulnerability:cve-2026-41200
    predicate: instance_of
    object: weakness:cwe-306
    confidence: high
    assertion_status: accepted
  - id: assertion:cwe-capec-map
    name: CWE-306 is exploited by CAPEC-115
    description: The human-reviewed CWE↔CAPEC mapping the schema calls out (§2).
    subject: weakness:cwe-306
    predicate: exploited_by
    object: attack-pattern:capec-115
    confidence: high
    assertion_status: accepted
  - id: assertion:remote-path-realizes
    name: "Human-reviewed: remote path realizes the injection threat"
    subject: attack-path:remote-diag-injection
    predicate: realizes_threat
    object: threat-instance:remote-diag-injection
    confidence: high
    assertion_status: accepted
  - id: assertion:ai-pivot-realizes
    name: "AI-proposed: infotainment-pivot path realizes the pivot threat"
    description: >-
      AI-PROPOSED edge. assertion_status `proposed` (NOT accepted); a hypothesis
      until a human accepts it. The paired Review REJECTS it.
    subject: attack-path:infotainment-pivot
    predicate: realizes_threat
    object: threat-instance:infotainment-pivot
    confidence: low
    assertion_status: proposed
  - id: assertion:ai-req-addresses-pivot
    name: "AI-proposed: the family diagnostics requirement addresses the infotainment pivot"
    description: >-
      AI-PROPOSED requirement link (ADR-0012). It is NOT written into the
      requirement's `addresses` slot; it stays a `proposed` Assertion with no Review
      until a human decides. Ingesting is not reviewing.
    subject: requirement:family-authenticated-diagnostics
    predicate: addresses
    object: threat-instance:infotainment-pivot
    confidence: low
    assertion_status: proposed

reviews:
  - id: review:vuln-prop
    name: "Review: accept vuln propagation"
    reviews: assertion:vuln-propagation
    reviewer: party:av-reviewer
    review_status: accepted
    priority: high
    justification: Diagnostic lib is in the firmware image and reachable from the modem; propagation confirmed.
  - id: review:cve-cwe
    name: Review, accept the CVE-to-CWE link
    reviews: assertion:cve-cwe-instance
    reviewer: party:av-reviewer
    review_status: accepted
    priority: medium
    justification: The CWE in the CVE record (illustrative) matches the root cause; the diagnostic command runs without authenticating the caller.
  - id: review:cwe-capec
    name: "Review: accept CWE↔CAPEC mapping"
    reviews: assertion:cwe-capec-map
    reviewer: party:av-reviewer
    review_status: accepted
    priority: medium
    justification: Authentication-bypass pattern matches the missing-authentication weakness.
  - id: review:remote-path
    name: "Review: accept remote-injection path"
    reviews: assertion:remote-path-realizes
    reviewer: party:av-reviewer
    review_status: accepted
    priority: high
    justification: Reproduced on the bench against firmware 5.2.0; path realizes the reviewed threat.
  - id: review:ai-pivot-reject
    name: "Review: AI-proposed infotainment pivot (REJECTED)"
    description: Human triage of the AI hypothesis; it is REJECTED, not accepted (V6).
    reviews: assertion:ai-pivot-realizes
    reviewer: party:av-reviewer
    review_status: rejected
    priority: low
    justification: >-
      AI-proposed path. The domain gateway blocks the only claimed pivot and the
      companion-app foothold is out of scope for this unit's configuration; rejected
      as not realizable here. Retained as a rejected hypothesis for provenance, NOT
      presented as a reviewed/accepted path.

requirements:
  - id: requirement:iso21434-rq-09-09
    name: "ISO/SAE 21434 RQ-09-09: define the item's cybersecurity requirements"
    text: >-
      For each cybersecurity goal, specify the cybersecurity requirements on the item
      and any requirements on its operational environment.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-09"
    source_locator: "RQ-09-09 (§9.5.2)"
    applies_to_family: ["family:connected-ecu"]
  - id: requirement:iso21434-rq-08-07
    name: "ISO/SAE 21434 RQ-08-07: manage each vulnerability"
    text: >-
      Handle every identified vulnerability either by assessing and treating its
      risk (per clause 15.9) so no unreasonable risk remains, or by eliminating it.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-07"
    source_locator: "RQ-08-07 (§8.6.2)"
    applies_to: [product:telematics-control-unit]
  - id: requirement:iso21434-rq-05-17
    name: "ISO/SAE 21434 RQ-05-17: independent cybersecurity audit"
    text: >-
      Have the organization's cybersecurity processes audited independently against
      the standard's objectives.
    text_origin: paraphrase
    requirement_kind: audit
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-05-17"
    source_locator: "RQ-05-17 (§5.4.7)"
    applies_to_family: ["family:connected-ecu"]
  - id: requirement:family-authenticated-diagnostics
    name: "Connected-ECU family: authenticate remote diagnostics"
    description: >-
      The generic family mitigation restated as a requirement (Mitigation.stated_as).
      Derived from the 21434 obligation to specify cybersecurity requirements.
    text: >-
      A connected ECU shall authenticate the requester before executing any
      diagnostic command received over a remote interface.
    text_origin: authored
    requirement_kind: technical
    normativity: mandatory
    derived_from: [requirement:iso21434-rq-09-09]
    addresses: [weakness:cwe-306, attack-pattern:capec-115]
    applies_to_family: ["family:connected-ecu"]
    satisfied_by: [mitigation:authenticate-diag-service]
  - id: requirement:tcu-diag-authentication
    name: "TCU: authenticate the modem diagnostic service"
    description: The family requirement made specific to the TCU's cellular diagnostic path.
    text: >-
      The TCU diagnostic-service library shall reject any diagnostic command arriving
      over the cellular modem unless the session is authenticated.
    text_origin: authored
    requirement_kind: technical
    normativity: mandatory
    refines: [requirement:family-authenticated-diagnostics]
    addresses: [threat-instance:remote-diag-injection]
    applies_to: [product:telematics-control-unit, component:diag-service-lib]
    satisfied_by: [mitigation:authenticate-diag-service]
  - id: requirement:gateway-filter-safety-can
    name: "Domain gateway: forward only allow-listed frames to the safety CAN"
    description: >-
      The TARA's reduce decision for the remote-injection risk (ISO/SAE 21434 15.9),
      stated as a requirement on the TCU's operational environment: the vehicle's
      domain gateway, which mvp-02 does not model as a component. Derived from the
      21434 obligation to specify requirements on the item and on its operational
      environment.
    text: >-
      The domain gateway shall forward to the safety CAN domain only the frames on its
      allow-list for the sending domain, and shall drop every other frame that arrives
      from the telematics or infotainment domain.
    text_origin: authored
    requirement_kind: technical
    normativity: mandatory
    derived_from: [requirement:iso21434-rq-09-09]
    addresses: [threat-instance:remote-diag-injection]
    satisfied_by: [mitigation:domain-gateway-firewall]

views:
  - id: view:tcu-attack-graph
    name: TCU attack-path graph
    description: >-
      Interactive-graph-able lens over this model (§10, R-014): projection `graph`,
      opened from a bounded focus query. A derived core View, never written back.
    projection: graph
    focus_query: "product:telematics-control-unit -> threat_instances -> attack_paths -> attack_steps"

lifecycle_phases:
  - id: lifecycle-phase:design
    name: Design
    code: design
  - id: lifecycle-phase:implementation
    name: Implementation
    code: implementation
  - id: lifecycle-phase:production
    name: Production / manufacturing
    code: production
  - id: lifecycle-phase:operation
    name: Operation / use
    code: operation
