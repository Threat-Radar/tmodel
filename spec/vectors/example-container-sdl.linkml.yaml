# Test-harness container for the SDL example (sdl-01-*.yaml, DL-0040).
#
# NOT part of the domain object model and NOT normative. It is the FULL container
# (core + the DEC-001b governed layer: SecurityProgram / Gate / Milestone /
# Checkpoint / ThreatModel) plus three PROPOSAL-LEVEL classes the SDL example needed
# and the object model does not have yet:
#
#   SdlPractice     an SDL activity a product team performs (MAP-0001 row)
#   WorkProduct     a deliverable / evidence item a practice produces (repo path, PR,
#                   workflow, attestation, page, library record)
#   RequirementSet  a candidate governing requirement set (SSDF, CRA, ISO/SAE 21434,
#                   IEC 62443-4-1, ...) that a product program may select
#
# Selection (which practices are delivery items, which requirement sets govern, what
# the milestones are called) is NOT a field here: it goes through the existing
# Assertion + Review spine (ARCH-0001 §4). An Assertion with no accepted Review is a
# proposal. Nothing in this file accepts a DEC-*; it is evidence for DEC-001b and
# RPT-0013-OM (SDLProgram, Evidence, RequirementProfile there). See DL-0040.
id: https://threat-radar.github.io/tmodel/schema/vectors/example-container-sdl
name: TmodelExampleContainerSdl
title: tmodel SDL example container (test harness, full model plus DL-0040 proposals)
description: >-
  Validation-only wrapper so an SDL example (the full model plus the SdlPractice,
  WorkProduct and RequirementSet proposals of DL-0040) validates as one file. Not
  normative; not a domain class.
version: 0.1.0
status: draft

prefixes:
  linkml: https://w3id.org/linkml/
  tmodel: https://threat-radar.github.io/tmodel/schema/object-model/
default_prefix: tmodel
default_range: string

imports:
  - linkml:types
  - ../schema/tmodel-object-model.linkml

classes:
  ExampleModelSdl:
    tree_root: true
    description: >-
      An SDL example bundle: the full ExampleModel collections (core plus the
      DEC-001b governed layer) plus the DL-0040 proposal collections. Flat lists;
      edges are id references. Referential integrity is checked by
      bin/render-sdl, not by linkml-validate.
    attributes:
      parties: { range: Party, multivalued: true, inlined: true, inlined_as_list: true }
      products: { range: Product, multivalued: true, inlined: true, inlined_as_list: true }
      product_instances: { range: ProductInstance, multivalued: true, inlined: true, inlined_as_list: true }
      components: { range: Component, multivalued: true, inlined: true, inlined_as_list: true }
      weaknesses: { range: Weakness, multivalued: true, inlined: true, inlined_as_list: true }
      vulnerabilities: { range: Vulnerability, multivalued: true, inlined: true, inlined_as_list: true }
      attack_patterns: { range: AttackPattern, multivalued: true, inlined: true, inlined_as_list: true }
      threat_instances: { range: ThreatInstance, multivalued: true, inlined: true, inlined_as_list: true }
      attack_steps: { range: AttackStep, multivalued: true, inlined: true, inlined_as_list: true }
      attack_paths: { range: AttackPath, multivalued: true, inlined: true, inlined_as_list: true }
      damage_scenarios: { range: DamageScenario, multivalued: true, inlined: true, inlined_as_list: true }
      mitigations: { range: Mitigation, multivalued: true, inlined: true, inlined_as_list: true }
      risk_scores: { range: RiskScore, multivalued: true, inlined: true, inlined_as_list: true }
      reviews: { range: Review, multivalued: true, inlined: true, inlined_as_list: true }
      assertions: { range: Assertion, multivalued: true, inlined: true, inlined_as_list: true }
      deployments: { range: Deployment, multivalued: true, inlined: true, inlined_as_list: true }
      environments: { range: Environment, multivalued: true, inlined: true, inlined_as_list: true }
      lifecycle_phases: { range: LifecyclePhase, multivalued: true, inlined: true, inlined_as_list: true }
      redundancy_groups: { range: RedundancyGroup, multivalued: true, inlined: true, inlined_as_list: true }
      views: { range: View, multivalued: true, inlined: true, inlined_as_list: true }
      threat_models: { range: ThreatModel, multivalued: true, inlined: true, inlined_as_list: true }
      security_programs: { range: SecurityProgram, multivalued: true, inlined: true, inlined_as_list: true }
      gates: { range: Gate, multivalued: true, inlined: true, inlined_as_list: true }
      milestones: { range: Milestone, multivalued: true, inlined: true, inlined_as_list: true }
      checkpoints: { range: Checkpoint, multivalued: true, inlined: true, inlined_as_list: true }
      requirements: { range: Requirement, multivalued: true, inlined: true, inlined_as_list: true }
      governed_views: { range: GovernedView, multivalued: true, inlined: true, inlined_as_list: true }
      sdl_practices: { range: SdlPractice, multivalued: true, inlined: true, inlined_as_list: true }
      work_products: { range: WorkProduct, multivalued: true, inlined: true, inlined_as_list: true }
      requirement_sets: { range: RequirementSet, multivalued: true, inlined: true, inlined_as_list: true }

  # ---- PROPOSAL (DL-0040). Not in spec/schema/; DEC-001b stays open. ----
  SdlPractice:
    is_a: Node
    description: >-
      PROPOSAL (DL-0040). One secure-development activity as a product team runs it:
      threat modeling, code review, release integrity, coordinated disclosure, ...
      `practice_key` names the MAP-0001 row, so the 16-framework crosswalk (and the
      library records behind it) is one hop away instead of being re-typed per
      product. Progress reuses MitigationStatus; the phase reuses LifecyclePhase; the
      owner is a Party role. Whether the practice is a delivery item for this
      product is an Assertion (predicate `selects_practice`) plus a human Review, not
      a field. RPT-0013-OM calls the closest canonical types Activity / Practice.
    slots:
      - practice_key
      - at_phase
      - owner
      - mitigation_status
      - implements
      - produces
      - in_program_node
      - external_refs

  WorkProduct:
    is_a: Node
    description: >-
      PROPOSAL (DL-0040). A deliverable or evidence item an SdlPractice produces: a
      document, workflow, attestation, SBOM, test suite, page, issue or pull request.
      `locator` is an opaque URL or repo path. It is evidence of linkage, not of
      adequacy: a human still judges whether it is good enough (CLAUDE.md).
      RPT-0013-OM's Evidence object (digest, about_version, fresh_until) is the
      fuller form; only `locator`, `work_product_kind` and `evidence` are used here.
    slots:
      - locator
      - work_product_kind
      - evidence

  RequirementSet:
    is_a: Node
    description: >-
      PROPOSAL (DL-0040). A candidate governing requirement set for a product: a
      standard, regulation or framework (or a named profile of one). `source_ref`
      points at the library record; `set_members` lists the Requirements of the set
      this example uses. Selecting or excluding a set for a program is an Assertion
      (`selects_requirement_set` / `excludes_requirement_set`) with the rationale in
      its description and a human Review. RPT-0013-OM's RequirementProfile is the
      fuller form.
    slots:
      - source_ref
      - source_locator
      - set_members
      - applies_to_family

slots:
  practice_key:
    range: string
    description: PROPOSAL (DL-0040). Row key in spec/MAP-0001.yaml (e.g. `threat-modeling`).
  implements:
    range: Requirement
    multivalued: true
    inlined: false
    description: PROPOSAL (DL-0040). Requirements this practice is meant to discharge.
  produces:
    range: WorkProduct
    multivalued: true
    inlined: false
    description: PROPOSAL (DL-0040). Work products (deliverables, evidence) of the practice.
  in_program_node:
    range: ProgramNode
    multivalued: true
    inlined: false
    description: PROPOSAL (DL-0040). Milestone / Gate / Checkpoint the practice is due at.
  locator:
    range: string
    description: PROPOSAL (DL-0040). Opaque URL or repo path of a work product.
  work_product_kind:
    range: WorkProductKind
    description: PROPOSAL (DL-0040). What kind of work product this is.
  set_members:
    range: Requirement
    multivalued: true
    inlined: false
    description: PROPOSAL (DL-0040). Requirements of a RequirementSet used by this model.

enums:
  WorkProductKind:
    description: PROPOSAL (DL-0040). Kinds of SDL work product.
    permissible_values:
      document:
      workflow:
      attestation:
      sbom:
      test_suite:
      configuration:
      page:
      issue:
      pull_request:
      library_record:
      model:

