# Test-harness container for the CORE §8 MVP example threat models (mvp-NN-*.yaml).
#
# NOT part of the domain object model and NOT rendered into OBJECT-MODEL.md. It is
# the CORE-ONLY sibling of example-container.linkml.yaml: it `imports` the same real
# object model but its tree-root bundle exposes collections for the DEC-001a CORE
# classes ONLY (Requirement joined the core via ADR-0012) — no ThreatModel /
# SecurityProgram / Gate / Milestone / Checkpoint / GovernedView collections, and (per
# ARCH-0001-PROPOSAL §8 "no Environment parameter — post-MVP, H3") no Environment /
# Deployment collections. Requirement.conformance_status is still DEC-001b; the
# reference checker (DL-0021 check-edges.py) fails a core vector that sets it.
#
# Because the governed + Environment classes have no slot on the tree root, a CORE
# MVP vector that accidentally referenced one would have nowhere to put it: the
# "attack-path KG, no governance layer" scope (the critic's "vectors 1–6 + 18") is
# enforced structurally, not just by convention. The full example-container remains
# for the governance-heavy tv-*.yaml vectors. DEC-001 is unaffected by this file.
id: https://threat-radar.github.io/tmodel/schema/vectors/example-container-core
name: TmodelExampleContainerCore
title: tmodel CORE example-vector container (test harness, DEC-001a core only)
description: >-
  Validation-only wrapper around the tmodel object model so a complete CORE
  (no-governance, no-Environment) worked threat model validates as one file.
  Not normative; not a domain class.
version: 0.1.0
status: draft

prefixes:
  linkml: https://w3id.org/linkml/
  tmodel: https://threat-radar.github.io/tmodel/schema/object-model/
default_prefix: tmodel
default_range: string

imports:
  - linkml:types
  - ../schema/tmodel-object-model.linkml

classes:
  ExampleModelCore:
    tree_root: true
    description: >-
      A CORE test-vector bundle: flat collections of object instances that together
      form one worked attack-path knowledge graph using only the DEC-001a core
      classes. Each object appears once in its type's list; edges between objects are
      id references (inlined: false in the domain schema). Referential integrity
      across the lists is a dogfooding convention here, not enforced by
      linkml-validate. No governed-layer collections and no Environment/Deployment
      collections exist on purpose (ARCH-0001-PROPOSAL §8 MVP scope).
    attributes:
      parties: { range: Party, multivalued: true, inlined: true, inlined_as_list: true }
      products: { range: Product, multivalued: true, inlined: true, inlined_as_list: true }
      product_instances: { range: ProductInstance, multivalued: true, inlined: true, inlined_as_list: true }
      components: { range: Component, multivalued: true, inlined: true, inlined_as_list: true }
      weaknesses: { range: Weakness, multivalued: true, inlined: true, inlined_as_list: true }
      vulnerabilities: { range: Vulnerability, multivalued: true, inlined: true, inlined_as_list: true }
      attack_patterns: { range: AttackPattern, multivalued: true, inlined: true, inlined_as_list: true }
      threat_instances: { range: ThreatInstance, multivalued: true, inlined: true, inlined_as_list: true }
      attack_steps: { range: AttackStep, multivalued: true, inlined: true, inlined_as_list: true }
      attack_paths: { range: AttackPath, multivalued: true, inlined: true, inlined_as_list: true }
      damage_scenarios: { range: DamageScenario, multivalued: true, inlined: true, inlined_as_list: true }
      mitigations: { range: Mitigation, multivalued: true, inlined: true, inlined_as_list: true }
      risk_scores: { range: RiskScore, multivalued: true, inlined: true, inlined_as_list: true }
      reviews: { range: Review, multivalued: true, inlined: true, inlined_as_list: true }
      assertions: { range: Assertion, multivalued: true, inlined: true, inlined_as_list: true }
      lifecycle_phases: { range: LifecyclePhase, multivalued: true, inlined: true, inlined_as_list: true }
      views: { range: View, multivalued: true, inlined: true, inlined_as_list: true }
      requirements: { range: Requirement, multivalued: true, inlined: true, inlined_as_list: true }
