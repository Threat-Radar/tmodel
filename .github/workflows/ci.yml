name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2          # validate-archdoc diffs against HEAD~1 for §9.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate archdoc/v1 front matter
        run: python3 bin/validate-archdoc
      - name: Guard — no personal identity in published pages
        run: python3 docs/publishing/check_identities.py
      - name: Guard — every relative link in docs/ resolves
        run: python3 docs/publishing/check_links.py
