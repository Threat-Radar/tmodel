name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  archdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # validate-archdoc diffs against HEAD~1 for §9.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate archdoc/v1 front matter
        run: python3 bin/validate-archdoc
