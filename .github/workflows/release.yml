name: release
# Build the macOS app (.dmg, Apple Silicon) on a GitHub-hosted runner, attest
# its build provenance (SLSA Build L2), and publish it (#124, #203; PLAN-0002 §2
# steps 6-7, T-212). CONTRIBUTING §10 "Releases and supply chain" explains it.
#
#   tag vX.Y.Z / vX.Y.Z-rc.N  -> DRAFT release (rc = prerelease); a maintainer publishes it
#   push to main (app paths)  -> rolling prerelease `latest-main`, assets replaced each run
#   workflow_dispatch         -> build + attest, workflow artifact only
#
# Two jobs, so the job that runs third-party build tooling never holds a token
# that can write to the repository: `build` may only read code and mint the
# OIDC token for attestations; `publish` (no checkout, no build) writes releases.
#
# Signing: without the Apple secrets below the app is ad-hoc signed (users open
# it once via System Settings > Privacy & Security > Open Anyway). With them,
# `tauri build` signs with the Developer ID and notarizes. Secrets, all optional:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   notarization (app-specific password)
# Third-party actions are pinned to full commit SHAs (version in the comment).
# GitHub runners only, no cloud services (APP-0001 A-043).

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: # path filters apply to branch pushes only, never to tags
      - "engine/**"
      - "spec/vectors/**"
      - "apps/**"
      - "bin/build-engine"
      - ".github/workflows/release.yml"
  workflow_dispatch: # manual run: build + attest, workflow artifact only

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: build .dmg (macOS, Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: read # check out the code
      id-token: write # OIDC token that signs the provenance (Sigstore)
      attestations: write # store the attestations on this repository
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
    outputs:
      label: ${{ steps.name.outputs.label }}
      signed: ${{ steps.name.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Name the build
        id: name
        run: |
          app=$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          short=${GITHUB_SHA::7}
          case "$GITHUB_REF" in
            refs/tags/v*)
              label=${GITHUB_REF_NAME#v}
              if [ "$label" != "$app" ] && [[ "$label" != "$app"-* ]]; then
                echo "::error::tag $GITHUB_REF_NAME does not match the app version $app (tauri.conf.json)"
                exit 1
              fi ;;
            refs/heads/main) label="$app-main.$short" ;;
            *) label="$app-dev.$short" ;;
          esac
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "signed=$HAS_APPLE_CERT" >> "$GITHUB_OUTPUT"
          echo "build $label from $GITHUB_SHA"

      # Source dependency SBOM from the lockfiles, taken before anything is installed.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rust dependencies match Cargo.lock
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked

      - name: Build the engine sidecar
        run: bin/build-engine

      - name: Install bundle test dependencies
        run: python -m pip install 'pytest>=8'

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Signing credentials are scoped to this step, after dependency installs.
      - name: Build the app and .dmg
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty override must not replace the ad-hoc identity in tauri.conf.json.
          if [ "$HAS_APPLE_CERT" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          fi
          if [ "$HAS_APPLE_CERT" != "true" ] || [ "$HAS_NOTARIZATION" != "true" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          CI=true npx tauri build

      - name: Check the bundle
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/tmodel.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/tmodel-engine" version --in-process
          cmp apps/desktop/THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          TMODEL_PACKAGED_ENGINE="$PWD/$app/Contents/MacOS/tmodel-engine" \
            python -m pytest -q engine/tests/test_packaging.py

      - name: Stage the release files
        env:
          LABEL: ${{ steps.name.outputs.label }}
        run: |
          mkdir dist
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          name="tmodel_${LABEL}_aarch64.dmg"
          cp "$dmg" "dist/$name"
          cp sbom.spdx.json "dist/tmodel_${LABEL}.spdx.json"
          # the engine exactly as installed: .../tmodel.app/Contents/MacOS/tmodel-engine
          mkdir engine-bin
          cp apps/desktop/src-tauri/target/release/bundle/macos/tmodel.app/Contents/MacOS/tmodel-engine engine-bin/
          (cd dist && shasum -a 256 "$name" > "$name.sha256" && shasum -a 256 -c "$name.sha256")
          # The same .dmg under a fixed name, so a link can start the download
          # directly: releases/download/latest-main/tmodel_macos_aarch64.dmg (#202, #203).
          cp "dist/$name" dist/tmodel_macos_aarch64.dmg
          (cd dist && shasum -a 256 tmodel_macos_aarch64.dmg > tmodel_macos_aarch64.dmg.sha256 \
            && shasum -a 256 -c tmodel_macos_aarch64.dmg.sha256)
          ls -l dist

      - name: Attest build provenance (.dmg, bundled engine, SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.spdx.json
            engine-bin/tmodel-engine

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmodel-macos-aarch64
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or update the release; move the latest-main tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: ${{ needs.build.outputs.label }}
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tmodel-macos-aarch64
          path: dist

      - name: Write the release notes
        run: |
          if [ "$SIGNED" = "true" ]; then
            sign="Signed with a Developer ID."
          else
            sign="Not signed with a Developer ID yet. On first launch macOS blocks it: open System Settings > Privacy & Security and click Open Anyway (CONTRIBUTING §10)."
          fi
          {
            echo "macOS (Apple Silicon), build \`$LABEL\` from commit $GITHUB_SHA."
            echo
            echo "$sign"
            echo
            echo "Verify the download (SHA-256 and SLSA build provenance):"
            echo
            echo '```sh'
            echo "shasum -a 256 -c tmodel_${LABEL}_aarch64.dmg.sha256"
            echo "gh attestation verify tmodel_${LABEL}_aarch64.dmg -R $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "\`tmodel_macos_aarch64.dmg\` is the same file under a fixed name, for direct download links; it verifies the same way."
            echo
            echo "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md
          cat notes.md

      - name: Attach to a draft release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" dist/* --draft "${prerelease[@]}" \
              --title "tmodel $GITHUB_REF_NAME" --notes-file notes.md
          fi

      - name: Replace the rolling latest-main prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          tag=latest-main
          title="tmodel latest-main ($LABEL)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload "$tag" dist/* --clobber
            keep=$(cd dist && ls)
            for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
              grep -qxF "$asset" <<< "$keep" || gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --title "$title" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$title" --notes-file notes.md
          fi
          gh release view "$tag" --json url,assets -q '.url, .assets[].name'
