name: schema
# The LinkML object model and its example vectors (#64; ADR-0007, ADR-0010).
# 1. The generated JSON Schema, SHACL and Python types match the LinkML file.
# 2. Every example vector validates against its container.
# 3. Every id-reference in the MVP core vectors resolves (linkml-validate does
#    not check references between objects; DL-0021).
# 4. Every requirement extraction file (research/0017-requirements-extraction,
#    #169) validates against the core container, its references resolve, and it
#    keeps the extraction rules (check.py); the converter's tests pass.
# 5. The SDL example (sdl-*.yaml, DL-0040) validates against the SDL proposal
#    container. render_sdl.py --check resolves its references, applies the PROC-0002
#    review rules (DL-0042) and fails if docs/sdl/ is stale.
# GitHub runners only, no cloud services (APP-0001 A-043).

on:
  pull_request:
    paths:
      - "spec/schema/**"
      - "spec/vectors/**"
      - "bin/gen-schema"
      - "design-log/0021-mvp-core-attack-path-vectors/check-edges.py"
      - "research/0017-requirements-extraction/**"
      - "docs/publishing/render_sdl.py"
      - "docs/publishing/test_render_sdl.py"
      - "docs/publishing/sdl.yaml"
      - "docs/sdl/**"
      - ".github/workflows/schema.yml"
  push:
    branches: [main]
    paths:
      - "spec/schema/**"
      - "spec/vectors/**"
      - "bin/gen-schema"
      - "design-log/0021-mvp-core-attack-path-vectors/check-edges.py"
      - "research/0017-requirements-extraction/**"
      - "docs/publishing/render_sdl.py"
      - "docs/publishing/test_render_sdl.py"
      - "docs/publishing/sdl.yaml"
      - "docs/sdl/**"
      - ".github/workflows/schema.yml"

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: LinkML schema and vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned tools
        run: python -m pip install -r spec/schema/requirements.txt
      - name: Generated files are up to date
        run: bin/gen-schema --check
      - name: MVP core vectors validate (core container)
        run: |
          for v in spec/vectors/mvp-*.yaml; do
            echo "== $v"
            linkml-validate -s spec/vectors/example-container-core.linkml.yaml -C ExampleModelCore "$v"
          done
      - name: Governance vectors validate (full container)
        run: |
          for v in spec/vectors/tv-*.yaml; do
            echo "== $v"
            linkml-validate -s spec/vectors/example-container.linkml.yaml -C ExampleModel "$v"
          done
      - name: SDL example validates (SDL proposal container, DL-0040)
        run: |
          for v in spec/vectors/sdl-*.yaml; do
            echo "== $v"
            linkml-validate -s spec/vectors/example-container-sdl.linkml.yaml -C ExampleModelSdl "$v"
          done
      - name: SDL page is fresh and the review rules hold (PROC-0002, DL-0042)
        run: |
          python3 docs/publishing/render_sdl.py --check
          python3 -B docs/publishing/test_render_sdl.py
      - name: MVP core vectors, references resolve
        run: python3 design-log/0021-mvp-core-attack-path-vectors/check-edges.py spec/vectors/mvp-*.yaml
      - name: Requirement extraction files validate (core container)
        run: |
          shopt -s nullglob
          for f in research/0017-requirements-extraction/*.yaml; do
            echo "== $f"
            linkml-validate -s spec/vectors/example-container-core.linkml.yaml -C ExampleModelCore "$f"
          done
      - name: Requirement extraction files, references resolve and rules hold
        run: |
          shopt -s nullglob
          files=(research/0017-requirements-extraction/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no extraction files"; exit 0; fi
          python3 design-log/0021-mvp-core-attack-path-vectors/check-edges.py "${files[@]}"
          python3 research/0017-requirements-extraction/check.py "${files[@]}"
      - name: Requirement converter tests
        run: python3 -B research/0017-requirements-extraction/test_convert.py
