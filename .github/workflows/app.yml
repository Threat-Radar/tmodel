name: app
# CI for the desktop app and engine (PLAN-0002 §2 step 5, T-211).
# Lint + test + build for Python and TypeScript, plus a macOS build of the
# Tauri shell. GitHub runners only — no cloud services (APP-0001 A-043).
# Docs-only changes are checked by ci.yml (archdoc), not here.

on:
  pull_request:
    paths:
      - "engine/**"
      - "spec/vectors/**"
      - "apps/**"
      - "library"
      - "bin/build-engine"
      - "bin/publish-site"
      - "docs/app/**"
      - "docs/index.html"
      - "docs/publishing/check_links.py"
      - "docs/publishing/check_identities.py"
      - "docs/publishing/render_app.py"
      - "docs/publishing/site.yaml"
      - "docs/publishing/test_check_links.py"
      - "docs/publishing/test_check_identities.py"
      - "docs/publishing/test_render_app.py"
      - ".github/workflows/app.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "spec/vectors/**"
      - "apps/**"
      - "library"
      - "bin/build-engine"
      - "bin/publish-site"
      - "docs/app/**"
      - "docs/index.html"
      - "docs/publishing/check_links.py"
      - "docs/publishing/check_identities.py"
      - "docs/publishing/render_app.py"
      - "docs/publishing/site.yaml"
      - "docs/publishing/test_check_links.py"
      - "docs/publishing/test_check_identities.py"
      - "docs/publishing/test_render_app.py"
      - ".github/workflows/app.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: tmodel health --in-process

  frontend:
    name: frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  browser-preview:
    name: browser preview (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: |
          python -m pip install -e "./engine[dev]"
          npm ci --prefix apps/desktop
      - name: Test publishing guards
        run: python -m pytest -q docs/publishing/test_render_app.py docs/publishing/test_check_links.py docs/publishing/test_check_identities.py
      - name: Check generated browser preview
        run: python docs/publishing/render_app.py --check
      - name: Check published links
        run: |
          python docs/publishing/check_links.py
          python docs/publishing/check_identities.py

  desktop:
    name: desktop (Tauri, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the engine sidecar (#124)
        working-directory: .
        run: bin/build-engine
      - name: Install bundle test dependencies
        working-directory: .
        run: python -m pip install 'pytest>=8'
      - name: Install
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build app bundle (debug)
        run: CI=true npx tauri build --debug --bundles app
      - name: Check installed app resources
        working-directory: .
        run: |
          app=apps/desktop/src-tauri/target/debug/bundle/macos/tmodel.app
          codesign --verify --deep --strict "$app"
          cmp apps/desktop/THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          TMODEL_PACKAGED_ENGINE="$PWD/$app/Contents/MacOS/tmodel-engine" \
            python -m pytest -q engine/tests/test_packaging.py
      # A reviewer can try the PR's app before it merges (#205). Debug build,
      # ad-hoc signed: open it once via Privacy & Security > Open Anyway.
      - name: Zip the app for download
        if: github.event_name == 'pull_request'
        working-directory: apps/desktop/src-tauri/target/debug/bundle/macos
        run: ditto -c -k --keepParent tmodel.app "$GITHUB_WORKSPACE/tmodel-debug-app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: tmodel-pr${{ github.event.pull_request.number }}-debug-macos-aarch64
          path: tmodel-debug-app.zip
          retention-days: 7
          if-no-files-found: error
