name: app
# CI for the desktop app and engine (PLAN-0002 §2 step 5, T-211).
# Lint + test + build for Python and TypeScript, plus a macOS build of the
# Tauri shell. GitHub runners only — no cloud services (APP-0001 A-043).
# Docs-only changes are checked by ci.yml (archdoc), not here.

on:
  pull_request:
    paths:
      - "engine/**"
      - "spec/vectors/**"
      - "apps/**"
      - "bin/build-engine"
      - ".github/workflows/app.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "spec/vectors/**"
      - "apps/**"
      - "bin/build-engine"
      - ".github/workflows/app.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: tmodel health --in-process

  frontend:
    name: frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  desktop:
    name: desktop (Tauri, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build the engine sidecar (#124)
        working-directory: .
        run: bin/build-engine
      - name: Install bundle test dependencies
        working-directory: .
        run: python -m pip install 'pytest>=8'
      - name: Install
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build app bundle (debug)
        run: CI=true npx tauri build --debug --bundles app
      - name: Check installed app resources
        working-directory: .
        run: |
          app=apps/desktop/src-tauri/target/debug/bundle/macos/tmodel.app
          codesign --verify --deep --strict "$app"
          cmp apps/desktop/THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          TMODEL_PACKAGED_ENGINE="$PWD/$app/Contents/MacOS/tmodel-engine" \
            python -m pytest -q engine/tests/test_packaging.py
      # A reviewer can try the PR's app before it merges (#205). Debug build,
      # ad-hoc signed: open it once via Privacy & Security > Open Anyway.
      - name: Zip the app for download
        if: github.event_name == 'pull_request'
        working-directory: apps/desktop/src-tauri/target/debug/bundle/macos
        run: ditto -c -k --keepParent tmodel.app "$GITHUB_WORKSPACE/tmodel-debug-app.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request'
        with:
          name: tmodel-pr${{ github.event.pull_request.number }}-debug-macos-aarch64
          path: tmodel-debug-app.zip
          retention-days: 7
          if-no-files-found: error
