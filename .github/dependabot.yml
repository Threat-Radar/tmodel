version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /engine
    schedule: { interval: weekly }
    groups:
      engine: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly }
    groups:
      desktop: { patterns: ["*"] }
