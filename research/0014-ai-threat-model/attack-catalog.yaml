# RPT-0014 attack-technique catalog (derived artifact)
#
# Working data, NOT a schema. The record shape is decided in #74 (DEC-001/002 open). AI-generated: every entry is a hypothesis until a human reviews it.
#
# Catalog versions pinned for every id below: MITRE ATLAS 2026.09 (data format 6.0.0); OWASP Top 10 for LLM Applications 2025;
# OWASP Top 10 for Agentic Applications 2026 (ASI01-ASI10); CWE 4.20; NIST AI 100-2 E2025 (NISTAML ids). Every OWASP id carries its year suffix.
# Deprecated ATLAS ids AML.T0019, AML.T0058, AML.T0104 are not used (now AML.T0115.000/.001/.002).
# sources: S-ids in sources.md. example_incidents: INC-ids in incidents.md.
#
# maturity (v0.2, derived mechanically from the kinds of the linked example_incidents; see incidents.md "Kinds"):
#   exploited-in-wild   = at least one linked ITW or TI incident (an exploited CVE in CISA KEV is logged as ITW);
#   occurred-in-wild    = the same evidence for a technique whose intent is not adversarial (accidental, insider-accidental,
#                         provider, accidental-or-misuse, autonomous-agent); ACC incidents count here and only here;
#   demonstrated-production = no such incident, but at least one RD or DV against a live product or system, an ITW-Q
#                         (attempt that failed, disputed claim, or press-only report), a LEG action, or an ACC for an adversarial technique;
#   demonstrated-research = shown in research or lab settings only (no linked incident);
#   theoretical         = argued or proven, not shown end to end.
#   maturity_basis lists the incidents that set the value. Ratings stay hypotheses: the incident kinds themselves are judgements.
# atlas_maturity: ATLAS 2026.09's own maturity (Feasible / Demonstrated / Realized) for each mapped technique.
# intent: adversarial unless stated (report section 3.15).
# nist_scope: in-scope, out-of-scope (NIST AI 100-2 section 1 leaves platform attacks to traditional cybersecurity taxonomies, and
#   non-adversarial failures are outside it), or gap (section 3.5 Security of Agents has no NISTAML id). NISTAML.05/.051 are used only
#   for model and data poisoning; NISTAML.04 only where a jailbreak, guardrail or safety circumvention occurs.
# other: ids from catalogs that are not pinned above (OWASP T-codes, MCP Top 10, NHI Top 10, CoSAI risk ids at commit 0d8bfc9b5d76) and
#   candidate local weaknesses (LW-*).
# Mapping rule (v0.2): where an ATLAS case study codes an incident the catalog cites, the AIT mapping includes that case study's
#   technique for the step the AIT describes. ATLAS techniques deliberately left unmapped are listed in enumerations.md section 6.
# targeted_assets/targeted_components are free-text working labels; asset_classes (A01-A18), reference_components (C01-C21)
#   and class_group (X01-X16) normalize them to the vocabularies in report.md sections 1, 2 and 4. Mappings to catalogs were made
#   by the synthesis agent from the sources' stated mappings and definitions, and corrected in the v0.2 review fold; an id here is a
#   candidate edge, not an asserted mapping.
# 146 techniques (AIT-001..AIT-133 from v0.1; AIT-134..AIT-146 added in the v0.2 review fold).

