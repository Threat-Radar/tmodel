usefulness:
  verdict: useful
  reason: "The only government taxonomy with stable attack-class ids (30 NISTAML ids). RPT-0014's preliminary attack-catalog.yaml (AI-generated, review_status hypothesis) pins them as one of its five catalogs and maps 98 of its 146 AITs to one; that mapping is RPT-0014's, not NIST's. It also gives the attacker-model axes (objective x capability x knowledge x lifecycle stage) that state an attack's preconditions. It names no assets as a vocabulary, so it does not settle attack-to-asset mapping."
