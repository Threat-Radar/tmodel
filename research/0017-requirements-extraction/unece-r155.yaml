# unece-r155: requirement extraction, AI-proposed, UNREVIEWED unless a Review below says otherwise.
# Source: library:unece-r155 (digest c41424c6f17784aa7cf8d3de79491e6bce142a674748039f1235dc8c37ea9654), read 2026-11-02.
# Agent: Claude Code (claude-opus-5-5). Human owner: @Clovier.
#
# Scope (tmodel#172): Annex 5 only, the list of threats and corresponding mitigations of the original
# version (E/ECE/TRANS/505/Rev.3/Add.154). The regulation's paragraphs 1 to 12 and Annexes 1 to 4 are
# outside this lane's scope. UN text is free; the requirement texts are still one-line paraphrases.
#
# Coverage: Parts B and C hold 23 numbered mitigations (M1, M2, M3, M4, M5, M6, M7, M8, M9, M10, M11, M12, M13, M14, M15, M16, M18, M19, M20, M21, M22, M23, M24; M17 is not
# used in this version) and three more statements inside the M7 and M23 cells. All
# 26 are converted to Requirements, each restating a stub Mitigation. Part A's Table A1 has
# 67 examples; Table C3 adds 30.1 to 30.3, which Table A1 does not list. All 70 are
# stub ThreatInstances. Pairings were read from the rendered tables, where merged cells give one
# mitigation to several rows.
#
# Normativity: paragraph 7.3.4 requires the manufacturer to implement every Part B or C mitigation
# that is relevant to a risk it identified, or another appropriate one. Each numbered mitigation is
# therefore `conditional`; descriptions note where the annex itself says "should" or "are applied".
#
# Families introduced (applies_to_family, from the source's own scope):
#   family:unece-r155-vehicle: vehicles in the regulation's scope (paragraphs 1.1 and 1.2: categories
#     M and N; O with at least one ECU; L6 and L7 with automated driving from level 3), for the
#     Part B mitigations "intended for vehicle types".
#   family:vehicle-backend: areas outside the vehicle, e.g. IT back-ends (Annex 5, paragraph 1), for Part C.
#
# Every link below was proposed as an Assertion: stated_as (stub Mitigation to Requirement), addresses
# (Requirement to the Part A threats the annex pairs it with) and two links between statements
# in the M23 cell. None is written into a slot. On 2026-11-02 @Clovier checked 10 of
# them against the source and accepted all 10 (see reviews:); the rest stay proposed with no Review.

requirements:
  - id: requirement:unece-r155-m1
    name: "M1: security controls against insider attack on back-end systems"
    description: >-
      The annex states this one descriptively ("Security Controls are applied").
    text: >-
      Apply security controls to back-end systems that limit the risk of insider
      attacks.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M1"
    source_locator: "M1 (Annex 5, Part C, Table C1)"
    applies_to_family: ["family:vehicle-backend"]
  - id: requirement:unece-r155-m2
    name: "M2: security controls against unauthorized access to back-end systems"
    description: >-
      The annex states this one descriptively and points to OWASP for example controls.
    text: >-
      Apply security controls to back-end systems that limit unauthorized access.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M2"
    source_locator: "M2 (Annex 5, Part C, Table C1)"
    applies_to_family: ["family:vehicle-backend"]
  - id: requirement:unece-r155-m3
    name: "M3: secure back-end systems and plan for their recovery"
    description: >-
      Table B2 also lists it, against denial of service on the update server (13.1). The
      annex points to OWASP for example controls.
    text: >-
      Apply security controls to back-end systems and, where a back-end server is
      critical to the services vehicles rely on, have recovery measures for an outage.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M3"
    source_locator: "M3 (Annex 5, Part B, Table B2; Part C, Table C1)"
    applies_to_family: ["family:vehicle-backend"]
  - id: requirement:unece-r155-m4
    name: "M4: security controls for cloud computing risks"
    description: >-
      The annex states this one descriptively and points to OWASP and the NCSC cloud
      computing guidance for example controls.
    text: >-
      Apply security controls that limit the risks of using cloud computing.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M4"
    source_locator: "M4 (Annex 5, Part C, Table C1)"
    applies_to_family: ["family:vehicle-backend"]
  - id: requirement:unece-r155-m5
    name: "M5: security controls against back-end data breaches"
    description: >-
      The annex states this one descriptively and points to OWASP for example controls.
    text: >-
      Apply security controls to back-end systems that prevent data breaches.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M5"
    source_locator: "M5 (Annex 5, Part C, Table C1)"
    applies_to_family: ["family:vehicle-backend"]
  - id: requirement:unece-r155-m6
    name: "M6: security by design"
    text: >-
      Build systems with security designed in from the start, to keep risks low.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M6"
    source_locator: "M6 (Annex 5, Part B, Table B1)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m7
    name: "M7: access control for system data and code"
    description: >-
      Some rows add that OWASP has example controls.
    text: >-
      Protect system data and code with access-control techniques and designs.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M7"
    source_locator: "M7 (Annex 5, Part B, Tables B1 and B5)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m7-data-correlation
    name: "M7: cross-check data from different sources"
    description: >-
      A second statement inside the M7 cell for rows 20.3 to 20.5. The annex words it as
      a possibility ("could be mitigated"), so it is optional here.
    text: >-
      Counter manipulation of sensor or transmitted data by cross-checking it against
      data from other sources.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: optional
    source_ref: "library:unece-r155#M7"
    source_locator: "M7 (Annex 5, Part B, Table B5, rows 20.3 to 20.5, second line of the mitigation)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m8
    name: "M8: keep unauthorized personnel from critical data"
    description: >-
      The annex words this one with "should" and points to OWASP for example controls.
    text: >-
      Design systems and their access control so that unauthorized personnel cannot
      reach personal or system-critical data.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M8"
    source_locator: "M8 (Annex 5, Part B, Tables B1 and B5; Part C, Table C1)"
    applies_to_family: ["family:unece-r155-vehicle", "family:vehicle-backend"]
  - id: requirement:unece-r155-m9
    name: "M9: prevent and detect unauthorized access"
    text: >-
      Use measures that both prevent and detect unauthorized access.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M9"
    source_locator: "M9 (Annex 5, Part B, Tables B1 and B8)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m10
    name: "M10: verify received messages"
    text: >-
      Have the vehicle check that every message it receives is authentic and unaltered.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M10"
    source_locator: "M10 (Annex 5, Part B, Table B1)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m11
    name: "M11: protect stored cryptographic keys"
    text: >-
      Protect stored cryptographic keys with security controls, for example hardware
      security modules.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M11"
    source_locator: "M11 (Annex 5, Part B, Tables B1, B2 and B5)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m12
    name: "M12: protect confidential data in transit"
    text: >-
      Protect confidential data sent to or from the vehicle.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M12"
    source_locator: "M12 (Annex 5, Part B, Table B1)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m13
    name: "M13: detect and recover from denial of service"
    text: >-
      Use measures that detect a denial-of-service attack and restore service after it.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M13"
    source_locator: "M13 (Annex 5, Part B, Tables B1 and B5)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m14
    name: "M14: protect against embedded viruses and malware"
    description: >-
      The annex words this one as "should be considered".
    text: >-
      Consider measures that protect systems from viruses or malware brought in through
      communication media.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M14"
    source_locator: "M14 (Annex 5, Part B, Table B1)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m15
    name: "M15: detect malicious internal messages"
    description: >-
      The annex words this one as "should be considered".
    text: >-
      Consider measures that detect malicious internal messages or activity.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M15"
    source_locator: "M15 (Annex 5, Part B, Table B1)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m16
    name: "M16: secure software update procedures"
    text: >-
      Use secure procedures for software updates.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M16"
    source_locator: "M16 (Annex 5, Part B, Table B2)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m18
    name: "M18: least-privilege user roles"
    text: >-
      Define and control user roles and access privileges on the principle of least
      privilege.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M18"
    source_locator: "M18 (Annex 5, Part B, Table B3; Part C, Table C2)"
    applies_to_family: ["family:unece-r155-vehicle", "family:vehicle-backend"]
  - id: requirement:unece-r155-m19
    name: "M19: defined and followed security procedures"
    description: >-
      An obligation on organizations, so no product family is set.
    text: >-
      Ensure the organization has security procedures that are written down and actually
      followed, and keep logs of the actions and access involved in managing security
      functions.
    text_origin: paraphrase
    requirement_kind: organizational
    normativity: conditional
    source_ref: "library:unece-r155#M19"
    source_locator: "M19 (Annex 5, Part B, Table B3; Part C, Table C2)"
  - id: requirement:unece-r155-m20
    name: "M20: security controls for remote access"
    text: >-
      Apply security controls to systems that can be reached remotely.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M20"
    source_locator: "M20 (Annex 5, Part B, Table B4)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m21
    name: "M21: assess and protect software, including hosted third-party software"
    text: >-
      Assess the security of software and protect its authenticity and integrity, and
      apply controls that limit the risk from third-party software intended or likely to
      be hosted on the vehicle.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M21"
    source_locator: "M21 (Annex 5, Part B, Table B4)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m22
    name: "M22: security controls for external interfaces"
    text: >-
      Apply security controls to the vehicle's external interfaces.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M22"
    source_locator: "M22 (Annex 5, Part B, Table B4)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m23
    name: "M23: development best practices"
    text: >-
      Follow cybersecurity best practices when developing software and hardware.
    text_origin: paraphrase
    requirement_kind: process
    normativity: conditional
    source_ref: "library:unece-r155#M23"
    source_locator: "M23 (Annex 5, Part B, Table B6)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m23-testing
    name: "M23: cybersecurity testing with adequate coverage"
    description: >-
      A second statement inside the M23 cell for rows 28.1 to 29.1.
    text: >-
      Carry out cybersecurity testing with adequate coverage.
    text_origin: paraphrase
    requirement_kind: process
    normativity: conditional
    source_ref: "library:unece-r155#M23"
    source_locator: "M23 (Annex 5, Part B, Table B6, rows 28.1 to 29.1, second line of the mitigation)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m23-system-design
    name: "M23: system design and integration best practices"
    description: >-
      A second statement inside the M23 cell for row 29.2.
    text: >-
      Apply recognized cybersecurity good practice when designing and integrating
      systems.
    text_origin: paraphrase
    requirement_kind: process
    normativity: conditional
    source_ref: "library:unece-r155#M23"
    source_locator: "M23 (Annex 5, Part B, Table B6, row 29.2, second line of the mitigation)"
    applies_to_family: ["family:unece-r155-vehicle"]
  - id: requirement:unece-r155-m24
    name: "M24: protect stored personal data"
    description: >-
      Table C3 adds that ISO/SC27/WG5 has example controls.
    text: >-
      Follow best practices that protect the integrity and confidentiality of stored
      personal data.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: conditional
    source_ref: "library:unece-r155#M24"
    source_locator: "M24 (Annex 5, Part B, Table B7; Part C, Table C3)"
    applies_to_family: ["family:unece-r155-vehicle", "family:vehicle-backend"]

