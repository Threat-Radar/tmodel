threat_instances:
  - id: threat-instance:unece-r155-1-1
    name: "1.1: Abuse of privileges by staff (insider attack)"
    description: >-
      UN R155 Annex 5, Part A, Table A1, example 1.1, under high-level threat 1
      (Back-end servers used as a means to attack a vehicle or extract data); group
      4.3.1, threats regarding back-end servers related to vehicles in the field.
  - id: threat-instance:unece-r155-1-2
    name: "1.2: Unauthorized internet access to the server"
    description: >-
      UN R155 Annex 5, Part A, Table A1, example 1.2, under high-level threat 1
      (Back-end servers used as a means to attack a vehicle or extract data); group
      4.3.1, threats regarding back-end servers related to vehicles in the field.
  - id: threat-instance:unece-r155-1-3
    name: "1.3: Unauthorized physical access to the server"
    description: >-
      UN R155 Annex 5, Part A, Table A1, example 1.3, under high-level threat 1
      (Back-end servers used as a means to attack a vehicle or extract data); group
      4.3.1, threats regarding back-end servers related to vehicles in the field.
  - id: threat-instance:unece-r155-2-1
    name: "2.1: Attack on back-end server stops it functioning"
    description: >-
      UN R155 Annex 5, Part A, Table A1, example 2.1, under high-level threat 2
      (Services from back-end server being disrupted, affecting the operation of a
      vehicle); group 4.3.1, threats regarding back-end servers related to vehicles in
      the field.
  - id: threat-instance:unece-r155-3-1
    name: "3.1: Abuse of privileges by staff (insider attack)"
    description: >-
      UN R155 Annex 5, Part A, Table A1, example 3.1, under high-level threat 3 (Vehicle
      related data held on back-end servers being lost or compromised ("data breach"));
      group 4.3.1, threats regarding back-end servers related to vehicles in the field.
  - id: threat-instance:unece-r155-3-2
