requirements:
- id: requirement:iec-62443-4-1-2018-sr-1
  name: SR-1 — Document the product security context
  text: >-
    Maintain a documented description of the security context in which the product is intended to
    operate.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-1
  source_locator: IEC 62443-4-1:2018 §6.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.9
- id: requirement:iec-62443-4-1-2018-sr-2
  name: SR-2 — Maintain a scoped product threat model
  text: >-
    Create and maintain a threat model for every product that reflects the current development scope
    and includes the applicable content required by this practice.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.9
- id: requirement:iec-62443-4-1-2018-sr-2-a-e
  name: SR-2.a-e — Model data flows and trust structure
  text: >-
    Include classified information flows, trust boundaries, processes, data stores, and interacting
    external entities in the product threat model.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.a-e
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.9
- id: requirement:iec-62443-4-1-2018-sr-2-f-h
  name: SR-2.f-h — Model protocols and physical interfaces
  text: >-
    Record implemented communication protocols, exposed physical interfaces, and board-level debug
    connections that could be used to attack the product.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.f-h
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.9
- id: requirement:iec-62443-4-1-2018-sr-2-i-l
  name: SR-2.i-l — Record attack paths and security issues
  text: >-
    Capture potential attack vectors, threats, their severity, and identified security-related issues
    in the threat model.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.i-l
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.9
- id: requirement:iec-62443-4-1-2018-sr-2-j
  name: SR-2.j — Score potential threats
  text: >-
    Assign potential threats a severity using an established vulnerability-scoring method.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.j
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-2-k
  name: SR-2.k — Record each threat disposition
  text: >-
    Document a mitigation or other disposition for every threat in the threat model.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.k
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-2-m
  name: SR-2.m — Track external dependencies
  text: >-
    Keep the threat model current with third-party applications, drivers, and other externally developed
    code linked into the product.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.m
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-2-periodic
  name: SR-2.periodic — Review released-product threat models
  text: >-
    Review each released product's threat model at least annually and update it when emerging threats
    require a change even if the design is unchanged.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.periodic
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-2-review
  name: SR-2.review — Verify shared understanding of the threat model
  text: >-
    Have the development team review the threat model for correctness and confirm that the team understands
    it.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.review
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-2-issues
  name: SR-2.issues — Route threat-model issues into defect management
  text: >-
    Handle issues found through threat modeling through the security-issue assessment and disposition
    processes.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-2.issues
  source_locator: IEC 62443-4-1:2018 §6.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-3
  name: SR-3 — Document lifecycle security requirements
  text: >-
    Document product and feature security requirements, including capabilities needed for installation,
    operation, maintenance, and decommissioning.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-3
  source_locator: IEC 62443-4-1:2018 §6.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.10
- id: requirement:iec-62443-4-1-2018-sr-4
  name: SR-4 — Define requirement scope and target level
  text: >-
    For each set of security requirements, document the product's physical and logical boundaries
    and its target capability security level.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-4
  source_locator: IEC 62443-4-1:2018 §6.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.11
- id: requirement:iec-62443-4-1-2018-sr-5
  name: SR-5 — Review and approve security requirements
  text: >-
    Review, update, and approve security requirements for clarity, validity, threat-model alignment,
    and testability.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-5
  source_locator: IEC 62443-4-1:2018 §6.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.11
- id: requirement:iec-62443-4-1-2018-sr-5-2
  name: SR-5.2 — Include required disciplines in review
  text: >-
    Include implementers, independent testers, a customer advocate, and a security adviser in the
    security-requirements review.
  text_origin: paraphrase
  requirement_kind: organizational
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SR-5.2
  source_locator: IEC 62443-4-1:2018 §6.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.11
- id: requirement:iec-62443-4-1-2018-sd-1
  name: SD-1 — Document secure interface design
  text: >-
    Document each product interface, its exposure and trust boundaries, accessible assets, roles and
    permissions, relevant threats, safeguards, dependencies, usage, and how the design mitigates modeled
    threats.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-1
  source_locator: IEC 62443-4-1:2018 §7.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.12
- id: requirement:iec-62443-4-1-2018-sd-2
  name: SD-2 — Design layered defenses
  text: >-
    Use the threat model and a risk-based approach to design multiple defensive layers.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-2
  source_locator: IEC 62443-4-1:2018 §7.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.12
- id: requirement:iec-62443-4-1-2018-sd-2-2
  name: SD-2.2 — Assign responsibilities to defense layers
  text: >-
    Assign security responsibilities to every defensive layer, apply secure design principles at each
    layer, and aim to reduce the attack surface exposed to subsequent layers.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-2.2
  source_locator: IEC 62443-4-1:2018 §7.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.12
- id: requirement:iec-62443-4-1-2018-sd-3
  name: SD-3 — Review significant secure-design revisions
  text: >-
    For every substantial secure-design revision, identify, characterize, and track unresolved requirements,
    exploitable interfaces or assets, and departures from secure-design practice until closure.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-3
  source_locator: IEC 62443-4-1:2018 §7.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.13
- id: requirement:iec-62443-4-1-2018-sd-4
  name: SD-4 — Maintain secure-design practices
  text: >-
    Document secure-design practices and require their use throughout product design.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-4
  source_locator: IEC 62443-4-1:2018 §7.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.13
- id: requirement:iec-62443-4-1-2018-sd-4-2
  name: SD-4.2 — Periodically update design practices
  text: >-
    Regularly review and update design practices covering least privilege, proven components, simple
    mechanisms, secure patterns, trust boundaries, and protection or removal of development interfaces.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-4.2
  source_locator: IEC 62443-4-1:2018 §7.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.13
- id: requirement:iec-62443-4-1-2018-sd-4-e
  name: SD-4.e — Reduce attack surface
  text: >-
    Apply attack-surface reduction as a secure-design practice.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SD-4.e
  source_locator: IEC 62443-4-1:2018 §7.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.13
- id: requirement:iec-62443-4-1-2018-si-applicability
  name: SI-applicability — Limit coding controls to relevant software
  text: >-
    Apply this implementation practice's system-development requirements only to software written
    in a full-variability programming language.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SI-applicability
  source_locator: IEC 62443-4-1:2018 §8.2 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.15
- id: requirement:iec-62443-4-1-2018-si-1
  name: SI-1 — Review implementation security
  text: >-
    Review implementations to find, characterize, and close security issues involving unmet requirements,
    coding-standard violations, and defects detectable through static analysis.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SI-1
  source_locator: IEC 62443-4-1:2018 §8.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.14
- id: requirement:iec-62443-4-1-2018-si-1-sca-tool
  name: SI-1.sca-tool — Use an available static-analysis tool
  text: >-
    Perform static source analysis with a suitable tool whenever one exists for the implementation
    language.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SI-1.sca-tool
  source_locator: IEC 62443-4-1:2018 §8.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.14
- id: requirement:iec-62443-4-1-2018-si-1-sca-changes
  name: SI-1.sca-changes — Analyze all source changes
  text: >-
    Statically analyze new and modified source code, trace implementation to planned security capabilities,
    and assess whether threats can exploit implemented interfaces, boundaries, or assets.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SI-1.sca-changes
  source_locator: IEC 62443-4-1:2018 §8.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.14
- id: requirement:iec-62443-4-1-2018-si-2
  name: SI-2 — Maintain secure-coding standards
  text: >-
    Maintain and periodically update coding standards that prohibit unsafe constructs, configure analysis
    tools, require secure implementation techniques, validate trust-boundary inputs, and define safe
    error handling.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SI-2
  source_locator: IEC 62443-4-1:2018 §8.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.15
- id: requirement:iec-62443-4-1-2018-svv-1
  name: SVV-1 — Verify implemented security functions
  text: >-
    Test that product security functions satisfy their requirements and safely handle invalid input
    and error conditions.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-1
  source_locator: IEC 62443-4-1:2018 §9.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.16
- id: requirement:iec-62443-4-1-2018-svv-1-types
  name: SVV-1.types — Exercise required test categories
  text: >-
    Test security functionality, performance and scale, edge and stress conditions, malformed input,
    and trust-boundary requirements.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-1.types
  source_locator: IEC 62443-4-1:2018 §9.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.16
- id: requirement:iec-62443-4-1-2018-svv-2
  name: SVV-2 — Test threat mitigations
  text: >-
    Test whether each mitigation for a validated threat is effective.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-2
  source_locator: IEC 62443-4-1:2018 §9.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.16
- id: requirement:iec-62443-4-1-2018-svv-2-activities
  name: SVV-2.activities — Challenge every mitigation
  text: >-
    Plan and run tests that confirm each threat mitigation works as designed and separately attempt
    to defeat it.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-2.activities
  source_locator: IEC 62443-4-1:2018 §9.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.16
- id: requirement:iec-62443-4-1-2018-svv-3
  name: SVV-3 — Test for product vulnerabilities
  text: >-
    Run tests intended to discover and characterize potential vulnerabilities in the product.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-3-known
  name: SVV-3.known — Use current public vulnerability information
  text: >-
    Base known-vulnerability testing on recent information from an established public industry source.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3.known
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-3-a
  name: SVV-3.a — Test malformed and abusive inputs
  text: >-
    Use manual or automated abuse cases, fuzzing, and load or capacity tests against external interfaces
    and protocols where appropriate tools exist.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3.a
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-3-b
  name: SVV-3.b — Analyze the attack surface
  text: >-
    Identify ingress and egress paths and examine exposures such as weak access controls, open ports,
    and unnecessarily privileged services.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3.b
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-3-c
  name: SVV-3.c — Scan for known vulnerabilities
  text: >-
    Perform black-box scans for known vulnerabilities in product hardware, hosts, and software components.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3.c
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-3-d
  name: SVV-3.d — Analyze delivered executable composition
  text: >-
    For compiled products, analyze every delivered executable and firmware image for vulnerable components
    or libraries, security-rule violations, and unsafe compiler settings.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3.d
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-3-e
  name: SVV-3.e — Test runtime resource management
  text: >-
    Where tools are available, dynamically test for handle and memory leaks, denial-of-service conditions,
    and unauthenticated shared-memory access that static analysis may miss.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-3.e
  source_locator: IEC 62443-4-1:2018 §9.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.17
- id: requirement:iec-62443-4-1-2018-svv-4
  name: SVV-4 — Conduct product penetration testing
  text: >-
    Perform penetration testing that attempts to exploit product weaknesses and records the resulting
    security defects and their characteristics.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-4
  source_locator: IEC 62443-4-1:2018 §9.5.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.18
- id: requirement:iec-62443-4-1-2018-svv-5
  name: SVV-5 — Keep testers independent
  text: >-
    Ensure the people who test the product have the required organizational independence from those
    who designed and implemented it.
  text_origin: paraphrase
  requirement_kind: audit
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#SVV-5
  source_locator: IEC 62443-4-1:2018 §9.6.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.18
- id: requirement:iec-62443-4-1-2018-dm-1
  name: DM-1 — Receive and track security reports
  text: >-
    Provide a process that receives security issues from internal and external reporters and tracks
    each one through closure.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#DM-1
  source_locator: IEC 62443-4-1:2018 §10.2.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.20
- id: requirement:iec-62443-4-1-2018-dm-2
  name: DM-2 — Investigate reported security issues
  text: >-
    Investigate reports promptly to determine whether they apply to the product, can be verified,
    and identify triggering threats.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#DM-2
  source_locator: IEC 62443-4-1:2018 §10.3.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.20
- id: requirement:iec-62443-4-1-2018-dm-3
  name: DM-3 — Assess valid security issues
  text: >-
    Assess valid issues for contextual impact, severity, affected products and versions, root cause,
    and related issues.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:iec-62443-4-1-2018#DM-3
  source_locator: IEC 62443-4-1:2018 §10.4.1 (clause per IEC preview ToC); text read at SDLA-312 v6.3
    p.20
- id: requirement:iec-62443-4-1-2018-dm-3-rca
  name: DM-3.rca — Permit a systematic root-cause method
  text: >-
    A systematic method such as the referenced IEC root-cause guidance may be used when analyzing
    an issue's cause.
  text_origin: paraphrase
