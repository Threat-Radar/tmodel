requirements:
  - id: requirement:iso-sae-21434-2021-rq-08-01
    name: "RQ-08-01: select sources of cybersecurity information"
    text: >-
      Choose the sources from which cybersecurity information will be gathered.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-01"
    source_locator: "RQ-08-01 (§8.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-02
    name: "RQ-08-02: define triage triggers"
    text: >-
      Set, and keep up to date, the triggers used to triage incoming cybersecurity
      information.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-02"
    source_locator: "RQ-08-02 (§8.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-03
    name: "RQ-08-03: collect and triage cybersecurity information"
    text: >-
      Gather cybersecurity information and triage it to decide whether any of it amounts
      to one or more cybersecurity events.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-03"
    source_locator: "RQ-08-03 (§8.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-04
    name: "RQ-08-04: evaluate cybersecurity events for weaknesses"
    text: >-
      Examine each cybersecurity event to find the weaknesses it exposes in an item or a
      component.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-04"
    source_locator: "RQ-08-04 (§8.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-05
    name: "RQ-08-05: analyse weaknesses for vulnerabilities"
    text: >-
      Analyse the weaknesses found to work out which of them are vulnerabilities.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-05"
    source_locator: "RQ-08-05 (§8.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-06
    name: "RQ-08-06: justify a weakness that is not a vulnerability"
    text: >-
      Document the reasoning whenever a weakness is judged not to be a vulnerability.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-06"
    source_locator: "RQ-08-06 (§8.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-07
    name: "RQ-08-07: manage each vulnerability"
    text: >-
      Handle each vulnerability either by assessing and treating its risk under 15.9
      until no unreasonable risk remains, or by removing it with an available fix that
      does not depend on a TARA.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-07"
    source_locator: "RQ-08-07 (§8.6.2)"
  - id: requirement:iso-sae-21434-2021-rq-08-08
    name: "RQ-08-08: apply incident response when treatment calls for it"
    text: >-
      When a risk treatment decision made under 15.9 calls for incident response, apply
      the incident response requirements of 13.3.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-08-08"
    source_locator: "RQ-08-08 (§8.6.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-01
    name: "RQ-09-01: identify the item information"
    text: >-
      Identify the item's boundary, the functions it provides and its preliminary
      architecture.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-01"
    source_locator: "RQ-09-01 (§9.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-02
    name: "RQ-09-02: describe the operational environment"
    text: >-
      Describe the aspects of the item's operational environment that are relevant to
      cybersecurity.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-02"
    source_locator: "RQ-09-02 (§9.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-03
    name: "RQ-09-03: analyse the item's risks (TARA)"
    text: >-
      With the item definition as input, carry out these clause 15 steps for the item:
      asset identification (15.3), threat scenario identification (15.4), impact rating
      (15.5), attack path analysis (15.6), attack feasibility rating (15.7) and risk
      value determination (15.8).
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-03"
    source_locator: "RQ-09-03 (§9.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-04
    name: "RQ-09-04: decide risk treatment"
    text: >-
      Using what the RQ-09-03 analysis found, decide the risk treatment options for
      every threat scenario as 15.9 sets out.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-04"
    source_locator: "RQ-09-04 (§9.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-05
    name: "RQ-09-05: specify cybersecurity goals"
    text: >-
      Where reducing the risk is part of the treatment chosen for a threat scenario, set
      one or more cybersecurity goals for it.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-05"
    source_locator: "RQ-09-05 (§9.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-06
    name: "RQ-09-06: specify cybersecurity claims"
    text: >-
      Where a threat scenario's risk is shared, or retained because of assumptions made
      in the RQ-09-03 analysis, state one or more cybersecurity claims for it.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-06"
    source_locator: "RQ-09-06 (§9.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-07
    name: "RQ-09-07: verify the TARA results, goals and claims"
    text: >-
      Verify that the RQ-09-03 results are correct and complete for the item definition;
      that the RQ-09-04 treatment decisions are complete, correct and consistent with
      those results; that the RQ-09-05 goals and RQ-09-06 claims are complete, correct
      and consistent with the treatment decisions; and that all of the item's goals and
      claims are consistent with one another.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-07"
    source_locator: "RQ-09-07 (§9.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-08
    name: "RQ-09-08: describe the cybersecurity controls"
    text: >-
      Explain which technical or operational controls will meet the cybersecurity goals
      and how those controls work together, considering how the item's functions depend
      on each other and any cybersecurity claims.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-08"
    source_locator: "RQ-09-08 (§9.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-09
    name: "RQ-09-09: define the cybersecurity requirements"
    text: >-
      From the control description of RQ-09-08, define for each cybersecurity goal the
      item's cybersecurity requirements and any requirements on its operational
      environment.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-09"
    source_locator: "RQ-09-09 (§9.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-10
    name: "RQ-09-10: allocate the cybersecurity requirements"
    text: >-
      Assign the cybersecurity requirements to the item and, where relevant, to any of
      its components.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-10"
    source_locator: "RQ-09-10 (§9.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-09-11
    name: "RQ-09-11: verify the cybersecurity concept"
    text: >-
      Check that what RQ-09-08 to RQ-09-10 produced is complete, correct and consistent
      with the cybersecurity goals, and consistent with the cybersecurity claims.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-09-11"
    source_locator: "RQ-09-11 (§9.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-10-01
    name: "RQ-10-01: define cybersecurity specifications"
    text: >-
      Define the cybersecurity specifications from those of the more abstract
      architecture levels and, where relevant, from the controls picked for
      implementation and the architectural design already in place.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-01"
    source_locator: "RQ-10-01 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-02
    name: "RQ-10-02: allocate requirements to architecture components"
    text: >-
      Give each component of the architectural design its share of the defined
      cybersecurity requirements.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-02"
    source_locator: "RQ-10-02 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-03
    name: "RQ-10-03: specify post-development procedures"
    text: >-
      Where applicable, specify the procedures that maintain the component's
      cybersecurity once its development is complete.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-03"
    source_locator: "RQ-10-03 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-04
    name: "RQ-10-04: criteria for choosing notations and languages"
    text: >-
      When choosing a design, modelling or programming notation or language for the
      cybersecurity specifications or for implementing them, consider how clearly its
      syntax and semantics are defined; whether it supports modular design with
      abstraction and encapsulation, structured constructs, and secure design and
      implementation techniques; whether components that already exist can be built in;
      and how well it holds up against vulnerabilities that come from using it wrongly.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-04"
    source_locator: "RQ-10-04 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-05
    name: "RQ-10-05: cover language gaps with guidelines"
    text: >-
      Cover any RQ-10-04 criterion that the chosen language does not satisfy by itself
      with guidelines for design, modelling and coding, or with the development
      environment.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-05"
    source_locator: "RQ-10-05 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rc-10-06
    name: "RC-10-06: apply trusted design principles"
    text: >-
      Use well-established, trusted design and implementation principles so that as few
      weaknesses as possible are introduced.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:iso-sae-21434-2021#RC-10-06"
    source_locator: "RC-10-06 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-07
    name: "RQ-10-07: analyse the architecture for weaknesses"
    text: >-
      Examine the architectural design from RQ-10-01 for weaknesses.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-07"
    source_locator: "RQ-10-07 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-08
    name: "RQ-10-08: verify the cybersecurity specifications"
    text: >-
      Verify the defined cybersecurity specifications for completeness and correctness,
      and confirm that they agree with the specifications from higher architecture
      levels.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-08"
    source_locator: "RQ-10-08 (§10.4.1)"
  - id: requirement:iso-sae-21434-2021-rq-10-09
    name: "RQ-10-09: verify implementation and integration"
    text: >-
      Use integration and verification activities to show that the implemented and
      integrated components meet the defined cybersecurity specifications.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-09"
    source_locator: "RQ-10-09 (§10.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-10-10
    name: "RQ-10-10: specify integration and verification"
    text: >-
      Plan the RQ-10-09 integration and verification activities around the cybersecurity
      specifications, series-production configurations where relevant, enough capability
      to exercise the specified functionality, and conformance with the RQ-10-05
      guidelines where relevant.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-10"
    source_locator: "RQ-10-10 (§10.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-10-11
    name: "RQ-10-11: evaluate test coverage"
    text: >-
      If testing is used for verification, judge whether it is sufficient by measuring
      test coverage against defined coverage metrics.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-11"
    source_locator: "RQ-10-11 (§10.4.2)"
  - id: requirement:iso-sae-21434-2021-rc-10-12
    name: "RC-10-12: test for remaining weaknesses"
    text: >-
      Test the component to confirm that as few undiscovered weaknesses and
      vulnerabilities as possible remain in it.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:iso-sae-21434-2021#RC-10-12"
    source_locator: "RC-10-12 (§10.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-10-13
    name: "RQ-10-13: justify not testing"
    text: >-
      If the RC-10-12 testing is not done, document why.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-10-13"
    source_locator: "RQ-10-13 (§10.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-01
    name: "RQ-15-01: identify damage scenarios"
    text: >-
      Identify the damage scenarios for the analysis.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-01"
    source_locator: "RQ-15-01 (§15.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-02
    name: "RQ-15-02: identify assets"
    text: >-
      Identify the assets, together with their cybersecurity properties, whose
      compromise would lead to a damage scenario.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-02"
    source_locator: "RQ-15-02 (§15.3.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-03
    name: "RQ-15-03: identify threat scenarios"
    text: >-
      Identify threat scenarios, each stating the asset targeted, which of its
      cybersecurity properties is compromised, and what causes the compromise.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-03"
    source_locator: "RQ-15-03 (§15.4.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-04
    name: "RQ-15-04: assess damage scenarios by impact category"
    text: >-
      Assess what harm each damage scenario could do to road users in each of the four
      impact categories: safety, financial, operational and privacy.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-04"
    source_locator: "RQ-15-04 (§15.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-05
    name: "RQ-15-05: rate impact"
    text: >-
      Rate each damage scenario's impact in every impact category on the four-level
      scale of severe, major, moderate or negligible.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-05"
    source_locator: "RQ-15-05 (§15.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-06
    name: "RQ-15-06: derive safety impact ratings from ISO 26262-3"
    text: >-
      Base safety-related impact ratings on ISO 26262-3:2018, subclause 6.4.3.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-06"
    source_locator: "RQ-15-06 (§15.5.2)"
  - id: requirement:iso-sae-21434-2021-pm-15-07
    name: "PM-15-07: skip less critical impact categories"
    text: >-
      Once one impact category is rated, the analysis of another category may be dropped
      if it can be argued that all of that category's impacts are less critical.
    text_origin: paraphrase
    requirement_kind: process
    normativity: optional
    source_ref: "library:iso-sae-21434-2021#PM-15-07"
    source_locator: "PM-15-07 (§15.5.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-08
    name: "RQ-15-08: identify attack paths"
    text: >-
      Analyse the threat scenarios to find the attack paths that lead to them.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-08"
    source_locator: "RQ-15-08 (§15.6.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-09
    name: "RQ-15-09: associate attack paths with threat scenarios"
    text: >-
      Link each attack path to the threat scenarios it can realize.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-09"
    source_locator: "RQ-15-09 (§15.6.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-10
    name: "RQ-15-10: rate attack feasibility"
    text: >-
      Give every attack path an attack feasibility rating of high, medium, low or very
      low, according to the effort it needs (Table 1).
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-10"
    source_locator: "RQ-15-10 (§15.7.2)"
  - id: requirement:iso-sae-21434-2021-rc-15-11
    name: "RC-15-11: choose a feasibility rating method"
    text: >-
      Base the attack feasibility rating method on one of three approaches: attack
      potential, CVSS, or attack vector.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:iso-sae-21434-2021#RC-15-11"
    source_locator: "RC-15-11 (§15.7.2)"
  - id: requirement:iso-sae-21434-2021-rc-15-12
    name: "RC-15-12: attack potential factors"
    text: >-
      With the attack potential approach, rate feasibility from core factors including
      the time the attack takes, specialist expertise, how much is known about the item
      or component, the window of opportunity and the equipment needed.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:iso-sae-21434-2021#RC-15-12"
    source_locator: "RC-15-12 (§15.7.2)"
  - id: requirement:iso-sae-21434-2021-rc-15-13
    name: "RC-15-13: CVSS exploitability metrics"
    text: >-
      With the CVSS approach, rate feasibility from the base-group exploitability
      metrics: attack vector, attack complexity, privileges required and user
      interaction.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:iso-sae-21434-2021#RC-15-13"
    source_locator: "RC-15-13 (§15.7.2)"
  - id: requirement:iso-sae-21434-2021-rc-15-14
    name: "RC-15-14: predominant attack vector"
    text: >-
      With the attack vector approach, rate feasibility by judging the attack path's
      predominant attack vector, in the CVSS sense.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:iso-sae-21434-2021#RC-15-14"
    source_locator: "RC-15-14 (§15.7.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-15
    name: "RQ-15-15: determine risk values"
    text: >-
      Determine each threat scenario's risk value from the impact of its damage
      scenarios and the feasibility of its attack paths.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:iso-sae-21434-2021#RQ-15-15"
    source_locator: "RQ-15-15 (§15.8.2)"
  - id: requirement:iso-sae-21434-2021-rq-15-16
    name: "RQ-15-16: risk value scale"
    text: >-
      Express a threat scenario's risk value as a number from 1 to 5, where 1 is minimal
      risk.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
