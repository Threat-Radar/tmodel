requirements:
  - id: requirement:etsi-en-304-223-5-1-2-1
    name: "5.1.2-1 — Assess business need, AI security risks and mitigations before building"
    text: >-
      Before deciding to build an AI system, assess and document the business need it
      meets, together with its AI security risks and how they will be mitigated.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-1"
    source_locator: "§5.1.2, Provision 5.1.2-1, p. 10"
  - id: requirement:etsi-en-304-223-5-1-2-2
    name: "5.1.2-2 — Design AI systems to withstand adversarial attacks and failures"
    text: >-
      Design and build the AI system so that it withstands adversarial attacks,
      unexpected inputs and its own failures.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-2"
    source_locator: "§5.1.2, Provision 5.1.2-2, p. 10"
  - id: requirement:etsi-en-304-223-5-1-2-3
    name: "5.1.2-3 — Keep an audit trail of models, datasets and prompts"
    text: >-
      Keep an audit trail of how the system's models, datasets and prompts are operated
      and managed over their lifecycle, to support data preparation, security audits and
      incident response.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-3"
    source_locator: "§5.1.2, Provision 5.1.2-3, p. 10"
  - id: requirement:etsi-en-304-223-5-1-2-4
    name: "5.1.2-4 — Risk-assess external components for AI-specific risks"
    text: >-
      Before using an external component, run an AI security risk assessment and
      due-diligence check on it within the normal software development process.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-4"
    source_locator: "§5.1.2, Provision 5.1.2-4, p. 10"
  - id: requirement:etsi-en-304-223-5-1-2-5
    name: "5.1.2-5 — Match intended use to the sensitivity of training data"
    text: >-
      Check that the system's intended use suits the sensitivity of its training data
      and the controls meant to protect that data.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-5"
    source_locator: "§5.1.2, Provision 5.1.2-5, p. 11"
  - id: requirement:etsi-en-304-223-5-1-2-6
    name: "5.1.2-6 — Give the AI system only the permissions it needs on other systems"
    text: >-
      Grant the AI system only the permissions on other systems and data sources that
      its function needs, and risk-assess those permissions.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-6"
    source_locator: "§5.1.2, Provision 5.1.2-6, p. 11"
  - id: requirement:etsi-en-304-223-5-1-2-7
    name: "5.1.2-7 — Do due diligence on external providers"
    text: >-
      Carry out due diligence on any external provider and check that it follows this
      standard.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.2-7"
    source_locator: "§5.1.2, Provision 5.1.2-7, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-1
    name: "5.1.3-1 — Threat-model and manage risks, including AI-specific attacks"
    text: >-
      Analyse threats and manage security risks to the system, with threat models that
      are reviewed regularly and cover AI-specific attacks such as data poisoning, model
      inversion and membership inference.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.3-1"
    source_locator: "§5.1.3, Provision 5.1.3-1, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-1-1
    name: "5.1.3-1.1 — Re-run threat modelling when settings or configuration change"
    text: >-
      Repeat threat modelling and risk management whenever a setting or configuration
      option is added or changed, at any stage of the lifecycle.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.3-1.1"
    source_locator: "§5.1.3, Provision 5.1.3-1.1, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-1-2
    name: "5.1.3-1.2 — Manage risks of superfluous model functionality"
    text: >-
      Manage the extra risk from model capabilities the system does not need, such as
      the unused modalities of a multi-modal model.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.3-1.2"
    source_locator: "§5.1.3, Provision 5.1.3-1.2, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-1-3
    name: "5.1.3-1.3 — Apply controls in line with corporate risk tolerance"
    text: >-
      Choose controls for the risks the analysis finds, weighing factors such as
      implementation cost against the organization's risk tolerance.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.3-1.3"
    source_locator: "§5.1.3, Provision 5.1.3-1.3, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-2
    name: "5.1.3-2 — Pass unresolved AI threats on to System Operators and End-users"
    text: >-
      Pass AI threats that the developer cannot resolve on to system operators, and from
      them to end-users, with the risks, impacts and recommended actions.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.3-2"
    source_locator: "§5.1.3, Provision 5.1.3-2, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-3
    name: "5.1.3-3 — Get assurance from external parties responsible for AI risks"
    text: >-
      Where an external party is responsible for an AI security risk in the
      organization's infrastructure, get assurance that it can handle that risk.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.1.3-3"
    source_locator: "§5.1.3, Provision 5.1.3-3, p. 11"
  - id: requirement:etsi-en-304-223-5-1-3-4
    name: "5.1.3-4 — Continuously monitor and review infrastructure against risk appetite"
    text: >-
      Monitor and review the system's infrastructure continuously in line with risk
      appetite, accepting that AI systems keep more residual risk than other systems.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.1.3-4"
    source_locator: "§5.1.3, Provision 5.1.3-4, p. 11"
  - id: requirement:etsi-en-304-223-5-1-4-1
    name: "5.1.4-1 — Build in capabilities for human oversight"
    text: >-
      Build in, and keep, the capabilities that humans need to oversee the AI system.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.1.4-1"
    source_locator: "§5.1.4, Provision 5.1.4-1, p. 11"
  - id: requirement:etsi-en-304-223-5-1-4-2
    name: "5.1.4-2 — Make outputs easy for humans to assess"
    text: >-
      Make the system's outputs easy for the responsible humans to assess, for example
      by making them explainable or interpretable.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.1.4-2"
    source_locator: "§5.1.4, Provision 5.1.4-2, p. 11"
  - id: requirement:etsi-en-304-223-5-1-4-3
    name: "5.1.4-3 — Build technical measures where human oversight is a risk control"
    text: >-
      Where human oversight is used as a risk control, design, build, verify and
      maintain the technical measures that make that oversight work.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.1.4-3"
    source_locator: "§5.1.4, Provision 5.1.4-3, p. 11"
  - id: requirement:etsi-en-304-223-5-1-4-4
    name: "5.1.4-4 — Verify Data Custodian security controls are built in"
    text: >-
      Verify that the security controls the data custodian specified are built into the
      system.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.1.4-4"
    source_locator: "§5.1.4, Provision 5.1.4-4, p. 11"
  - id: requirement:etsi-en-304-223-5-1-4-5
    name: "5.1.4-5 — Tell End-users about prohibited use cases"
    text: >-
      Tell end-users which uses of the AI system are prohibited.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.1.4-5"
    source_locator: "§5.1.4, Provision 5.1.4-5, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-1
    name: "5.2.1-1 — Maintain an inventory of assets and their interdependencies"
    text: >-
      Keep a complete inventory of assets, including how they depend on and connect to
      each other.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.1-1"
    source_locator: "§5.2.1, Provision 5.2.1-1, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-2
    name: "5.2.1-2 — Track, authenticate, version-control and secure AI assets"
    text: >-
      Have processes and tools to track, authenticate, version-control and secure AI
      assets.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.1-2"
    source_locator: "§5.2.1, Provision 5.2.1-2, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-3
    name: "5.2.1-3 — Tailor disaster recovery plans to attacks on AI systems"
    text: >-
      Adapt disaster recovery plans to cover attacks aimed specifically at AI systems.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.1-3"
    source_locator: "§5.2.1, Provision 5.2.1-3, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-3-1
    name: "5.2.1-3.1 — Be able to restore a known good state"
    text: >-
      Be able to restore the system to a known good state.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.1-3.1"
    source_locator: "§5.2.1, Provision 5.2.1-3.1, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-4
    name: "5.2.1-4 — Protect sensitive data such as training and test data"
    text: >-
      Protect sensitive data, such as training and test data, from unauthorized access.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.1-4"
    source_locator: "§5.2.1, Provision 5.2.1-4, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-4-1
    name: "5.2.1-4.1 — Check and sanitise data and inputs, and repeat on model revisions"
    text: >-
      Check and sanitise data and inputs when designing the model, according to how they
      are accessed and stored, and repeat this when the model is revised from user
      feedback or continuous learning.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.1-4.1"
    source_locator: "§5.2.1, Provision 5.2.1-4.1, p. 12"
  - id: requirement:etsi-en-304-223-5-2-1-4-2
    name: "5.2.1-4.2 — Protect confidential training data and model weights"
    text: >-
      Protect training data and model weights in proportion to how confidential they
      are.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.1-4.2"
    source_locator: "§5.2.1, Provision 5.2.1-4.2, p. 12"
  - id: requirement:etsi-en-304-223-5-2-2-1
    name: "5.2.2-1 — Secure access to APIs, models, data and pipelines"
    text: >-
      Review the organization's access control framework and decide how to secure APIs,
      models, data, and training and processing pipelines.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.2-1"
    source_locator: "§5.2.2, Provision 5.2.2-1, p. 12"
  - id: requirement:etsi-en-304-223-5-2-2-2
    name: "5.2.2-2 — Protect externally offered APIs, e.g. with rate limits"
    text: >-
      Protect an API offered to external users against attacks on the AI system through
      it, for example with rate limits that slow reverse engineering or rapid poisoning.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.2-2"
    source_locator: "§5.2.2, Provision 5.2.2-2, p. 12"
  - id: requirement:etsi-en-304-223-5-2-2-3
    name: "5.2.2-3 — Use separate, least-privilege development and tuning environments"
    text: >-
      Use separate development and model-tuning environments, enforced by technical
      separation and least privilege, and keep non-public training data only in them.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.2-3"
    source_locator: "§5.2.2, Provision 5.2.2-3, p. 12"
  - id: requirement:etsi-en-304-223-5-2-2-4
    name: "5.2.2-4 — Publish a vulnerability disclosure policy"
    text: >-
      Implement and publish a clear, accessible vulnerability disclosure policy.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.2-4"
    source_locator: "§5.2.2, Provision 5.2.2-4, p. 12"
  - id: requirement:etsi-en-304-223-5-2-2-5
    name: "5.2.2-5 — Maintain an AI incident management plan and recovery plan"
    text: >-
      Create, test and maintain an incident management plan and a recovery plan for the
      AI system.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.2-5"
    source_locator: "§5.2.2, Provision 5.2.2-5, p. 12"
  - id: requirement:etsi-en-304-223-5-2-3-1
    name: "5.2.3-1 — Follow secure software supply chain processes"
    text: >-
      Follow secure software supply chain processes when developing the AI model and
      system.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.3-1"
    source_locator: "§5.2.3, Provision 5.2.3-1, p. 13"
  - id: requirement:etsi-en-304-223-5-2-3-2
    name: "5.2.3-2 — Justify using poorly documented or unsecured models or components"
    text: >-
      Document a justification for using any model or component that is poorly
      documented or unsecured.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.3-2"
    source_locator: "§5.2.3, Provision 5.2.3-2, p. 13"
  - id: requirement:etsi-en-304-223-5-2-3-2-1
    name: "5.2.3-2.1 — Mitigate and risk-assess such models or components"
    text: >-
      Put mitigating controls and a risk assessment in place for any such model or
      component.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.3-2.1"
    source_locator: "§5.2.3, Provision 5.2.3-2.1, p. 13"
  - id: requirement:etsi-en-304-223-5-2-3-2-2
    name: "5.2.3-2.2 — Share that justification with End-users"
    text: >-
      Share that justification with end-users in an accessible form.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.3-2.2"
    source_locator: "§5.2.3, Provision 5.2.3-2.2, p. 13"
  - id: requirement:etsi-en-304-223-5-2-3-3
    name: "5.2.3-3 — Re-run evaluations on released models before using them"
    text: >-
      Re-run evaluations on any released model before using it.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.3-3"
    source_locator: "§5.2.3, Provision 5.2.3-3, p. 13"
  - id: requirement:etsi-en-304-223-5-2-3-4
    name: "5.2.3-4 — Tell End-users before models are updated"
    text: >-
      Tell end-users, in an accessible way, before a model is updated.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.3-4"
    source_locator: "§5.2.3, Provision 5.2.3-4, p. 13"
  - id: requirement:etsi-en-304-223-5-2-4-1
    name: "5.2.4-1 — Document an audit trail of design and maintenance plans"
    text: >-
      Document and maintain an audit trail of the system design and post-deployment
      maintenance plans, and make it available to downstream operators and data
      custodians.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.4-1"
    source_locator: "§5.2.4, Provision 5.2.4-1, p. 13"
  - id: requirement:etsi-en-304-223-5-2-4-1-1
    name: "5.2.4-1.1 — Include security-relevant information in the documentation"
    text: >-
      Include security-relevant details in that documentation, such as training data
      sources, intended scope and limits, guardrails, retention time, review frequency
      and failure modes.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.4-1.1"
    source_locator: "§5.2.4, Provision 5.2.4-1.1, p. 13"
  - id: requirement:etsi-en-304-223-5-2-4-1-2
    name: "5.2.4-1.2 — Release cryptographic hashes of shared model components"
    text: >-
      Publish cryptographic hashes for model components given to others, so that they
      can verify the components are authentic.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.4-1.2"
    source_locator: "§5.2.4, Provision 5.2.4-1.2, p. 13"
  - id: requirement:etsi-en-304-223-5-2-4-2
    name: "5.2.4-2 — Document the source and use of public training data"
    text: >-
      Document where public training data came from, how it was obtained and how the
      model uses it, so that poisoned data can be traced later.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.4-2"
    source_locator: "§5.2.4, Provision 5.2.4-2, p. 13"
  - id: requirement:etsi-en-304-223-5-2-4-2-1
    name: "5.2.4-2.1 — Record the source URL and date of training data"
    text: >-
      Record at least the source of each piece of training data, such as its URL, and
      the date and time it was obtained.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.4-2.1"
    source_locator: "§5.2.4, Provision 5.2.4-2.1, p. 13"
  - id: requirement:etsi-en-304-223-5-2-4-3
    name: "5.2.4-3 — Keep an audit log of system prompt and configuration changes"
    text: >-
      Keep an audit log of changes to system prompts and other model configuration that
      affect how the system works.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.4-3"
    source_locator: "§5.2.4, Provision 5.2.4-3, p. 13"
  - id: requirement:etsi-en-304-223-5-2-5-1
    name: "5.2.5-1 — Security-test all released models, applications and systems"
    text: >-
      Security-test every model, application and system before releasing it to operators
      or end-users.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.5-1"
    source_locator: "§5.2.5, Provision 5.2.5-1, p. 13"
  - id: requirement:etsi-en-304-223-5-2-5-2
    name: "5.2.5-2 — Test before deployment, with Developer support"
    text: >-
      Test the system before deployment, with the developer's support.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.2.5-2"
    source_locator: "§5.2.5, Provision 5.2.5-2, p. 13"
  - id: requirement:etsi-en-304-223-5-2-5-2-1
    name: "5.2.5-2.1 — Use independent security testers"
    text: >-
      Use independent security testers with skills relevant to the AI system.
    text_origin: paraphrase
    requirement_kind: audit
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.5-2.1"
    source_locator: "§5.2.5, Provision 5.2.5-2.1, p. 14"
  - id: requirement:etsi-en-304-223-5-2-5-3
    name: "5.2.5-3 — Share test findings with System Operators"
    text: >-
      Share testing and evaluation findings with system operators to inform their own
      testing.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.5-3"
    source_locator: "§5.2.5, Provision 5.2.5-3, p. 14"
  - id: requirement:etsi-en-304-223-5-2-5-4
    name: "5.2.5-4 — Check outputs do not allow reverse engineering of the model or data"
    text: >-
      Evaluate model outputs to make sure they do not let operators or end-users
      reverse-engineer non-public parts of the model or its training data.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.5-4"
    source_locator: "§5.2.5, Provision 5.2.5-4, p. 14"
  - id: requirement:etsi-en-304-223-5-2-5-4-1
    name: "5.2.5-4.1 — Check outputs do not give unintended influence over the system"
    text: >-
      Evaluate model outputs to make sure they do not give operators or end-users
      unintended influence over the system.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.2.5-4.1"
    source_locator: "§5.2.5, Provision 5.2.5-4.1, p. 14"
  - id: requirement:etsi-en-304-223-5-3-1-1
    name: "5.3.1-1 — Tell End-users how their data is used, accessed and stored"
    text: >-
      Tell end-users, accessibly, where and how their data will be used, accessed and
      stored, for example for retraining or human review.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.3.1-1"
    source_locator: "§5.3.1, Provision 5.3.1-1, p. 14"
  - id: requirement:etsi-en-304-223-5-3-1-2
    name: "5.3.1-2 — Give End-users guidance on use and configuration"
    text: >-
      Give end-users accessible guidance on using, managing, integrating and configuring
      the AI system.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.3.1-2"
    source_locator: "§5.3.1, Provision 5.3.1-2, p. 14"
  - id: requirement:etsi-en-304-223-5-3-1-2-1
    name: "5.3.1-2.1 — Cover appropriate use, limitations and failure modes in guidance"
    text: >-
      Cover appropriate use, limitations and possible failure modes in that guidance.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.3.1-2.1"
    source_locator: "§5.3.1, Provision 5.3.1-2.1, p. 14"
  - id: requirement:etsi-en-304-223-5-3-1-2-2
    name: "5.3.1-2.2 — Proactively inform End-users of security-relevant updates"
    text: >-
      Proactively tell end-users about security-relevant updates, with clear
      explanations.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.3.1-2.2"
    source_locator: "§5.3.1, Provision 5.3.1-2.2, p. 14"
  - id: requirement:etsi-en-304-223-5-3-1-3
    name: "5.3.1-3 — Support End-users and Affected Entities during incidents"
    text: >-
      Help end-users and affected entities contain and mitigate a cyber security
      incident, under a documented process agreed in their contracts.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.3.1-3"
    source_locator: "§5.3.1, Provision 5.3.1-3, p. 14"
  - id: requirement:etsi-en-304-223-5-4-1-1
    name: "5.4.1-1 — Provide security updates and deliver them to End-users"
    text: >-
      Provide security updates and patches where possible and notify system operators,
      who deliver them to end-users.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.4.1-1"
    source_locator: "§5.4.1, Provision 5.4.1-1, p. 14"
  - id: requirement:etsi-en-304-223-5-4-1-1-1
    name: "5.4.1-1.1 — Have contingency plans where updates cannot be provided"
    text: >-
      Have mechanisms and contingency plans to reduce security risk where updates cannot
      be provided.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.4.1-1.1"
    source_locator: "§5.4.1, Provision 5.4.1-1.1, p. 14"
  - id: requirement:etsi-en-304-223-5-4-1-2
    name: "5.4.1-2 — Treat major updates as a new model and re-test"
    text: >-
      Treat a major update as a new model version and repeat security testing and
      evaluation.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.4.1-2"
    source_locator: "§5.4.1, Provision 5.4.1-2, p. 14"
  - id: requirement:etsi-en-304-223-5-4-1-3
    name: "5.4.1-3 — Help System Operators evaluate model changes"
    text: >-
      Help system operators evaluate and respond to model changes, for example with
      preview access or versioned APIs.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.4.1-3"
    source_locator: "§5.4.1, Provision 5.4.1-3, p. 14"
  - id: requirement:etsi-en-304-223-5-4-2-1
    name: "5.4.2-1 — Log system and user actions"
    text: >-
      Log system and user actions to support security compliance, incident investigation
      and vulnerability remediation.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.4.2-1"
    source_locator: "§5.4.2, Provision 5.4.2-1, p. 15"
  - id: requirement:etsi-en-304-223-5-4-2-2
    name: "5.4.2-2 — Analyse logs for anomalies, drift and poisoning"
    text: >-
      Analyse logs to confirm the model still behaves as intended, and to detect
      anomalies, breaches or unexpected behaviour such as from data drift or poisoning.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.4.2-2"
    source_locator: "§5.4.2, Provision 5.4.2-2, p. 15"
  - id: requirement:etsi-en-304-223-5-4-2-3
    name: "5.4.2-3 — Monitor internal states of the AI system"
    text: >-
      Monitor the AI system's internal states where that helps address security threats
      or supports later security analysis.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.4.2-3"
    source_locator: "§5.4.2, Provision 5.4.2-3, p. 15"
  - id: requirement:etsi-en-304-223-5-4-2-4
    name: "5.4.2-4 — Monitor model performance over time"
    text: >-
      Monitor model and system performance over time to detect sudden or gradual changes
      in behaviour that could affect security.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:etsi-en-304-223#5.4.2-4"
    source_locator: "§5.4.2, Provision 5.4.2-4, p. 15"
  - id: requirement:etsi-en-304-223-5-5-1-1
    name: "5.5.1-1 — Involve Data Custodians and dispose securely when transferring ownership"
    text: >-
      When transferring or sharing ownership of training data or a model, involve the
      data custodians and securely dispose of the assets.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.5.1-1"
    source_locator: "§5.5.1, Provision 5.5.1-1, p. 15"
  - id: requirement:etsi-en-304-223-5-5-1-2
    name: "5.5.1-2 — Involve Data Custodians and delete data when decommissioning"
    text: >-
      When decommissioning a model or system, involve the data custodians and securely
      delete the relevant data and configuration.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:etsi-en-304-223#5.5.1-2"
    source_locator: "§5.5.1, Provision 5.5.1-2, p. 15"

