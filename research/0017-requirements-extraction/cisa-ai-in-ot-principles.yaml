requirements:
  - id: requirement:cisa-ai-in-ot-principles-r-0011
    name: "R-0011 — Consider the known AI risks"
    text: >-
      Consider the known AI risks that the guidance's Table 2 lists for AI in OT.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0011"
    source_locator: "R-0011 (§1.1 Understand the Unique Risks of AI and Potential Impact to OT, p. 7)"
  - id: requirement:cisa-ai-in-ot-principles-r-0013
    name: "R-0013 — Traditional security still applies"
    description: >-
      Normativity is informative: a statement (library normativity: statement), not a
      recommendation.
    text: >-
      Keep applying traditional security measures such as access control, auditing and
      encryption to AI and AI-enabled systems.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: informative
    source_ref: "library:cisa-ai-in-ot-principles#R-0013"
    source_locator: "R-0013 (§1.1 Understand the Unique Risks of AI and Potential Impact to OT, p. 7)"
  - id: requirement:cisa-ai-in-ot-principles-r-0014
    name: "R-0014 — No LLM safety decisions"
    description: >-
      Normativity is recommended: 'almost certainly should not': a recommendation
      (library normativity: prohibition).
    text: >-
      Do not use AI such as large language models to make safety decisions in OT
      environments.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0014"
    source_locator: "R-0014 (§1.1 Understand the Unique Risks of AI and Potential Impact to OT, p. 9)"
  - id: requirement:cisa-ai-in-ot-principles-r-0018
    name: "R-0018 — Secure design"
    text: >-
      Design the AI system with security in mind from the start, including robust
      coding, protocols and data protection.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0018"
    source_locator: "R-0018 (§1.2 Understand the Secure AI System Development Lifecycle, p. 10)"
  - id: requirement:cisa-ai-in-ot-principles-r-0019
    name: "R-0019 — Secure procurement or development"
    text: >-
      Choose vendors that follow secure practices, and develop AI systems with secure
      methods and tools.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0019"
    source_locator: "R-0019 (§1.2 Understand the Secure AI System Development Lifecycle, p. 10)"
  - id: requirement:cisa-ai-in-ot-principles-r-0020
    name: "R-0020 — Secure deployment"
    text: >-
      Deploy the AI system in a way that keeps its security posture, with network
      segmentation and access control, and verify that it works as intended.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0020"
    source_locator: "R-0020 (§1.2 Understand the Secure AI System Development Lifecycle, p. 10)"
  - id: requirement:cisa-ai-in-ot-principles-r-0021
    name: "R-0021 — Secure operation and maintenance"
    text: >-
      Keep the AI system secure throughout its life, including regular updates and
      patches and monitoring for vulnerabilities.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0021"
    source_locator: "R-0021 (§1.2 Understand the Secure AI System Development Lifecycle, p. 10)"
  - id: requirement:cisa-ai-in-ot-principles-r-0022
    name: "R-0022 — Weigh the ways of sourcing an AI system"
    text: >-
      Weigh the trade-offs between procuring, building and customizing an AI system.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0022"
    source_locator: "R-0022 (§1.2 Understand the Secure AI System Development Lifecycle, p. 10)"
  - id: requirement:cisa-ai-in-ot-principles-r-0029
    name: "R-0029 — Train OT teams to validate AI output"
    text: >-
      Train OT teams in AI fundamentals and threat modelling, so that they can validate
      AI outputs, for example against alternative sensors, and know what to do when
      outputs are invalid.
    text_origin: paraphrase
    requirement_kind: organizational
    normativity: optional
    source_ref: "library:cisa-ai-in-ot-principles#R-0029"
    source_locator: "R-0029 (§1.3 Educate Personnel on AI, p. 11)"
  - id: requirement:cisa-ai-in-ot-principles-r-0031
    name: "R-0031 — Request explainable outputs"
    text: >-
      Ask for AI outputs that document how a decision was reached, so that humans can
      understand and validate them.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: optional
    source_ref: "library:cisa-ai-in-ot-principles#R-0031"
    source_locator: "R-0031 (§1.3 Educate Personnel on AI, p. 11)"
  - id: requirement:cisa-ai-in-ot-principles-r-0039
    name: "R-0039 — Data assurance"
    text: >-
      Know where OT training data is stored, keep it under the organization's control,
      manage who can view or change it, and understand how AI vendors access and use it.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0039"
    source_locator: "R-0039 (§2.2 Manage OT Data Security Risks for AI Systems, p. 12)"
  - id: requirement:cisa-ai-in-ot-principles-r-0041
    name: "R-0041 — Limit exposure of sensitive data"
    text: >-
      Avoid sharing sensitive data with AI models, especially models hosted by external
      parties such as public cloud providers.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0041"
    source_locator: "R-0041 (§2.2 Manage OT Data Security Risks for AI Systems, p. 13)"
  - id: requirement:cisa-ai-in-ot-principles-r-0042
    name: "R-0042 — Data privacy and security"
    text: >-
      Protect proprietary and personal information in OT datasets, including against
      access abuse, data poisoning and over-reliance on synthetic data.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0042"
    source_locator: "R-0042 (§2.2 Manage OT Data Security Risks for AI Systems, p. 13)"
  - id: requirement:cisa-ai-in-ot-principles-r-0045
    name: "R-0045 — Cover AI in the data integrity program"
    text: >-
      Work with model developers so that the data integrity program covers AI systems.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0045"
    source_locator: "R-0045 (§2.2 Manage OT Data Security Risks for AI Systems, p. 13)"
  - id: requirement:cisa-ai-in-ot-principles-r-0047
    name: "R-0047 — Protect engineering configuration data"
    text: >-
      Give priority to protecting engineering configuration data, such as network
      diagrams, asset inventories, logic diagrams and schematics, which adversaries
      value.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0047"
    source_locator: "R-0047 (§2.2 Manage OT Data Security Risks for AI Systems, p. 13)"
  - id: requirement:cisa-ai-in-ot-principles-r-0048
    name: "R-0048 — Protect ephemeral OT data"
    text: >-
      Give priority to protecting process measurement data, because a model trained on
      it can retain it and reveal intellectual property or patterns of activity.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0048"
    source_locator: "R-0048 (§2.2 Manage OT Data Security Risks for AI Systems, p. 13)"
  - id: requirement:cisa-ai-in-ot-principles-r-0049
    name: "R-0049 — Demand AI transparency from OT vendors"
    text: >-
      Require OT vendors to be transparent about how AI is embedded in their products
      and how it is secured.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0049"
    source_locator: "R-0049 (§2.3 Understanding the Role of OT Vendors in AI Integration, p. 14)"
  - id: requirement:cisa-ai-in-ot-principles-r-0051
    name: "R-0051 — Software supply chain and SBOM"
    text: >-
      Require OT vendors to say how AI is embedded in their products, including through
      an SBOM, and where the AI models they use come from and are hosted.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0051"
    source_locator: "R-0051 (§2.3 Understanding the Role of OT Vendors in AI Integration, p. 14)"
  - id: requirement:cisa-ai-in-ot-principles-r-0052
    name: "R-0052 — Vendor notifications"
    text: >-
      Expect AI vendors to disclose any sign that their AI can give improper advice or
      take inappropriate action, beyond their usual vulnerability disclosure.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0052"
    source_locator: "R-0052 (§2.3 Understanding the Role of OT Vendors in AI Integration, p. 14)"
  - id: requirement:cisa-ai-in-ot-principles-r-0053
    name: "R-0053 — Data usage policy"
    text: >-
      Control whether and how vendors use operational data, for example for training,
      through a data usage policy that covers residency, communication paths, encryption
      and storage.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: optional
    source_ref: "library:cisa-ai-in-ot-principles#R-0053"
    source_locator: "R-0053 (§2.3 Understanding the Role of OT Vendors in AI Integration, p. 14)"
  - id: requirement:cisa-ai-in-ot-principles-r-0054
    name: "R-0054 — Ask about offline operation"
    text: >-
      Ask whether the vendor's AI can run on premises, or without continuous access to
      the internet or the vendor's cloud.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0054"
    source_locator: "R-0054 (§2.3 Understanding the Role of OT Vendors in AI Integration, p. 14)"
  - id: requirement:cisa-ai-in-ot-principles-r-0055
    name: "R-0055 — Operator control of AI features"
    text: >-
      Specify when AI features can be disabled or enabled, with the operator in control.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0055"
    source_locator: "R-0055 (§2.3 Understanding the Role of OT Vendors in AI Integration, p. 14)"
  - id: requirement:cisa-ai-in-ot-principles-r-0059
    name: "R-0059 — Combine AI and traditional security"
    text: >-
      Add AI security to an overall security strategy that also covers traditional
      controls such as encryption, access control and intrusion detection.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0059"
    source_locator: "R-0059 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 15)"
  - id: requirement:cisa-ai-in-ot-principles-r-0063
    name: "R-0063 — Use test infrastructure first"
    text: >-
      Where possible, test on dedicated test infrastructure before deploying to
      production.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0063"
    source_locator: "R-0063 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 15)"
  - id: requirement:cisa-ai-in-ot-principles-r-0064
    name: "R-0064 — Push-based architectures"
    text: >-
      Prefer architectures that push data out of the OT network for AI use, without
      giving the AI persistent access into that network.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0064"
    source_locator: "R-0064 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 15)"
  - id: requirement:cisa-ai-in-ot-principles-r-0065
    name: "R-0065 — Keep control of critical functions"
    text: >-
      Keep the organization in control of the critical functions an AI system integrates
      with or enables, whether it is hosted locally or in the cloud.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0065"
    source_locator: "R-0065 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 15)"
  - id: requirement:cisa-ai-in-ot-principles-r-0066
    name: "R-0066 — Failsafe to traditional control"
    text: >-
      Provide failsafe mechanisms that revert AI-enabled processes to traditional
      automation or manual operation.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0066"
    source_locator: "R-0066 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 15)"
  - id: requirement:cisa-ai-in-ot-principles-r-0067
    name: "R-0067 — Integrate AI like any new OT system"
    text: >-
      Test AI systems for safety impacts such as latency and interoperability, and check
      that new connection paths are approved and go through the existing DMZ or
      jump-host infrastructure.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0067"
    source_locator: "R-0067 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 15)"
  - id: requirement:cisa-ai-in-ot-principles-r-0068
    name: "R-0068 — Limit AI control without a human"
    text: >-
      Limit the AI's active control of OT infrastructure when no human is in the loop.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0068"
    source_locator: "R-0068 (§2.4 Evaluate Challenges in AI-OT System Integration, p. 16)"
  - id: requirement:cisa-ai-in-ot-principles-r-0076
    name: "R-0076 — Strict data governance"
    text: >-
      Enforce data governance policies that protect sensitive OT data used by AI,
      including encryption, access control and user behaviour analytics.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: optional
    source_ref: "library:cisa-ai-in-ot-principles#R-0076"
    source_locator: "R-0076 (§3.1 Establish Governance Mechanisms for AI in OT, p. 16)"
  - id: requirement:cisa-ai-in-ot-principles-r-0078
    name: "R-0078 — Regular audits and compliance testing"
    text: >-
      Run regular audits and compliance tests to find issues and confirm continued
      adherence to AI governance requirements.
    text_origin: paraphrase
    requirement_kind: audit
    normativity: optional
    source_ref: "library:cisa-ai-in-ot-principles#R-0078"
    source_locator: "R-0078 (§3.1 Establish Governance Mechanisms for AI in OT, p. 16)"
  - id: requirement:cisa-ai-in-ot-principles-r-0081
    name: "R-0081 — Apply existing cyber requirements to AI"
    text: >-
      Factor in traditional cybersecurity requirements, vulnerability management and
      critical infrastructure regulations when integrating AI systems.
    text_origin: paraphrase
    requirement_kind: process
    normativity: mandatory
    source_ref: "library:cisa-ai-in-ot-principles#R-0081"
    source_locator: "R-0081 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0082
    name: "R-0082 — Regular security audits and risk assessments"
    text: >-
      Conduct regular security audits and risk assessments of AI systems, or get proof
      that the AI vendor does, to find vulnerabilities.
    text_origin: paraphrase
    requirement_kind: audit
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0082"
    source_locator: "R-0082 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0083
    name: "R-0083 — Robust security controls"
    text: >-
      Implement controls such as encryption, access control and intrusion detection that
      protect AI systems and data and detect anomalies in them.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0083"
    source_locator: "R-0083 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0084
    name: "R-0084 — Log AI endpoint traffic"
    text: >-
      Collect flow and access logs for AI endpoints, and track data egress by asset and
      identity.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0084"
    source_locator: "R-0084 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0085
    name: "R-0085 — Data loss prevention for prompts and outputs"
    text: >-
      Use data loss prevention to inspect prompts and outputs.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0085"
    source_locator: "R-0085 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0086
    name: "R-0086 — Use AI-specific threat information"
    text: >-
      Include AI-related tactics, techniques and procedures when assessing risk or
      modelling threats.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0086"
    source_locator: "R-0086 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0087
    name: "R-0087 — Use ATLAS alongside ATT&CK"
    text: >-
      When mapping threat-actor behaviour with MITRE ATT&CK, also use AI-specific
      techniques such as those in MITRE ATLAS.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0087"
    source_locator: "R-0087 (§3.2 Integrating AI Into Existing Security and Cybersecurity Frameworks, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0089
    name: "R-0089 — Test on dedicated infrastructure"
    text: >-
      Test the AI system first on infrastructure built for testing.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0089"
    source_locator: "R-0089 (§3.3 Conduct Thorough AI Testing and Evaluation, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0091
    name: "R-0091 — Understand vendor testing"
    text: >-
      Alternatively, find out how vendors test, including which dependencies, such as
      operating system versions and protocols, their tests cover.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0091"
    source_locator: "R-0091 (§3.3 Conduct Thorough AI Testing and Evaluation, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0092
    name: "R-0092 — Test on realistic non-production systems"
    text: >-
      As the system matures, test on more realistic non-production systems, including
      hardware in the loop.
    text_origin: paraphrase
    requirement_kind: process
    normativity: optional
    source_ref: "library:cisa-ai-in-ot-principles#R-0092"
    source_locator: "R-0092 (§3.3 Conduct Thorough AI Testing and Evaluation, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0093
    name: "R-0093 — Move to production only after testing"
    text: >-
      Move the AI system into production only after enough testing in a non-production
      environment.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0093"
    source_locator: "R-0093 (§3.3 Conduct Thorough AI Testing and Evaluation, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0095
    name: "R-0095 — Protect data during testing"
    text: >-
      Apply normal data protection during AI testing and evaluation, such as keeping
      production data out of non-production environments.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0095"
    source_locator: "R-0095 (§3.3 Conduct Thorough AI Testing and Evaluation, p. 17)"
  - id: requirement:cisa-ai-in-ot-principles-r-0098
    name: "R-0098 — Thresholds for falling back to non-AI systems"
    text: >-
      Set and deploy thresholds at which OT falls back to non-AI systems, such as when
      AI outputs drop below performance or safety thresholds.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0098"
    source_locator: "R-0098 (§3.4 Navigating Regulatory and Compliance Considerations for AI in OT, p. 18)"
  - id: requirement:cisa-ai-in-ot-principles-r-0100
    name: "R-0100 — Inventory AI components"
    text: >-
      Support oversight by inventorying AI components and the components that rely on
      them.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0100"
    source_locator: "R-0100 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 18)"
  - id: requirement:cisa-ai-in-ot-principles-r-0101
    name: "R-0101 — Log and monitor AI inputs and outputs"
    text: >-
      Log and monitor the inputs and outputs of those AI components.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0101"
    source_locator: "R-0101 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 18)"
  - id: requirement:cisa-ai-in-ot-principles-r-0102
    name: "R-0102 — Known good state and safe-behaviour thresholds"
    text: >-
      Keep a known good state, or thresholds for safe behaviour, so that it is clear
      when to maintain the system or restore it from backup.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0102"
    source_locator: "R-0102 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 18)"
  - id: requirement:cisa-ai-in-ot-principles-r-0104
    name: "R-0104 — Human-in-the-loop decisions"
    text: >-
      Involve operators and engineers in decisions, especially for critical OT
      operations, for example through the existing change management process for passive
      AI systems.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0104"
    source_locator: "R-0104 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 18)"
  - id: requirement:cisa-ai-in-ot-principles-r-0106
    name: "R-0106 — Human intervention points in control logic"
    text: >-
      Where AI updates control logic, add human intervention points using safety
      thresholds, alternative sensor output or state changes.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0106"
    source_locator: "R-0106 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0108
    name: "R-0108 — Anomaly detection and safe operating bounds"
    text: >-
      Use anomaly detection and behavioural analytics, with safe operating bounds that
      detect AI drift, safety-relevant model changes or security risks.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0108"
    source_locator: "R-0108 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0109
    name: "R-0109 — Log AI decisions under a distinct identity"
    text: >-
      Log AI decisions for compliance and forensics, under an AI identity distinct from
      ordinary machine or user identifiers.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0109"
    source_locator: "R-0109 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0112
    name: "R-0112 — Anomaly detection on AI output (example)"
    text: >-
      In the predictive-maintenance example, use statistical process control to detect
      outliers in the AI's predictions.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0112"
    source_locator: "R-0112 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0113
    name: "R-0113 — Monitoring dashboards (example)"
    text: >-
      Track AI performance and detect anomalies with real-time monitoring, ideally
      integrated into existing HMI views.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0113"
    source_locator: "R-0113 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0114
    name: "R-0114 — Audit trail of AI operation (example)"
    text: >-
      Log all AI operating data, including timestamps, inputs and outputs, for auditing
      and analysing its behaviour.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0114"
    source_locator: "R-0114 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0115
    name: "R-0115 — AI red teaming (example)"
    text: >-
      Regularly assess the AI system's functions offensively, as red teaming, to find
      vulnerabilities and test resilience.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0115"
    source_locator: "R-0115 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0116
    name: "R-0116 — Network and egress controls (example)"
    text: >-
      Define and enforce network controls, following CISA's Cybersecurity Performance
      Goal 2.F.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0116"
    source_locator: "R-0116 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 19)"
  - id: requirement:cisa-ai-in-ot-principles-r-0119
    name: "R-0119 — Validate models in simulation"
    text: >-
      Continuously validate and refine AI models in simulated environments before
      deployment.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0119"
    source_locator: "R-0119 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0120
    name: "R-0120 — Update threat models for AI attacks"
    text: >-
      Regularly update threat models with AI-specific attack vectors, such as
      adversarial inputs or data poisoning, and monitor for anomalies or manipulation
      attempts.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0120"
    source_locator: "R-0120 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0125
    name: "R-0125 — Push-based or brokered architectures"
    text: >-
      Prefer push-based or brokered designs that move the needed features or summaries
      out of OT without persistent inbound access.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0125"
    source_locator: "R-0125 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0126
    name: "R-0126 — One-way transfer to business networks"
    text: >-
      Where data must reach business networks, use one-way transfer and audited staging
      buffers.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0126"
    source_locator: "R-0126 (§4.1 Establish Monitoring and Oversight Mechanisms for AI in OT, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0127
    name: "R-0127 — Fail gracefully"
    text: >-
      Provide failsafe mechanisms so that AI systems fail gracefully without disrupting
      critical operations.
    text_origin: paraphrase
    requirement_kind: technical
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0127"
    source_locator: "R-0127 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0128
    name: "R-0128 — Add AI failure states to safety and response processes"
    text: >-
      Add AI failure states, including how to bypass or replace the AI system, to
      existing functional safety and incident response processes.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0128"
    source_locator: "R-0128 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0129
    name: "R-0129 — Process owners add the failure states"
    text: >-
      Have the operators who maintain the functional safety and incident response
      processes add these AI failure states.
    text_origin: paraphrase
    requirement_kind: process
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0129"
    source_locator: "R-0129 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0130
    name: "R-0130 — Functional safety procedures for AI"
    text: >-
      Design functional safety procedures that take the AI system into account.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0130"
    source_locator: "R-0130 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0131
    name: "R-0131 — Safe-use procedures for AI integration"
    text: >-
      Review how the AI system fits existing procedures, and write new safe-use and
      implementation procedures for integrating it into OT.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0131"
    source_locator: "R-0131 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0132
    name: "R-0132 — AI in the incident response plan"
    text: >-
      Add AI considerations to the cybersecurity incident response plan.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0132"
    source_locator: "R-0132 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"
  - id: requirement:cisa-ai-in-ot-principles-r-0133
    name: "R-0133 — Respond to attacks on and failures of AI"
    text: >-
      Update incident response plans and functional safety procedures with steps for
      responding to malicious activity against an AI system and to its failure.
    text_origin: paraphrase
    requirement_kind: documentation
    normativity: recommended
    source_ref: "library:cisa-ai-in-ot-principles#R-0133"
    source_locator: "R-0133 (§4.2 Embed Safety and Failsafe Mechanisms, p. 20)"

