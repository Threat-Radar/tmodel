reviews:
- id: review:paria03-sp-800-218a-po-5-1-r1
  reviews: assertion:sp-800-218a-po-5-1-r1-addresses-sp-800-218a-resource-exhaustion
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: resource and request limits address service exhaustion
    by limiting excessive consumption during model development.'
- id: review:paria03-sp-800-218a-po-5-1-r6
  reviews: assertion:sp-800-218a-po-5-1-r6-addresses-sp-800-218a-disclosure
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: monitoring for exposed secrets addresses information
    disclosure from leaked secrets specifically, not every form of disclosure.'
- id: review:paria03-sp-800-218a-ps-1-1-r2
  reviews: assertion:sp-800-218a-ps-1-1-r2-addresses-sp-800-218a-weight-theft
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: restricting direct model access reduces opportunities
    for unauthorized access and model-weight theft.'
- id: review:paria03-sp-800-218a-ps-1-3-r4
  reviews: assertion:sp-800-218a-ps-1-3-r4-addresses-sp-800-218a-weight-theft
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: encryption and access controls can protect model
    weights from theft. Hashes alone do not prevent theft.'
- id: review:paria03-sp-800-218a-pw-3-1
  reviews: assertion:sp-800-218a-pw-3-1-addresses-sp-800-218a-poisoning
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: checking development data for poisoning and tampering
    directly addresses poisoned training data.'
- id: review:paria03-sp-800-218a-pw-3-1-r1
  reviews: assertion:sp-800-218a-pw-3-1-r1-addresses-sp-800-218a-poisoning
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: data provenance and integrity checks help detect
    changes associated with poisoned data. A known origin does not guarantee safe content.'
- id: review:paria03-sp-800-218a-pw-3-1-r2
  reviews: assertion:sp-800-218a-pw-3-1-r2-addresses-sp-800-218a-poisoning
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: data analysis, filtering and cleaning can identify
    or remove harmful data relevant to poisoning.'
- id: review:paria03-sp-800-218a-pw-4-4-r2
  reviews: assertion:sp-800-218a-pw-4-4-r2-addresses-sp-800-218a-supply-chain
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: testing acquired models and components for malicious
    content addresses supply-chain attacks.'
- id: review:paria03-sp-800-218a-pw-5-1-r2
  reviews: assertion:sp-800-218a-pw-5-1-r2-addresses-sp-800-218a-injected-content
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: contextual input and output validation and sanitization
    address malicious content. Logging alone does not remove content.'
- id: review:paria03-sp-800-218a-pw-5-1-r3
  reviews: assertion:sp-800-218a-pw-5-1-r3-addresses-sp-800-218a-injected-content
  reviewer: party:paria03
  review_status: accepted
  justification: 'Accepted as a proposed relationship: input and output encoding addresses unauthorized
    code execution from executable content, not every harmful output.'
