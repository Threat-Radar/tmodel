requirements:
- id: requirement:eu-cra-2024-2847-annexi-parti-1
  name: AnnexI-PartI(1) — Provide risk-appropriate cybersecurity
  text: >-
    Design, develop, and produce the product so its cybersecurity level is appropriate to the risks
    identified for it.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(1)
  source_locator: Annex I, Part I, point (1)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-a
  name: AnnexI-PartI(2)(a) — Release without known exploitable vulnerabilities
  text: >-
    Where the risk assessment makes this applicable, place the product on the market without known
    exploitable vulnerabilities.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(a)
  source_locator: Annex I, Part I, point (2)(a)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-b
  name: AnnexI-PartI(2)(b) — Ship securely configured by default
  text: >-
    Where applicable, supply a secure default configuration and a way to restore the product to its
    original state, subject to the stated tailor-made business-product exception.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(b)
  source_locator: Annex I, Part I, point (2)(b)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-c
  name: AnnexI-PartI(2)(c) — Provide timely security updates
  text: >-
    Where applicable, support vulnerability correction through timely security updates, default-enabled
    automatic installation with a clear opt-out, update notices, and temporary postponement.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(c)
  source_locator: Annex I, Part I, point (2)(c)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-d
  name: AnnexI-PartI(2)(d) — Control and report unauthorized access
  text: >-
    Where applicable, use authentication, identity, access-management, or comparable controls to prevent
    unauthorized access and report possible unauthorized access.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(d)
  source_locator: Annex I, Part I, point (2)(d)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-e
  name: AnnexI-PartI(2)(e) — Protect data confidentiality
  text: >-
    Where applicable, protect the confidentiality of data at rest, in transit, and during other processing
    through current encryption or other technical safeguards.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(e)
  source_locator: Annex I, Part I, point (2)(e)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-f
  name: AnnexI-PartI(2)(f) — Protect data and software integrity
  text: >-
    Where applicable, protect data, commands, software, and configuration from unauthorized manipulation
    and report detected corruption.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(f)
  source_locator: Annex I, Part I, point (2)(f)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-g
  name: AnnexI-PartI(2)(g) — Minimize processed data
  text: >-
    Where applicable, process only the data that is relevant and necessary for the product's intended
    purpose.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(g)
  source_locator: Annex I, Part I, point (2)(g)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-h
  name: AnnexI-PartI(2)(h) — Preserve essential availability
  text: >-
    Where applicable, preserve essential and basic functions during and after incidents, including
    by resisting and mitigating denial-of-service attacks.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(h)
  source_locator: Annex I, Part I, point (2)(h)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-i
  name: AnnexI-PartI(2)(i) — Limit harm to connected services
  text: >-
    Where applicable, reduce the product's and connected devices' adverse effect on the availability
    of other devices' or networks' services.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(i)
  source_locator: Annex I, Part I, point (2)(i)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-j
  name: AnnexI-PartI(2)(j) — Reduce exposed attack surface
  text: >-
    Where applicable, design, develop, and produce the product to minimize its attack surface, including
    exposed interfaces.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(j)
  source_locator: Annex I, Part I, point (2)(j)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-k
  name: AnnexI-PartI(2)(k) — Mitigate exploitation impact
  text: >-
    Where applicable, incorporate mechanisms and techniques that reduce the consequences of successful
    exploitation or another incident.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(k)
  source_locator: Annex I, Part I, point (2)(k)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-l
  name: AnnexI-PartI(2)(l) — Record security-relevant activity
  text: >-
    Where applicable, record and monitor relevant internal access and changes to data, services, and
    functions while providing a user opt-out.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(l)
  source_locator: Annex I, Part I, point (2)(l)
- id: requirement:eu-cra-2024-2847-annexi-parti-2-m
  name: AnnexI-PartI(2)(m) — Support secure deletion and transfer
  text: >-
    Where applicable, let users permanently remove data and settings easily and securely, and protect
    data when it is transferred to another product or system.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartI(2)(m)
  source_locator: Annex I, Part I, point (2)(m)
- id: requirement:eu-cra-2024-2847-annexi-partii-1
  name: AnnexI-PartII(1) — Maintain vulnerability and component records
  text: >-
    Identify and document product vulnerabilities and components, including a machine-readable software
    bill of materials that covers at least top-level dependencies.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(1)
  source_locator: Annex I, Part II, point (1)
- id: requirement:eu-cra-2024-2847-annexi-partii-2
  name: AnnexI-PartII(2) — Remediate vulnerabilities promptly
  text: >-
    Address vulnerabilities without delay by supplying security updates and, when technically feasible,
    keep those updates separate from feature updates.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(2)
  source_locator: Annex I, Part II, point (2)
- id: requirement:eu-cra-2024-2847-annexi-partii-3
  name: AnnexI-PartII(3) — Test and review product security
  text: >-
    Perform effective security testing and reviews of the product on a regular basis.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(3)
  source_locator: Annex I, Part II, point (3)
- id: requirement:eu-cra-2024-2847-annexi-partii-4
  name: AnnexI-PartII(4) — Publish fixed-vulnerability advisories
  text: >-
    After an update is available, publish enough information about each corrected vulnerability, affected
    product, impact, severity, and remediation for users to identify and address it.
  text_origin: paraphrase
  requirement_kind: documentation
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(4)
  source_locator: Annex I, Part II, point (4)
- id: requirement:eu-cra-2024-2847-annexi-partii-5
  name: AnnexI-PartII(5) — Operate coordinated disclosure
  text: >-
    Establish and enforce a coordinated vulnerability-disclosure policy.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(5)
  source_locator: Annex I, Part II, point (5)
- id: requirement:eu-cra-2024-2847-annexi-partii-6
  name: AnnexI-PartII(6) — Enable vulnerability reporting
  text: >-
    Facilitate sharing information about possible product and third-party-component vulnerabilities,
    including by providing a vulnerability-reporting contact.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(6)
  source_locator: Annex I, Part II, point (6)
- id: requirement:eu-cra-2024-2847-annexi-partii-7
  name: AnnexI-PartII(7) — Distribute updates securely
  text: >-
    Provide secure update-distribution mechanisms so vulnerabilities are fixed or mitigated promptly
    and security updates can be automatic where appropriate.
  text_origin: paraphrase
  requirement_kind: technical
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(7)
  source_locator: Annex I, Part II, point (7)
- id: requirement:eu-cra-2024-2847-annexi-partii-8
  name: AnnexI-PartII(8) — Disseminate security updates promptly
  text: >-
    Distribute available security updates without delay and with clear advice on required user action,
    normally free of charge unless the manufacturer and a business user agree otherwise for a tailor-made
    product.
  text_origin: paraphrase
  requirement_kind: process
  normativity: mandatory
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(8)
  source_locator: Annex I, Part II, point (8)
- id: requirement:eu-cra-2024-2847-annexi-partii-4-delay
  name: AnnexI-PartII(4)-delay — Delay disclosure only when justified
  text: >-
    A manufacturer may postpone public information about a fixed vulnerability until users can apply
    the patch when a justified assessment finds publication risk greater than its security benefit.
  text_origin: paraphrase
  requirement_kind: process
  normativity: optional
  source_ref: library:eu-cra-2024-2847#AnnexI-PartII(4)-delay
  source_locator: Annex I, Part II, point (4), after semicolon
