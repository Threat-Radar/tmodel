# EXAMPLE MODEL 2 (RPT-0009): GitHub Copilot agent mode approves its own tool calls (CVE-2025-53773)
#
# A published attack on a real AI product, modeled from its primary sources the way the sponsor
# directed on 2026-10-14 (DL-0013) and em-01 followed. EchoLeak leaks data; this one runs code:
# instructions in a project file make the coding agent rewrite its own settings so that it
# stops asking before tool calls, then run commands on the developer's machine.
#
# Sources (fetched 2026-11-09; SHA-256 of the bytes as fetched):
# - J. Rehberger, "GitHub Copilot: Remote Code Execution via Prompt Injection (CVE-2025-53773)",
#   Embrace The Red, 2025-08-12.
#   https://embracethered.com/blog/posts/2025/github-copilot-remote-code-execution-via-prompt-injection/
#   (01abf71f615ec2d607311dd5424bd72be05b43a3490ce3cbfdc2c708ae2a80db). Its sections "Exploit
#   Chain Explained", "Joining the Workstation to a Botnet", "Building an AI Virus", "Using
#   Invisible Instructions" and "Recommendations and Fix" are the basis for the steps.
# - CVE-2025-53773, https://cveawg.mitre.org/api/cve/CVE-2025-53773
#   (a3ba4014677e78226f4be6c0f96445be15c6cdd52e5cee49aaff31b162ab9de8; dateUpdated 2026-02-26)
# - CWE pages for CWE-77, CWE-15 and CWE-1427, as fetched 2026-11-09
#   (https://cwe.mitre.org/data/definitions/77.html,
#   636ea34b63dec4be28c1f96ca8e93e6f2dd9fa25c5cdb2d29755d564342f51a4;
#   .../15.html, b5d9c2884d3203107151daef9a0d064e4159fbfc6cd4b1a7fe55435ee8f0fa96;
#   .../1427.html, c8da9d9e153b3becc0a0ea6b0fa3c43568d71e3b07c86c2cbae655087e6699b9).
# - MITRE ATLAS 2026.09 (format 6.0.0) for technique, tactic and mitigation ids, the same file
#   em-01 cites (935efa93e28294432d3e2f537eb94991ef8d1f8c58341cd360ea3321ddb66688). ATLAS has
#   NO case study for this attack, so unlike em-01 every step-to-technique link below is the
#   AI drafter's mapping, not ATLAS's (README.md, gap AI-8).
#
# AI-DRAFTED, NOT REVIEWED. Every Assertion is `proposed` and no Review is recorded
# (CLAUDE.md, R-018). Feasibility and impact are human inputs and are left unset.
#
# Validate:
#   linkml-validate -s spec/vectors/example-container-proposed.linkml.yaml \
#     -C ExampleModelProposed research/0009-sagai/example-models/em-02-copilot-agent-self-approval.yaml

parties:
  - id: party:microsoft
    name: Microsoft
    description: Vendor of VS Code and Visual Studio, and the CNA that published CVE-2025-53773.
    party_kind: organization
    classifications: [vendor, cna]
  - id: party:github
    name: GitHub
    description: Vendor of GitHub Copilot (a Microsoft subsidiary).
    party_kind: organization
    classifications: [vendor]
  - id: party:cisa-adp
    name: CISA ADP Vulnrichment
    description: >-
      Authorized Data Publisher (orgId 134c704f-9b21-4f2e-91b3-4a467353bcc0). Its container in
      the CVE record gives an SSVC decision: Exploitation none, Automatable no, Technical Impact
      total. The schema has no place for that value (README.md, gap AI-5).
    party_kind: organization
    classifications: [adp]
  - id: party:embrace-the-red
    name: Embrace The Red (J. Rehberger)
    description: >-
      Independent researcher who wrote the primary write-up and reported the issue to Microsoft
      on 2025-06-29. Per the write-up, MSRC was already tracking it and Persistent Security
      reported it too, so this model names no single reporter for the CVE. Its `reported_by`
      is left unset.
    party_kind: person
    classifications: [researcher]
  - id: party:developer
    name: Developer
    description: A developer who asks Copilot about files in a project (a role, not a person).
    party_kind: person
  - id: party:ai-drafter
    name: AI model drafter
    description: The AI agent that drafted this file and proposed its ATLAS and CWE mappings.
    party_kind: software_agent

products:
  - id: product:vscode-copilot
    name: VS Code with GitHub Copilot agent mode (before the August 2025 fix)
    description: >-
      The editor and coding agent the write-up attacks, on Windows, macOS and Linux. The write-up
      gives no version numbers, and the CVE record does not list this product. See
      assertion:cve-affects-vscode-copilot and README.md, gap AI-9.
    composed_of:
      - component:copilot-agent
      - component:copilot-file-tool
      - component:copilot-terminal-tool
    manufactured_by: party:microsoft
  - id: product:visual-studio-2022
    name: Microsoft Visual Studio 2022 version 17.14 (17.14.0 to before 17.14.12)
    description: >-
      The only product the CVE record lists as affected. The write-up does not test it. The
      version range has no slot on Product, so it lives in the name (README.md, gap AI-9).
    identifiers: ["cpe:2.3:a:microsoft:visual_studio_2022:*:*:*:*:*:*:*:*"]
    manufactured_by: party:microsoft

components:
  - id: component:copilot-agent
    name: Copilot agent mode (chat)
    description: >-
      Reads files the developer points it at, sends them to the model and carries out the
      model's tool calls. It asks the developer before running a tool, unless auto-approve is
      switched on, which the write-up calls "YOLO mode". The setting is `chat.tools.autoApprove`.
    component_kind: application
    uses_component: [component:copilot-file-tool, component:copilot-terminal-tool]
    supplied_by: party:github
    in_trust_zone: trust-boundary:developer-machine
  - id: component:copilot-file-tool
    name: Copilot's file-editing tool
    description: >-
      Creates and writes files in the workspace without the developer's approval. The edits go
      to disk at once, not into a diff to review. The schema has no kind for an agent tool
      (README.md, gap AI-6).
    component_kind: service
    supplied_by: party:github
    in_trust_zone: trust-boundary:developer-machine
  - id: component:copilot-terminal-tool
    name: Copilot's terminal tool
    description: Runs shell commands for the agent, normally after the developer confirms each one.
    component_kind: service
    supplied_by: party:github
    in_trust_zone: trust-boundary:developer-machine
  - id: component:copilot-llm
    name: Language model behind Copilot
    description: >-
      Writes the agent's replies and tool calls. The write-up does not name the model; it notes
      that not all models follow invisible instructions.
    component_kind: machine_learning_model
    supplied_by: party:github
    in_trust_zone: trust-boundary:copilot-service
  - id: component:workspace-folder
    name: The project folder on disk
    description: >-
      Holds the project's source files and its VS Code settings, which VS Code applies when the
      project is opened. The settings file is `.vscode/settings.json`.
    component_kind: file
    in_trust_zone: trust-boundary:workspace
  - id: component:host-os
    name: The developer's operating system and shell
    description: Windows, macOS or Linux; the write-up demonstrates all three.
    component_kind: operating_system
    in_trust_zone: trust-boundary:developer-machine
  - id: component:attacker-content
    name: Attacker-controlled content
    description: >-
      Where the instructions come from: a source file (the write-up's demo), a web page, a
      GitHub issue or a tool response such as an MCP server's. Not part of the product.
    component_kind: service
    in_trust_zone: trust-boundary:internet
  - id: component:c2-server
    name: Attacker's command-and-control server
    description: The write-up's demo joins the machine to it ("ZombAI"). Not part of the product.
    component_kind: service
    in_trust_zone: trust-boundary:internet
  - id: component:git-remotes
    name: The projects' Git remotes
    description: Where infected commits would be pushed (the write-up's "AI virus"). Not part of the product.
    component_kind: service
    in_trust_zone: trust-boundary:internet

assets:
  - id: asset:developer-machine
    name: The developer's machine and what the developer's account can reach
    description: >-
      Code the agent runs has the developer's rights. The write-up names malware, ransomware and
      info stealers as follow-ons; CISA's SSVC rates the technical impact "total".
    security_properties: [confidentiality, integrity, availability]
    processed_by: [component:host-os]
    owned_by: party:developer
  - id: asset:workspace-settings
    name: The project's VS Code settings (.vscode/settings.json)
    description: >-
      One setting here decides whether Copilot asks before each tool call. The write-up names
      the project's task definitions, MCP server lists and other agents' configuration files as
      further security-relevant files the agent can write in the same folder. The setting is
      `chat.tools.autoApprove`; the task file is `.vscode/tasks.json`.
    security_properties: [integrity]
    stored_in: [component:workspace-folder]
    processed_by: [component:copilot-agent]
  - id: asset:project-source
    name: The project's source code and Git history
    security_properties: [integrity]
    stored_in: [component:workspace-folder]
    processed_by: [component:copilot-agent]
    owned_by: party:developer
  - id: asset:copilot-context
    name: Copilot's prompt context for one request
    description: >-
      The developer's request plus the files the agent read, including the planted instructions.
      As in em-01, the instructions and the developer's own content arrive in one context.
    security_properties: [integrity]
    processed_by: [component:copilot-llm]

trust_boundaries:
  - id: trust-boundary:internet
    name: The internet (untrusted authors and servers)
  - id: trust-boundary:developer-machine
    name: The developer's machine
  - id: trust-boundary:workspace
    name: The opened project folder
    description: >-
      Anyone who contributed to the project, or wrote a file the developer downloaded, controls
      content here; yet VS Code applies settings found here and the agent may write here freely.
      The boundary the attack crosses is between that content and the agent's own configuration,
      both inside this folder (README.md, gap AI-3).
    within_boundary: trust-boundary:developer-machine
  - id: trust-boundary:copilot-service
    name: GitHub Copilot service (cloud)

data_flows:
  - id: data-flow:content-to-workspace
    name: The planted instructions reach the project
    description: >-
      By clone, pull or download, or fetched by the agent from a page, issue or tool. They are
      not an Asset, so `carries` cannot name them (README.md, gap AI-3).
    flow_from: component:attacker-content
    flow_to: component:workspace-folder
    crosses_boundary: [trust-boundary:internet, trust-boundary:workspace]
  - id: data-flow:file-to-agent
    name: The agent reads the file the developer asked about
    flow_from: component:workspace-folder
    flow_to: component:copilot-agent
    carries: [asset:project-source]
  - id: data-flow:agent-model
    name: The agent sends the context to the model and gets back replies and tool calls
    flow_from: component:copilot-agent
    flow_to: component:copilot-llm
    carries: [asset:copilot-context]
    bidirectional: true
    protocol: HTTPS
    crosses_boundary: [trust-boundary:developer-machine, trust-boundary:copilot-service]
  - id: data-flow:tool-writes-settings
    name: The file tool writes "chat.tools.autoApprove" true into .vscode/settings.json
    description: Written to disk at once, with no approval and no diff. The folder and file are created if missing.
    flow_from: component:copilot-file-tool
    flow_to: component:workspace-folder
    carries: [asset:workspace-settings]
  - id: data-flow:settings-to-agent
    name: VS Code applies the workspace setting, and the agent stops asking before tool calls
    flow_from: component:workspace-folder
    flow_to: component:copilot-agent
    carries: [asset:workspace-settings]
  - id: data-flow:terminal-to-os
    name: The terminal tool runs the attacker's command
    description: With the developer's rights; nothing the command is or does is an Asset on this flow.
    flow_from: component:copilot-terminal-tool
    flow_to: component:host-os
  - id: data-flow:host-to-c2
    name: The machine connects to the attacker's command-and-control server
    flow_from: component:host-os
    flow_to: component:c2-server
    crosses_boundary: [trust-boundary:developer-machine, trust-boundary:internet]
  - id: data-flow:push-to-remotes
    name: Infected commits are pushed to other projects' remotes
    flow_from: component:workspace-folder
    flow_to: component:git-remotes
    carries: [asset:project-source]
    protocol: Git
    crosses_boundary: [trust-boundary:developer-machine, trust-boundary:internet]

weaknesses:
  - id: weakness:cwe-77
    name: "Improper Neutralization of Special Elements used in a Command ('Command Injection')"
    description: >-
      The CWE the CNA gave. CWE marks CWE-77 a Class with mapping usage ALLOWED-WITH-REVIEW,
      reason Frequent Misuse ("often misused when OS command injection (CWE-78) was intended").
    catalog_ref: "CWE-77"
  - id: weakness:cwe-1427
    name: Improper Neutralization of Input Used for LLM Prompting
    description: >-
      Base, mapping usage ALLOWED. The model cannot tell the planted file content apart from the
      developer's request. AI-proposed as the root cause; see assertion:cve-cwe-1427.
    catalog_ref: "CWE-1427"
  - id: weakness:cwe-15
    name: External Control of System or Configuration Setting
    description: >-
      Base, mapping usage ALLOWED: "One or more system settings or configuration elements can be
      externally controlled by a user." Here the agent, steered by outside content, turns off its
      own confirmations. AI-proposed; see assertion:settings-step-exploits-cwe-15.
    catalog_ref: "CWE-15"

vulnerabilities:
  - id: vulnerability:cve-2025-53773
    name: GitHub Copilot and Visual Studio Remote Code Execution Vulnerability
    description: >-
      CVE record: "Improper neutralization of special elements used in a command ('command
      injection') in GitHub Copilot and Visual Studio allows an unauthorized attacker to execute
      code locally." CNA CVSS 3.1 base score 7.8
      (CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H/E:U/RL:O/RC:C). Published 2025-08-12, the
      August 2025 Patch Tuesday. The CVE Program container references the write-up.
    catalog_ref: "CVE-2025-53773"
    affects: [product:visual-studio-2022]
    assigned_by: party:microsoft
    instance_of: [weakness:cwe-77]

attack_patterns:
  - {id: "attack-pattern:aml-t0099", name: AI Agent Tool Data Poisoning, catalog_ref: "AML.T0099"}
  - {id: "attack-pattern:aml-t0068", name: LLM Prompt Obfuscation, catalog_ref: "AML.T0068"}
  - {id: "attack-pattern:aml-t0051-001", name: "LLM Prompt Injection: Indirect", catalog_ref: "AML.T0051.001"}
  - {id: "attack-pattern:aml-t0081", name: Modify AI Agent Configuration, catalog_ref: "AML.T0081"}
  - {id: "attack-pattern:aml-t0053", name: AI Agent Tool Invocation, catalog_ref: "AML.T0053"}
  - {id: "attack-pattern:aml-t0072", name: Cyber Communication Channel, catalog_ref: "AML.T0072"}
  - {id: "attack-pattern:aml-t0061", name: LLM Prompt Self-Replication, catalog_ref: "AML.T0061"}
  - {id: "attack-pattern:aml-t0048", name: External Harms, catalog_ref: "AML.T0048"}

damage_scenarios:
  - id: damage-scenario:machine-compromised
    name: The attacker runs any code on the developer's machine, with the developer's rights
    description: >-
      Demonstrated by the write-up (a calculator, then malware joining a command-and-control
      server). CISA's SSVC says Exploitation none; this is the harm the attack makes possible.
    damages_asset: [asset:developer-machine]
    compromised_property: [confidentiality, integrity, availability]
  - id: damage-scenario:projects-infected
    name: Other projects, and the developers who open them, receive the attacker's instructions
    description: Described in the write-up ("Building an AI Virus"), not shown in its demos.
    damages_asset: [asset:project-source]
    compromised_property: [integrity]

threat_instances:
  - id: threat-instance:agent-self-approval-rce
    name: Instructions in a project file make Copilot switch off its own confirmations and run commands
    realizes_damage: damage-scenario:machine-compromised
    method_facet: [stride]
    source_method: "published attack, modeled from the cited sources (AI-drafted, unreviewed)"
    violates_property: "E elevation of privilege (the agent grants itself auto-approval); T tampering (the workspace settings)"
    applies_in_phase: [lifecycle-phase:operation]
    targets_element: [component:copilot-agent, data-flow:tool-writes-settings, asset:workspace-settings]
  - id: threat-instance:self-spreading-instructions
    name: The hijacked agent copies the instructions into other projects, which spread them further
    realizes_damage: damage-scenario:projects-infected
    method_facet: [stride]
    source_method: "published attack, modeled from the cited sources (AI-drafted, unreviewed)"
    violates_property: "T tampering (other projects' source)"
    applies_in_phase: [lifecycle-phase:operation]
    targets_element: [asset:project-source, data-flow:push-to-remotes]

attack_steps:
  # From the write-up's "Exploit Chain Explained", in its order. ATLAS has no case study for this
  # attack; each tactic in kill_chain_phase is ATLAS's tactic for the AI-proposed technique.
  - id: attack-step:plant-instructions
    name: Plant instructions in a file the developer will ask Copilot about
    description: The write-up's demo uses a source-code comment; a web page, GitHub issue or MCP tool response also work.
    kill_chain_phase: "Persistence (AML.TA0006)"
    precedes: [attack-step:hide-instructions, attack-step:agent-follows-instructions]
  - id: attack-step:hide-instructions
    name: Hide the instructions as invisible Unicode text
    description: >-
      The write-up's variant. It worked several times but was "very unreliable", was often
      refused by the model, and VS Code typically shows an indicator for such characters.
    kill_chain_phase: "Defense Evasion (AML.TA0007)"
    precedes: [attack-step:agent-follows-instructions]
  - id: attack-step:agent-follows-instructions
    name: The developer asks Copilot about the file, and the agent follows the planted instructions
    description: Reached from either the visible or the invisible variant, an OR gate.
    gate: or_gate
    kill_chain_phase: "Execution (AML.TA0005)"
    precedes: [attack-step:enable-auto-approve]
  - id: attack-step:enable-auto-approve
    name: The agent writes "chat.tools.autoApprove" true into .vscode/settings.json
    description: >-
      No approval is asked and the write takes effect at once: the agent is in "YOLO mode", and
      every later tool call runs without the developer's confirmation. The confirmation prompt
      was a defense, and the agent switched it off itself (README.md, gap AI-7).
    kill_chain_phase: "Defense Evasion (AML.TA0007)"
    precedes: [attack-step:run-command]
  - id: attack-step:run-command
    name: The agent runs a terminal command chosen for the developer's operating system
    description: The write-up uses "conditional prompt injection" to pick the command per OS; its demo opens a calculator.
    kill_chain_phase: "Execution (AML.TA0005)"
    precedes: [attack-step:join-c2, attack-step:infect-projects]
  - id: attack-step:join-c2
    name: Download malware and join a command-and-control server
    kill_chain_phase: "Command and Control (AML.TA0014)"
    precedes: [attack-step:machine-compromised]
  - id: attack-step:machine-compromised
    name: The attacker controls the developer's machine
    kill_chain_phase: "Impact (AML.TA0011)"
  - id: attack-step:infect-projects
    name: Insert the instructions into the developer's other Git projects and commit or push them
    description: Described in the write-up, not shown in its demos.
    kill_chain_phase: "Persistence (AML.TA0006)"
    precedes: [attack-step:projects-spread]
  - id: attack-step:projects-spread
    name: Other developers open the infected projects with their own agents
    description: Described in the write-up, not shown in its demos.
    kill_chain_phase: "Impact (AML.TA0011)"

attack_paths:
  - id: attack-path:visible-instructions
    name: Planted file to machine takeover (the write-up's demo)
    steps:
      - attack-step:plant-instructions
      - attack-step:agent-follows-instructions
      - attack-step:enable-auto-approve
      - attack-step:run-command
      - attack-step:join-c2
      - attack-step:machine-compromised
    realizes_threat: threat-instance:agent-self-approval-rce
  - id: attack-path:invisible-instructions
    name: Planted file to machine takeover, with invisible instructions
    description: The same path with the hiding step; the write-up calls it less reliable.
    steps:
      - attack-step:plant-instructions
      - attack-step:hide-instructions
      - attack-step:agent-follows-instructions
      - attack-step:enable-auto-approve
      - attack-step:run-command
      - attack-step:join-c2
      - attack-step:machine-compromised
    realizes_threat: threat-instance:agent-self-approval-rce
  - id: attack-path:self-spreading
    name: Planted file to infected projects
    description: Shares its first four steps with the takeover path, then branches after the command runs.
    steps:
      - attack-step:plant-instructions
      - attack-step:agent-follows-instructions
      - attack-step:enable-auto-approve
      - attack-step:run-command
      - attack-step:infect-projects
      - attack-step:projects-spread
    realizes_threat: threat-instance:self-spreading-instructions

mitigations:
  - id: mitigation:microsoft-august-2025-fix
    name: Microsoft's fix (August 2025 Patch Tuesday)
    description: >-
      The write-up says the issue is fixed in the August 2025 release; the CVE record gives
      Visual Studio 2022 17.14.12 as the first fixed version. Neither source says what the fix
      changed or which VS Code and Copilot versions carry it.
    mitigates: [threat-instance:agent-self-approval-rce, threat-instance:self-spreading-instructions]
    applies_in_phase: [lifecycle-phase:operation]
    implementation_owner: party:microsoft
    mitigation_status: complete
  - id: mitigation:approve-file-edits
    name: Ask the developer before the agent writes any file, and show the diff
    description: The write-up's recommendation ("Many other editors do show the diff"); status not published.
    catalog_ref: "AML.M0029"
    mitigates: [threat-instance:agent-self-approval-rce, threat-instance:self-spreading-instructions]
    applies_in_phase: [lifecycle-phase:design]
    implementation_owner: party:github
    mitigation_status: planned
  - id: mitigation:protect-agent-configuration
    name: Keep the agent from writing its own or other agents' configuration
    description: >-
      Covers the editor settings, task definitions, MCP server lists and other agents'
      configuration files, the further attack angles the write-up names. A model suggestion;
      status not published.
    catalog_ref: "AML.M0028"
    mitigates: [threat-instance:agent-self-approval-rce]
    applies_in_phase: [lifecycle-phase:design]
    implementation_owner: party:github
    mitigation_status: planned
  - id: mitigation:no-tools-from-untrusted-content
    name: Do not let instructions found in untrusted content trigger tool calls
    description: A model suggestion from ATLAS's mitigation list, not from the write-up; status not published.
    catalog_ref: "AML.M0030"
    mitigates: [threat-instance:agent-self-approval-rce, threat-instance:self-spreading-instructions]
    applies_in_phase: [lifecycle-phase:design]
    implementation_owner: party:github
    mitigation_status: planned

