- id: Requirement
  layer: catalog
  definition: 'A normative statement published by a RequirementSource. Tier is either process (an obligation on the producer''s SDL: SSDF task, 62443-4-1
    SM-1, SAMM activity) or product-catalog (a property the software must have: ASVS requirement, CRA Annex I Part I point). Grain is objective (crosswalk
    unit) or testable (evaluation unit).'
  key_attributes:
  - id = <record>#<native_id> (edition-qualified)
  - text
  - tier (process|product-catalog)
  - grain (objective|testable)
  - normativity (shall|should|recommendation|consideration|informative|observed-practice)
  - nature (activity|deliverable|mechanism|configuration)
  - status (active|draft|deprecated|retired|rescinded) + replaced_by
  - applicability_condition (event/state trigger)
  - verification_mode (artifact-exists|artifact-content|product-behaviour-test|interview|automated-probe)
  - level membership (via applies_at)
  - parameters (ODP)
  arch_0001_mapping:
    status: NEW
    target: 'Requirement (DL-0009 R-042/R-044); ARCH §7 lists ''audit (Requirement/WorkProduct)'' as post-MVP #19; not yet a §13 class'
