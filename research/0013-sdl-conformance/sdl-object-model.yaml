enumerations:
  MitigationInstance.kind (R-040, MVP-adjacent):
    values:
    - value: technical
      meaning: implemented mechanism or feature in the product or its development environment (control, secure default, update, rollback, branch protection)
      sources:
      - library:bsi-tr-03183-1 §4.6 (ControlType Mechanism)
      - library:fda-premarket-cybersecurity-guidance §V.B.1 (SecurityControl)
      - library:sp-800-218r1 PS.4.3 (RollbackMechanism)
      - 'library:slsa-1-2 source-requirements.md #protected-refs (TechnicalControl)'
      - library:enisa-sbd-playbook-2026 §3.2 (SecureDefault)
      status: proposed
    - value: documentation
      meaning: a deliverable that informs or instructs (user/security guidance, labeling, accompanying documentation, advisory, documented security decision)
      sources:
      - library:bsi-tr-03183-1 §4.6 (ControlType Documentation)
      - library:iec-62443-4-1-2018 SG-1..SG-6
      - library:eu-cra-2024-2847 Art. 13(18); Annex II
      - library:owasp-asvs-5 Documented security decisions (31 documentation requirements)
      - library:iec-81001-5-1-2021 ISH1 a), 4.1.9 NOTE (ACCOMPANYING_DOCUMENTATION)
      status: proposed
    - value: process
      meaning: an organisational activity performed with an output (training, CVD/PSIRT, review, management plan, RCA)
      sources:
      - library:bsi-tr-03183-1 §4.6 (ControlType Activity)
      - library:sp-800-218 PO.2.2 (TrainingProgram)
      - library:fda-premarket-cybersecurity-guidance §VI.B (CybersecurityManagementPlan)
      - library:eu-cra-2024-2847 Annex I Part II(5) (CVD policy)
      - library:iso-iec-30111-2019 §6.1 (VulnerabilityHandlingProcess)
      status: proposed
    - value: configuration (candidate 4th value, NOT recommended)
      meaning: platform/development-environment configuration (branch protection, MFA, CI token defaults)
      sources:
      - library:openssf-osps-baseline design-notes B3
      status: minority proposal — fold into technical with a target=development-environment attribute
    per_kind_verification_rule:
    - 'technical: implemented as described'
    - 'documentation: provided in the described manner'
    - 'process: performed, with its output produced'
    - 'source: library:bsi-tr-03183-1 §4.6 (PASS rule per control type); design-notes R-040'
    orthogonal_optional_axes (post-MVP):
    - value: locus ∈ {designed-in, user-deployed, transferred}
      meaning: who operates the mitigation
      sources:
      - library:fda-premarket-cybersecurity-guidance App. 5; §V.A (CompensatingControl); design-notes D1
      status: proposed
    - value: default_enabled ∈ {true,false}
      meaning: secure-by-default vs available-but-off
      sources:
      - library:enisa-sbd-playbook-2026 §3.2; design-notes
      - library:cisa-secure-by-design-2023 Secure by Default p. 9 (SecureDefaultBaseline)
      status: proposed
    - value: effect ∈ {removes, mitigates}
      meaning: remediation removes; mitigation/workaround reduces
      sources:
      - library:iso-iec-29147-2018 §3.7
      status: proposed
    - value: control_function ∈ {preventive, detective, corrective, compensating}
      meaning: BSIMM activity function
      sources:
      - library:bsimm-16 p.45; design-notes Q3
      status: proposed
    - value: polarity (documentation) ∈ {hardening, loosening}
      meaning: steps to secure vs risky deviations from secure defaults
      sources:
      - library:cisa-secure-by-design-2023 Hardening vs Loosening p. 32
      status: proposed
  Disposition (threat/finding treatment; refines DEC-009 and R-045 mitigation status):
    values:
    - value: mitigate / fix
      meaning: treat by MitigationInstance
      sources:
      - library:sp-800-218 PW.1.2/E1; RV.2.2 (RiskResponse type)
      - library:iec-62443-4-1-2018 SR-2 k)
      - library:enisa-sbd-playbook-2026 §4.13
