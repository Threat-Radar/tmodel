- id: Attestation
  layer: assurance
  definition: 'A signed, scoped claim issued by a Party: conformance attestation, certification, declaration of conformity, verification summary (VSA),
    badge or label, or forward-looking commitment. It covers a subject (product, version range, organization, artifact digest) against a requirement set.
    It has a signatory, an assurance mode, revocation and a disclosure tier.'
  key_attributes:
  - kind (conformance-attestation|certification|declaration-of-conformity|verification-summary|badge/label|commitment|supply-chain-provenance)
  - issuer (Party) + signatory (Party, authority)
  - subject + scope (company|product|versions; forward-binding until revoked)
  - affirms (Requirement set @ edition)
  - modality (present|commitment)
  - assurance (self|third-party)
  - signature/envelope
  - issued_at / valid_until / revoked_at
  - disclosure_tier (public layer|restricted overlay)
  - registry/listing
  arch_0001_mapping:
    status: extension
    target: subtype of Assertion (§4) with signer, scope and revocation; artifact-bound supply-chain attestations stay in the radar→tmodel contract (ADR-0001)
  scope: post-MVP
  support:
    sources: 21
    source_objects: 31
    stated: 31
    inferred: 0
  supporting_records:
