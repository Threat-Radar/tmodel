      status: proposed
    - value: inconclusive / not-evaluable
      meaning: evidence unavailable or tool error; never counted as pass
      sources:
      - library:openssf-scorecard-checks finding.go (NotAvailable, Error, NotSupported); check_result.go (Inconclusive -1)
      status: proposed
    - value: partial
      meaning: partly implemented (degree recorded)
      sources:
      - library:esf-sscs-developers-2022 App. D ("Incomplete (Inc)" response; review 2026-10-03 moved it here from inconclusive)
