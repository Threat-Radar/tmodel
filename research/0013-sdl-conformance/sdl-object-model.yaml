  layer: program
  definition: 'A typed, machine-checkable exit criterion a Gate evaluates. Forms: severity threshold (bug bar, shall-fix), level target (Targeted LoT, ASVS
    level, SLSA level), evidence presence/freshness, signed policy over attestations, residual-risk acceptance rule, process-completion record, and the
    ''threats-mitigated'' predicate.'
  key_attributes:
  - form (severity-threshold|level-target|evidence-presence|policy-over-attestations|risk-acceptance-rule|process-completion|threats-mitigated)
