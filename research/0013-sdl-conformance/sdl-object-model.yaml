      status: proposed
    - value: no-fix
      meaning: explicitly not fixed; residual risk accepted
      sources:
      - library:bsi-tr-03185 Glossary Solution; PROD.FIX.A.8
      status: proposed
    - value: temporary-mitigation | stop-use | roll-back
