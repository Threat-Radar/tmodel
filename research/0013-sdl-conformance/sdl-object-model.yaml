- id: ConformanceResult
  layer: assurance
  definition: The per-requirement (or per-criterion) outcome of an assessment or automated check. It is reified as an Assertion with outcome, optional level
    or score, N/A reason, evidence links, the pinned requirement-set version, verifier, time and validity window. Its shape follows the SLSA VSA predicate.
  key_attributes:
  - outcome (pass|fail|not-applicable|inconclusive|partial|gap-with-accepted-plan|waived|not-assessed)
  - native_outcome (source scheme value, kept verbatim)
  - na_reason (closed list)
  - level_achieved / score + scale
  - about (Requirement|ConformanceCriterion)
  - subject (ProductInstance|SDLProgram|Party)
  - policy {uri, digest} / requirement-set version
  - evidence[] / input attestations
  - verifier
  - time_verified
  - valid_from / valid_to
