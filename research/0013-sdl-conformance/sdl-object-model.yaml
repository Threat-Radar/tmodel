- id: Exception
  layer: execution
  definition: 'A time-bound, approved departure from a requirement, gate criterion or deadline: a requirement waiver, risk acceptance, deadline extension,
    risk transfer or risk share. It carries a rationale, compensating plan, approver at the right authority level, expiry and re-review, and it may carry
    debt to the next release.'
  key_attributes:
  - kind (requirement-waiver|risk-acceptance|deadline-extension|risk-transfer|risk-share)
  - excepts (Requirement|GateCriterion|Milestone|ThreatInstance|Finding)
  - rationale
  - compensating/remediation plan
  - residual risk
  - approver + approver_level (by severity)
  - valid_from / expires_at (mandatory)
  - next_review
  - carried_to_release
  - counterparty (transfer/share)
  arch_0001_mapping:
    status: extension
