- id: ThreatModel
  layer: governance
  definition: The scoped, versioned threat-model container for a product, environment or build pipeline (threat model, risk model, CRA cybersecurity risk
    assessment, published threat model). The SDL requires it, reviews it and refreshes it. Its content is the ARCH threat layer, and its document form is
    a GovernedDocumentView.
  key_attributes:
  - 'scope (Product version, environments: enterprise|development|customer, phases)'
  - method (STRIDE, attack trees, …) + rationale
  - context (intended purpose, foreseeable misuse, operational environment, assets, expected use time)
  - assumptions
  - last_reviewed / review cadence (≥ yearly)
  - refresh_triggers
  - approvers (quorum)
  - disclosure (internal | controlled-to-customer | public high-level)
  arch_0001_mapping:
    status: NEW
    target: explicit scope node for 'the tmodel threat model itself' (ThreatInstance/AttackPath set, §1.3) + governed view (R-043); ARCH has no ThreatModel
      class
  scope: post-MVP as an SDL object (the threat content itself is MVP)
