- id: Evidence
  layer: execution
  definition: An artifact used to show a requirement or criterion is met. It is either a by-product of development (tool output, test report, log, review
    record) or an authored work product (design, plan, record). It is version-bound to a ProductInstance, digest-identified, and carries provenance (who
    and what generated it), freshness, retention and disclosure tier.
  key_attributes:
  - type
  - nature (by-product|work-product)
  - generated_by (Tool|Activity|Party)
  - about (ProductInstance version)
  - digest
  - timestamp / fresh_until
  - retention
  - disclosure_tier (public|nda|government|confidential)
  - gathered_by (producer|consumer|assessor)
  - integrity_protection
