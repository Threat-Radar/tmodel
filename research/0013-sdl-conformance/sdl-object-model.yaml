- id: Gate
  layer: program
  definition: A named, ordered, dated governance decision point in an SDLProgram (release gate, FSR, checkpoint, quality gate, regulatory submission, deployment
    admission, change status check). It is evaluated against exit criteria and decided by an approving Review, with outcomes and tracked exceptions.
  key_attributes:
  - local_name + canonical boundary (from_phase→to_phase)
  - order
  - planned_date / actual_date
  - owner
  - approver role (+ quorum)
  - entry_criteria (milestones/inputs)
  - exit_criteria[] (GateCriterion)
  - 'enforced (bool: observe-only vs blocking)'
  - outcome (passed|passed-with-exceptions|escalated|failed)
  - exceptions[]
  - grain (program|release|change|deployment|intake)
