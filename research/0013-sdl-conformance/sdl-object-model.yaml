objects:
- id: PartyRole
  layer: parties
  definition: 'The SDL role vocabulary. Each value is a relational role a Party plays toward a product, program, requirement or document (ARCH §2b: roles
    are edges, identity is one Party). Source objects are grouped into role families. Review 2026-10-03: PartyRole is a controlled vocabulary of relational
    edge types (ARCH-0001 §2b critic M2), not a node.'
  key_attributes:
  - role_family
  - role (local name)
  - relative_to (Product|SDLProgram|Requirement|Document|Party)
  - intrinsic classification (standards-body|csirt|cna|regulator|notified-body)
