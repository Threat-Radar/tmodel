- id: GovernedDocumentView
  layer: governance
  definition: A named, versioned, approvable projection over the KG (threat-model report, technical documentation, assessment or verification report, policy,
    plan, inventory, transparency report, release archive). Governance metadata (owner, approvers, version, status, change history, audience, retention)
    is stamped from a KG snapshot, and the KG remains the SoT.
  key_attributes:
  - doc_type
  - view_spec (query/projection) ref
  - kg_snapshot (commit/digest)
  - version
  - status (draft|in-review|approved|published|superseded|stale)
  - owner (Party role)
  - approvers[] + quorum
  - change_history (PROV)
  - audience/disclosure (internal|customer|public|regulator; NDA)
  - published_url/date
  - retention_until
  - review_cadence + refresh_triggers
  - omission_justification
  - language
