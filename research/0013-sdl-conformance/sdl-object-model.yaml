- id: CrosswalkMapping
  layer: catalog
  definition: A reified, reviewable mapping between a requirement and a requirement in another source or edition. It carries a typed relationship, strength
    or confidence, direction, the asserting party (source-published vs our inference) and the pinned target edition. It is the unit of MAP-0001.
  key_attributes:
  - source_requirement (record#id @edition)
  - target_requirement (record#id @edition)
  - 'relationship (equivalent|subsumes|subsumed-by|implements|implemented-by|supports|supported-by|refines|derived-from|induced-by|relates-to|no-match|version:
    added|moved|modified|split|merged)'
  - strength (1-10 | source-of|induced-by|equivalent | equivalent|partial|derived)
  - confidence
  - authority (normative|informative|indicative|source-asserted|our-inference)
  - granularity (document|chapter|control|AR)
  - review (Review) before use in conformance
