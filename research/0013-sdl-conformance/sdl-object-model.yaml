- id: MitigationInstanceExt
  layer: execution
  definition: 'R-040 extension of ARCH §5 MitigationInstance. A mitigation is a technical feature or mechanism, a documentation deliverable, or a process
    step. Each carries owner, status, effectiveness, verification and evidence, plus optional orthogonal axes: locus, default-on, effect and control function.'
  key_attributes:
  - kind (technical|documentation|process) — MVP-adjacent
  - status (DEC-009)
  - owner/implementation_owner
  - locus (designed-in|user-deployed|transferred)
  - default_enabled (bool)
  - effect (removes|mitigates)
  - control_function (preventive|detective|corrective|compensating)
  - 'polarity (for documentation: hardening|loosening)'
  - verification rule per kind (performed+output | implemented-as-described | provided-as-described)
  arch_0001_mapping:
    status: extension
    target: MitigationInstance (§5) + R-040 kind
  scope: MVP-adjacent (kind only)
  support:
    sources: 28
    source_objects: 77
    stated: 77
    inferred: 0
  supporting_records:
