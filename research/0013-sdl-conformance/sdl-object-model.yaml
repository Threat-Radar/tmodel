- id: VulnerabilityHandlingPolicy
  layer: execution
  definition: 'The producer''s vulnerability disclosure and handling arrangement: the external disclosure policy (VDP / CVD policy, security.txt or SECURITY.md),
    the internal handling policy and process (ISO/IEC 30111), and the response plan or playbook. It is a process-kind mitigation that satisfies CRA Annex
    I Part II, ISO/IEC 29147/30111 and similar requirements; the published policy is rendered as a GovernedDocumentView.'
