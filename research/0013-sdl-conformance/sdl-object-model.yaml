- id: FindingHandling
  layer: execution
  definition: 'The SDL view of ARCH Finding/Vulnerability: a security issue from any source (test, review, threat model, external report, monitoring), with
    a handling state machine, disposition, fix class, severity/bug-bar rank, SLA timers, root cause and exploited/KEV status. Gates evaluate it.'
  key_attributes:
  - source (test|review|tm|report|monitoring)
  - handling_state (received|verified|remediation-development|released|post-release)
  - disposition (fix|mitigate|accept|transfer/share|defer|no-fix|not-affected)
  - fix_class (shall|should)
  - severity (bug-bar rank, CVSS)
  - affected versions
  - actively_exploited (evidence-bearing)
  - sla_due
  - root_cause
  arch_0001_mapping:
    status: extension
    target: Finding/Vulnerability (§1.3) + DEC-009 lifecycle; per-vulnerability phases ≠ product LifecyclePhase
  scope: post-MVP (Finding is MVP; handling states are not)
