      status: proposed
    - value: waived / passed-with-exceptions
      meaning: not met; approved Exception in force
      sources:
      - library:microsoft-sdl-5-2 Possible FSR Outcomes
      - library:bsimm-16 [SM1.7]
      status: proposed
      note: 'Review 2026-10-03 removed omb-m-22-18 §III.A.7: that waiver exempts an agency from the memorandum''s requirements; it is an Exception (Exception.kind
        requirement-waiver, agency side), not a per-requirement outcome.'
    - value: not-assessed
      meaning: in scope but not yet evaluated
      sources:
      - analysis (needed so absence ≠ fail)
      status: inferred
    graded_extensions:
    - value: level_achieved
      meaning: per-practice maturity / assurance level
      sources:
      - library:iec-62443-4-1-2018 §4.2 Table 1 (ML1–ML4; inferred, ToC only)
