method:
- Each source object or edge in distilled/object-model.yaml is assigned to exactly one canonical type by its stated definition and the source's first-listed
  tmodel_mapping. A second role is noted, not double-counted.
- Support = number of distinct records with at least one absorbed object or edge. Locators, kinds (stated/inferred) and source mappings are copied verbatim
  from the source YAML; none are typed by hand.
- Canonical names are proposals for iteration 7. arch_0001_mapping.status is existing | extension | NEW against ARCH-0001-PROPOSAL proposed.10. Nothing
  here is accepted (every DEC-* stays open).
- Source objects that map to the existing threat-model or product layers (ARCH §1 layers 1–3) and have no SDL role are listed by bucket under unassigned_source_objects.
  They are not re-specified here.
- 'Adversarial review 2026-10-03 (v0.2.0): 110 source objects/edges re-clustered, 4 canonical objects and 6 canonical edges added, 3 edge cardinalities
  corrected; every move is listed under adversarial_review_2026_10_03.moves.'
