  layer: program
  definition: An organization's documented, versioned secure development lifecycle and its governance, scoped to products. It may be org-wide (ONF, SSI)
    or a per-product instance, and it may be producer-side or consumer-side (assurance policy). It holds the gates, the program plan, owners and metrics.
