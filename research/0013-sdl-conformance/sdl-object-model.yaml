- id: SecurityRiskAssessment
  layer: governance
  definition: 'A documented assessment of cybersecurity risk for a product (producer side) or for a product an acquirer uses (acquirer side): context, intended
    purpose and foreseeable use, risk analysis, treatment and acceptance. It scopes and consumes the threat model and decides which requirements apply and
    at what target level. Distinct from ThreatModel: FDA has the threat model inform the risk assessment, Microsoft SDL 5.2 has the risk assessment decide
    which parts need a threat model, and the CRA requires a risk assessment without naming threat modelling.'
  key_attributes:
  - side (producer|acquirer)
  - scope (Product version, intended purpose, foreseeable use, environment)
  - method / risk criteria (impact, likelihood/exploitability, acceptance)
  - risk register entries (risk, owner, treatment, status)
  - applicability decisions (requirement → applies | N/A + justification)
  - target level decisions (e.g. ASVS level, LoT)
  - approver + version + review cadence
  arch_0001_mapping:
    status: NEW
    target: risk-assessment artifact; its per-threat content maps to ThreatInstance + RiskScore (§1.3, §3, composite risk vector R-045); the document is
      a GovernedDocumentView (R-043); ARCH has no class for the assessment itself
  scope: post-MVP (risk values are MVP via RiskScore; the assessment artifact is not)
  support:
